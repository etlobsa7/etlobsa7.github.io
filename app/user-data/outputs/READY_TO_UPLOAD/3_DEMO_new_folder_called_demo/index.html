<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230E2743%27/%3E%3Crect x=%278%27 y=%2717%27 width=%273.6%27 height=%277%27 rx=%271.3%27 fill=%27%23fff%27 opacity=%27.55%27/%3E%3Crect x=%2714.2%27 y=%2712%27 width=%273.6%27 height=%2712%27 rx=%271.3%27 fill=%27%23fff%27 opacity=%27.8%27/%3E%3Crect x=%2720.4%27 y=%278%27 width=%273.6%27 height=%2716%27 rx=%271.3%27 fill=%27%235DA2F2%27/%3E%3C/svg%3E">
<title>Etlob Sa7 demo</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E2743; --navy-2:#163456; --navy-3:#21466F;
  --ink:#13202F; --body:#3B4A5A; --muted:#66768A; --faint:#98A6B6;
  --line:#DCE3EB; --line-2:#EDF1F5; --paper:#FFFFFF; --wash:#F4F6F9; --wash-2:#E9EEF4;
  --accent:#1A6DD4; --accent-2:#1459B0; --accent-bg:#E8F1FC;
  --crit:#B42318; --crit-bg:#FDECEA;
  --order:#8A5100; --order-bg:#FFF0D1;
  --ok:#157346; --ok-bg:#E2F2E9;
  --over:#2B5EA7; --over-bg:#E6EEFA;
  --none:#5E6B7A; --none-bg:#EDF0F3;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:Inter, "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r:10px;
}
html[lang="ar"]{
  --sans:"IBM Plex Sans Arabic", Inter, system-ui, "Segoe UI", Tahoma, Arial, sans-serif;
  --serif:"IBM Plex Sans Arabic", Georgia, serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--wash);color:var(--body);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
[hidden]{display:none !important}
h1,h2,h3{color:var(--ink);margin:0;line-height:1.2}
h1{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.01em}
h2{font-family:var(--serif);font-size:20px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0 0 .8em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.t td.num,.t th.num{text-align:end;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.nowrap{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* ---------- boot + login ---------- */
.boot{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.login-brand{background:var(--navy);color:#C9D6E6;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login-brand h2{color:#fff;font-size:38px;line-height:1.15;max-width:17ch;margin-top:28px}
.login-brand p{max-width:40ch;margin-top:14px}
.login-form{display:grid;place-items:center;padding:32px}
.login-card{width:100%;max-width:380px}
.login-card h1{margin-bottom:8px}
.login-card .lede{color:var(--muted);margin-bottom:22px}
.login-card label{display:block;font-weight:600;color:var(--ink);margin-bottom:6px}
.login-card input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:16px}
.login-card input.code{letter-spacing:.4em;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.login-card .btn{width:100%;margin-top:14px;padding:12px}
.login-links{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:14px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.msg{margin-top:16px;padding:10px 12px;border-radius:8px;font-size:14px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.bad{background:var(--crit-bg);color:var(--crit)}
.msg.info{background:var(--accent-bg);color:var(--accent-2)}
.login-foot{margin-top:28px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:12px}
@media (max-width:820px){
  .login{grid-template-columns:1fr}
  .login-brand{padding:24px}
  .login-brand h2{font-size:24px;margin-top:14px}
  .login-brand .hide-sm{display:none}
}

/* ---------- brand mark ---------- */
.mark{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.mark svg{flex:0 0 30px}
.mark b{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.01em}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--navy) 240px,var(--wash) 240px)}
html[dir="rtl"] .app{background:linear-gradient(270deg,var(--navy) 240px,var(--wash) 240px)}
.side{background:var(--navy);color:#B9C8DA;position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px;display:flex;flex-direction:column;gap:18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:12px;color:#7F95AF;padding:14px 10px 6px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:start;background:none;border:0;color:#C9D6E6;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button[aria-current="page"]{background:#fff;color:var(--navy);font-weight:600}
.badge{font-size:11.5px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;font-variant-numeric:tabular-nums}
.badge.crit{background:#E5484D;color:#fff}
.nav button[aria-current="page"] .badge{background:var(--wash-2);color:var(--navy)}
.nav button[aria-current="page"] .badge.crit{background:var(--crit);color:#fff}
.account{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding:14px 10px 4px;font-size:13px}
.account .email{color:#fff;word-break:break-all}
.account .plan{margin:6px 0 10px}
.account .row{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:none;border:1px solid rgba(255,255,255,.22);color:#DDE6F1;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:13px}
.ghost:hover{border-color:#fff;color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:5;background:rgba(244,246,249,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 28px;min-height:52px}
.bar .title{font-weight:600;color:var(--ink)}
.status{margin-inline-start:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.status.saving i{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.status.dirty i{background:var(--order)}
.status.error i{background:var(--crit)}
@keyframes pulse{50%{opacity:.3}}
.view{padding:26px 28px 90px;max-width:1320px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{color:var(--muted);max-width:72ch;margin:6px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.section{margin-top:28px}
.section > h2{margin-bottom:10px}

@media (max-width:900px){
  .app{grid-template-columns:1fr;background:var(--wash) !important}
  .side{position:sticky;top:0;z-index:10;height:auto;flex-direction:column;gap:8px;padding:10px 12px 8px}
  .side .top{display:flex;justify-content:space-between;align-items:center}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:4px;padding-bottom:2px}
  .nav::-webkit-scrollbar{display:none}
  .nav-label{display:none}
  .nav button{width:auto;white-space:nowrap;flex:0 0 auto}
  .account{display:none}
  .bar{position:static;padding:10px 16px}
  .view{padding:18px 16px 80px}
  h1{font-size:23px}
  .grid .w-name input{min-width:130px}
  .grid .w-sel select{min-width:118px}
  .po-total{text-align:start}
}
.side .top .ghost{display:none}
@media (max-width:900px){.side .top .ghost{display:inline-block}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--navy-3)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.danger{color:var(--crit)}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.iconbtn{background:none;border:0;color:var(--faint);cursor:pointer;padding:6px 10px;font-size:18px;line-height:1}
.iconbtn:hover{color:var(--crit)}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);max-height:72vh}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.t th{position:sticky;top:0;z-index:2;background:var(--wash-2);color:var(--ink);font-weight:600;text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px;vertical-align:bottom}
.t td{padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.wrap{white-space:normal;min-width:240px}
.t .name{font-weight:600;color:var(--ink)}
.t th .sub{display:block;font-weight:400;color:var(--muted);font-size:12px}
.t tfoot td{font-weight:700;color:var(--ink);background:var(--wash);border-top:1px solid var(--line)}

/* input grids */
.grid td{padding:0;border-inline-end:1px solid var(--line-2)}
.grid th{border-inline-end:1px solid var(--line)}
.grid input,.grid select{display:block;width:100%;border:0;background:transparent;padding:9px 10px;color:var(--ink);min-width:0;border-radius:0;font-variant-numeric:tabular-nums}
.grid select{padding-inline-end:4px;cursor:pointer}
.grid input:hover,.grid select:hover{background:var(--wash)}
.grid input:focus,.grid select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#fff}
.grid input.bad{background:var(--crit-bg);color:var(--crit)}
.grid .stick{--vb:transparent;position:sticky;inset-inline-start:0;z-index:1;background:var(--paper);box-shadow:inset 4px 0 0 var(--vb),inset -1px 0 0 var(--line)}
html[dir="rtl"] .grid .stick{box-shadow:inset -4px 0 0 var(--vb),inset 1px 0 0 var(--line)}
.vb-CRITICAL{--vb:var(--crit) !important}.vb-ORDER{--vb:#D98A00 !important}.vb-OK{--vb:var(--ok) !important}.vb-OVER{--vb:var(--over) !important}
.grid th.stick{z-index:3;background:var(--wash-2)}
.grid .w-name input{min-width:190px;font-weight:600}
.grid .w-sel select{min-width:150px}
.grid .w-m input{width:62px;text-align:end}
.grid .w-n input{width:88px;text-align:end}
.grid .w-t input{min-width:150px}
.grid td.v{padding:0 10px;min-width:170px}
.grid tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--accent-bg)}100%{background:transparent}}
.grid th.m-sep{border-inline-start:2px solid var(--line)}
.grid td.m-sep{border-inline-start:2px solid var(--line-2)}
.gridnote{font-size:13px;color:var(--muted);margin:10px 2px 0}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 7px}
.v-CRITICAL{color:var(--crit);background:var(--crit-bg)}
.v-ORDER{color:var(--order);background:var(--order-bg)}
.v-OK{color:var(--ok);background:var(--ok-bg)}
.v-OVER{color:var(--over);background:var(--over-bg)}
.v-NODEMAND,.v-NOHIST{color:var(--none);background:var(--none-bg)}
.h-FIX{color:var(--crit);background:var(--crit-bg)}
.h-REVIEW{color:var(--order);background:var(--order-bg)}
.h-GOOD{color:var(--ok);background:var(--ok-bg)}
.tag{display:inline-block;font-weight:700;font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--wash-2);color:var(--ink)}

/* ---------- dashboard ---------- */
.today{background:var(--navy);color:#C9D6E6;border-radius:var(--r);padding:22px 24px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center}
.today .big{font-family:var(--serif);font-size:54px;line-height:.9;color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.today h2{color:#fff;font-size:21px}
.today p{margin:4px 0 0}
.today .btn{background:#fff;color:var(--navy);border-color:#fff}
.today.calm .big{color:#8FE0B4}
@media (max-width:700px){.today{grid-template-columns:auto 1fr}.today .btn{grid-column:1/-1}}
.alert{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-radius:var(--r);padding:12px 16px;margin-top:12px;font-size:14px}
.alert.bad{background:var(--crit-bg);color:var(--crit)}
.alert.warn{background:var(--order-bg);color:var(--order)}
.alert.good{background:var(--ok-bg);color:var(--ok)}
.alert.info{background:var(--accent-bg);color:var(--accent-2)}
.alert b{color:inherit}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{padding:15px 18px 16px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);margin-inline-end:-1px;margin-bottom:-1px}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{display:block;font-family:var(--serif);font-size:25px;color:var(--ink);font-weight:600;line-height:1.2;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--faint);margin-top:3px}
.kpi.warn b{color:var(--order)}
.kpi.bad b{color:var(--crit)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line-2);margin:12px 0 14px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px 20px;font-size:14px}
.legend div{display:flex;align-items:center;gap:7px}
.split{display:flex;gap:10px;margin-top:10px}
.split div{flex:1;background:var(--wash);border-radius:8px;padding:10px 12px}
.split b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink)}
.split.onpage div{background:var(--paper);border:1px solid var(--line)}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);padding:36px 28px;text-align:center}
.empty h2{margin-bottom:8px}
.empty p{color:var(--muted);max-width:56ch;margin:0 auto 18px}
.empty .actions{justify-content:center}

/* ---------- settings ---------- */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.field{padding:16px 18px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);margin-inline-end:-1px;margin-bottom:-1px}
.field label{display:block;font-weight:600;color:var(--ink);margin-bottom:7px}
.field input[type=text],.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-variant-numeric:tabular-nums}
.field input.bad{border-color:var(--crit);background:var(--crit-bg)}
.field .help{font-size:13px;color:var(--muted);margin-top:7px}
.unit{position:relative}
.unit span{position:absolute;inset-inline-end:11px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px;pointer-events:none}
.unit input{padding-inline-end:52px !important}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;color:var(--ink)}
.switch input{appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;cursor:pointer;flex:0 0 40px;margin:0}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{inset-inline-start:21px}
.routine{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.routine p{margin:4px 0 0;color:var(--muted);max-width:70ch}

/* ---------- seasons ---------- */
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px}
@media (max-width:520px){.profiles{grid-template-columns:1fr}}
.prof{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.prof-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.prof-head input{font-weight:600;font-size:15px;border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0;flex:1}
.prof-head h3{flex:1}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:74px;margin:6px 0 4px;border-bottom:1px solid var(--line);position:relative}
.bars i{display:block;background:var(--navy-3);border-radius:3px 3px 0 0;min-height:2px}
.bars .one{position:absolute;inset-inline:0;border-top:1px dashed var(--faint)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.months label{font-size:11px;color:var(--muted);text-align:center;display:block}
.months input{width:100%;padding:5px 2px;border:1px solid var(--line);border-radius:6px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.months input:disabled{background:var(--wash);color:var(--body);border-color:var(--line-2)}
.prof-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:13px;flex-wrap:wrap}

/* ---------- ABC matrix ---------- */
.mx{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px}
.mx .h{font-size:13px;font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:4px 8px}
.mx .cell.zero{opacity:.55}
.mx .h small{display:block;font-weight:400;color:var(--muted)}
.mx .cell{border:1px solid var(--line);border-radius:8px;padding:12px;min-height:118px;background:var(--paper)}
.mx .cell b{font-size:15px;color:var(--ink)}
.mx .cell .n{font-family:var(--serif);font-size:26px;color:var(--ink);float:inline-end;line-height:1}
.mx .cell p{font-size:12.5px;margin:6px 0 0;line-height:1.45}
.mx .hot{background:var(--ok-bg);border-color:#BFE3CE}
.mx .mid{background:var(--order-bg);border-color:#F3D9A4}
.mx .cold{background:var(--crit-bg);border-color:#F4C7C2}
@media (max-width:760px){.mx .cell p{display:none}.mx .cell{min-height:70px}}

/* ---------- purchase plan ---------- */
.po{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-top:16px;overflow:hidden}
.po-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.po-head .meta{font-size:13px;color:var(--muted);margin-top:3px}
.po-total{text-align:end}
.po-total b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink)}
.po .t th{position:static}
.po-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;background:var(--wash);border-top:1px solid var(--line);flex-wrap:wrap}

/* ---------- filters ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--body)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip b{font-variant-numeric:tabular-nums;margin-inline-start:4px}

/* ---------- health ---------- */
.issues{margin:0;padding:0;list-style:none}
.issues li{display:flex;gap:8px;align-items:baseline;font-size:13.5px;padding:2px 0}
.issues li::before{content:"";width:7px;height:7px;border-radius:50%;flex:0 0 7px;transform:translateY(-1px)}
.issues li.error::before{background:var(--crit)}
.issues li.warn::before{background:var(--order)}

/* ---------- start here ---------- */
.guide{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px}
@media (max-width:1000px){.guide{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 18px 44px}
html[dir="rtl"] .steps li{padding:0 44px 18px 0}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:-1px;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.steps li b{display:block;color:var(--ink)}
.steps li p{margin:2px 0 0;color:var(--body)}
.plain{margin:0;padding-inline-start:18px}
.plain li{margin-bottom:6px}
.legend-list{display:grid;gap:8px}
.legend-list div{display:flex;align-items:center;gap:10px;font-size:14px}

/* ---------- toast + dialog ---------- */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:14px;z-index:50;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 8px 28px rgba(14,39,67,.25)}
.toast button{background:none;border:0;color:#8CC2FF;font-weight:700;cursor:pointer;padding:0}
.overlay{position:fixed;inset:0;background:rgba(14,39,67,.45);display:grid;place-items:center;z-index:60;padding:16px}
.dialog{background:var(--paper);border-radius:12px;max-width:480px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(14,39,67,.3)}
.dialog h2{margin-bottom:8px}
.dialog p{color:var(--body)}
.dialog textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px}
.dialog .actions{justify-content:flex-end;margin-top:16px}
.dialog.wide{max-width:640px}
.cmp-t{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.cmp-t th{text-align:start;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.cmp-t td{padding:8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.cmp-t tr.current td{background:var(--accent-bg)}
.cmp-t .num{text-align:end;font-variant-numeric:tabular-nums}
.cmp-add{display:flex;gap:8px;align-items:end;margin-top:14px;flex-wrap:wrap}
.cmp-add label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.cmp-add select,.cmp-add input{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px}
.cmp-add input{width:110px}
/* ---------- charts + reasoning ---------- */
.chart{width:100%;min-width:620px;height:auto;display:block}
.glegend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:2px 0 10px;font-size:13px}
.gl{display:inline-flex;align-items:center;gap:6px;color:var(--body)}
.gl i{width:14px;height:3px;border-radius:2px;flex:0 0 14px}
.cfrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.cflabel{flex:0 0 170px;font-size:13.5px;color:var(--body)}
.cfbar-track{flex:1;height:20px;background:var(--wash-2);border-radius:5px;overflow:hidden}
.cfbar{height:100%;background:var(--navy-3);border-radius:5px;min-width:2px}
.cfval{flex:0 0 90px;text-align:end;font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px}
.why{font-size:12.5px;color:var(--muted);font-weight:400;white-space:normal;max-width:52ch;margin-top:3px;line-height:1.45}
.t td .why{white-space:normal}

.lang{background:none;border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
.side .lang{border-color:rgba(255,255,255,.22);color:#DDE6F1}
</style><style>
/* demo page only */
.demobar{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;padding:10px 20px;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px}
.demobar span{max-width:74ch;text-align:center}
.demobar a.cta{background:#fff;color:var(--navy);padding:7px 14px;border-radius:8px;text-decoration:none;font-weight:600;white-space:nowrap}
.demobar a.back{color:#fff;white-space:nowrap}
.side{top:47px;height:calc(100vh - 47px)}
.bar{top:47px}
#view input,#view select,#view textarea{pointer-events:none}
#view select:disabled,#view input:disabled{opacity:1}
#view input[type=checkbox]:disabled{opacity:1}
.viewonly{font-size:12px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
@media (max-width:900px){.side{top:0;height:auto}.bar{top:auto}}
</style>
</head>

const PAGES = {"en": {"tabs": {"dash": {"title": "Dashboard", "html": "<div class=\"page-head\"><div><h1>Dashboard<\/h1><p>Where your stock and your cash stand today.<\/p><\/div><\/div><div class=\"today\"><div class=\"big\">1<\/div><div><h2>product to order<\/h2><p>1 this week. 18,700 EGP in total from 1 supplier.<\/p><\/div><button type=\"button\" class=\"btn \" data-act=\"tab\" data-tab=\"plan\">Open purchase plan<\/button><\/div><div class=\"alert warn\"><span>2 products are worth a second look.<\/span><button type=\"button\" class=\"btn small\" data-act=\"tab\" data-tab=\"health\">Open health check<\/button><\/div><div class=\"section\"><div class=\"kpis\"><div class=\"kpi \"><span>Cash tied up in stock<\/span><b>43,560 EGP<\/b><small>On hand, at cost<\/small><\/div><div class=\"kpi \"><span>Stock on its way<\/span><b>6,720 EGP<\/b><small>Ordered, not yet received<\/small><\/div><div class=\"kpi \"><span>To order now<\/span><b>18,700 EGP<\/b><small>Value of this cycle's purchase plan<\/small><\/div><div class=\"kpi \"><span>Projected revenue<\/span><b>762,005 EGP<\/b><small>Next 12 months<\/small><\/div><div class=\"kpi \"><span>Projected gross profit<\/span><b>416,032 EGP<\/b><small>Next 12 months<\/small><\/div><div class=\"kpi \"><span>Gross margin<\/span><b>55%<\/b><small>Across all products<\/small><\/div><div class=\"kpi \"><span>Stock turnover<\/span><b>7.9x a year<\/b><small>Under 4 a year means cash is sitting still<\/small><\/div><div class=\"kpi \"><span>Average days of cover<\/span><b>73 days<\/b><small>How long current stock lasts<\/small><\/div><div class=\"kpi warn\"><span>Cash locked in overstock<\/span><b>10,673 EGP<\/b><small>Stock beyond your overstock limit<\/small><\/div><div class=\"kpi \"><span>Profit at risk<\/span><b>0 EGP<\/b><small>If the red items are not ordered<\/small><\/div><div class=\"kpi \"><span>Forecast accuracy<\/span><b>93%<\/b><small>forecasts versus real sales<\/small><\/div><div class=\"kpi \"><span>Yearly cost of running stock<\/span><b>18,787 EGP<\/b><small>Ordering plus holding<\/small><\/div><\/div><\/div><div class=\"section two\"><div class=\"panel graph\"><h2>Verdicts across 6 products<\/h2><div class=\"stack\"><i style=\"width:16.666666666666668%;background:#D98A00\"><\/i><i style=\"width:66.66666666666667%;background:var(--ok)\"><\/i><i style=\"width:16.666666666666668%;background:var(--over)\"><\/i><\/div><div class=\"legend\"><div><span class=\"pill v-ORDER\" title=\"Stock has reached the reorder point. Order now so it arrives before the buffer is used.\">Order this week<\/span><b class=\"num\">1<\/b><\/div><div><span class=\"pill v-OK\" title=\"Enough stock to cover the supplier's lead time. Nothing to do.\">Stock is healthy<\/span><b class=\"num\">4<\/b><\/div><div><span class=\"pill v-OVER\" title=\"More than your overstock limit. Cash is frozen here. Consider a discount.\">Overstocked, do not order<\/span><b class=\"num\">1<\/b><\/div><\/div><\/div><div class=\"panel\"><h2>Where revenue comes from<\/h2><div class=\"split\"><div><b>3<\/b><span class=\"small\">A products<\/span><\/div><div><b>2<\/b><span class=\"small\">B products<\/span><\/div><div><b>1<\/b><span class=\"small\">C products<\/span><\/div><\/div><p class=\"small muted\" style=\"margin-top:10px\">A products earn about 80% of projected revenue, so watch them most closely.<\/p><\/div><\/div><div class=\"section\"><div class=\"page-head\" style=\"margin-bottom:10px\"><h2>Order list<\/h2><button type=\"button\" class=\"btn small\" data-act=\"tab\" data-tab=\"plan\">View all<\/button><\/div><div class=\"tbl-wrap\"><table class=\"t\"><thead><tr><th>Product<\/th><th>Supplier<\/th><th>Verdict<\/th><th class=\"num\">Order qty<\/th><th class=\"num\">Order value<\/th><\/tr><\/thead><tbody><tr><td class=\"name\"><bdi>Leather wallet<\/bdi><\/td><td><bdi>Alex Leather<\/bdi><\/td><td><span class=\"pill v-ORDER\" title=\"Stock has reached the reorder point. Order now so it arrives before the buffer is used.\">Order this week<\/span><\/td><td class=\"num\">85<\/td><td class=\"num\">18,700 EGP<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, "settings": {"title": "Settings", "html": "<div class=\"page-head\"><div><h1>Settings<\/h1><p>Numbers that apply to your whole shop. Rough is fine: being 20% off barely changes the answers.<\/p><\/div><\/div><div class=\"fields\"><div class=\"field\"><label for=\"st-orderCost\">Cost of placing one order<\/label><div class=\"unit\"><input type=\"text\" inputmode=\"decimal\" id=\"st-orderCost\" data-scope=\"settings\" data-f=\"orderCost\" value=\"350\" readonly=\"\" tabindex=\"-1\"><span>EGP<\/span><\/div><div class=\"help\">Shipping or delivery you pay, transfer fees, and your own time chasing it. Most small Egyptian shops land between 150 and 600 EGP.<\/div><\/div><div class=\"field\"><label for=\"st-holdRate\">Yearly cost of holding 100 EGP of stock<\/label><div class=\"unit\"><input type=\"text\" inputmode=\"decimal\" id=\"st-holdRate\" data-scope=\"settings\" data-f=\"holdRate\" value=\"25\" readonly=\"\" tabindex=\"-1\"><span>EGP<\/span><\/div><div class=\"help\">Storage, damage, things going out of style, and money you could have used elsewhere. 20 to 35 is typical.<\/div><\/div><div class=\"field\"><label for=\"st-lastMonth\">Newest month in your sales history<\/label><select id=\"st-lastMonth\" data-scope=\"settings\" data-f=\"lastMonth\" disabled=\"\" tabindex=\"-1\"><option value=\"1\">January<\/option><option value=\"2\">February<\/option><option value=\"3\">March<\/option><option value=\"4\">April<\/option><option value=\"5\">May<\/option><option value=\"6\">June<\/option><option value=\"7\">July<\/option><option value=\"8\" selected=\"\">August<\/option><option value=\"9\">September<\/option><option value=\"10\">October<\/option><option value=\"11\">November<\/option><option value=\"12\">December<\/option><\/select><div class=\"help\">The last full month you typed sales for. The Products page labels its columns from this.<\/div><\/div><div class=\"field\"><label for=\"st-overstockDays\">Overstock limit<\/label><div class=\"unit\"><input type=\"text\" inputmode=\"decimal\" id=\"st-overstockDays\" data-scope=\"settings\" data-f=\"overstockDays\" value=\"120\" readonly=\"\" tabindex=\"-1\"><span>days<\/span><\/div><div class=\"help\">More stock than this many days of sales is treated as overstock.<\/div><\/div><div class=\"field\"><label for=\"st-budget\">Monthly purchase budget<\/label><div class=\"unit\"><input type=\"text\" inputmode=\"decimal\" id=\"st-budget\" data-scope=\"settings\" data-f=\"budget\" value=\"0\" readonly=\"\" tabindex=\"-1\"><span>EGP<\/span><\/div><div class=\"help\">Optional. Leave 0 for no budget check.<\/div><\/div><div class=\"field\"><label for=\"st-daysPerMonth\">Days per month<\/label><div class=\"unit\"><input type=\"text\" inputmode=\"decimal\" id=\"st-daysPerMonth\" data-scope=\"settings\" data-f=\"daysPerMonth\" value=\"30\" readonly=\"\" tabindex=\"-1\"><span>days<\/span><\/div><div class=\"help\">Used to turn monthly sales into daily sales. Leave at 30.<\/div><\/div><div class=\"field\"><label class=\"switch\"><input type=\"checkbox\" data-scope=\"settings\" data-f=\"seasonOn\" checked=\"\" readonly=\"\" tabindex=\"-1\" disabled=\"\"><span>Use season shapes<\/span><\/label><div class=\"help\">Removes normal seasonal ups and downs before measuring how unpredictable a product is.<\/div><\/div><div class=\"field\"><label class=\"switch\"><input type=\"checkbox\" data-scope=\"settings\" data-f=\"trendOn\" checked=\"\" readonly=\"\" tabindex=\"-1\" disabled=\"\"><span>Detect growth and decline<\/span><\/label><div class=\"help\">Projects forward when a product is clearly growing or shrinking.<\/div><\/div><\/div><div class=\"section routine\"><div><h2>Start a new month<\/h2><p>Moves every product's sales one column to the left and opens an empty column for September. Then type that month's sales on the Products page.<\/p><\/div><button type=\"button\" class=\"btn primary\" data-act=\"rollMonth\">Start September<\/button><\/div>"}, "seasons": {"title": "Seasons", "html": "<div class=\"page-head\"><div><h1>Seasons<\/h1><p>Each shape says how busy a month normally is compared with an average month. 1.5 means 50% busier, 0.5 means half as busy. Only the pattern matters: every shape is rescaled so the year averages 1.<\/p><\/div><div class=\"actions\"><button type=\"button\" class=\"btn primary\" data-act=\"addProfile\">Add a shape<\/button><\/div><\/div><div class=\"profiles\"><div class=\"prof\" data-prof=\"flat\"><div class=\"prof-head\"><h3>Flat (no season)<\/h3><div class=\"actions\"><button type=\"button\" class=\"btn small\" data-act=\"dupProfile\" data-id=\"flat\">Duplicate<\/button><\/div><\/div><div class=\"bars\" data-bars=\"flat\"><div class=\"one\" style=\"bottom:50%\"><\/div><i style=\"height:50%\"><\/i><i style=\"height:50%\"><\/i><i style=\"height:50%\"><\/i><i style=\"height:50%\"><\/i><i style=\"height:50%\"><\/i><i style=\"height:50%\"><\/i><i style=\"height:50%\"><\/i><i style=\"height:50%\"><\/i><i style=\"height:50%\"><\/i><i style=\"height:50%\"><\/i><i style=\"height:50%\"><\/i><i style=\"height:50%\"><\/i><\/div><div class=\"months\"><div><label>Jan<\/label><input type=\"text\" inputmode=\"decimal\" data-scope=\"profile\" data-id=\"flat\" data-f=\"f\" data-i=\"0\" value=\"1\" readonly=\"\" tabindex=\"-1\"><\/div><div><label>Feb<\/label><input type=\"text\" inputmode=\"decimal\" data-scope=\"profile\" data-id=\"flat\" data-f=\"f\" data-i=\"1\" value=\"1\" readonly=\"\" tabindex=\"-1\"><\/div><div><label>Mar<\/label><input type=\"text\" inputmode=\"decimal\" data-scope=\"profile\" data-id=\"flat\" data-f=\"f\" data-i=\"2\" value=\"1\" readonly=\"\" tabindex=\"-1\"><\/div><div><label>Apr<\/label><input type=\"text\" inputmode=\"decimal\" data-scope=\"profile\" data-id=\"flat\" data-f=\"f\" data-i=\"3\" value=\"1\" readonly=\"\" tabindex=\"-1\"><\/div><div><label>May<\/label><input type=\"text\" inputmode=\"deci  it to a negotiation.<\/p>"}, "dead": {"title": "Dead stock", "html": "<div class=\"page-head\"><div><h1>Dead stock report<\/h1><p>Real stock that has, by its own history, essentially stopped moving. Compared against each product's own past, not a generic rule, so a naturally slow seller is never listed by mistake.<\/p><\/div><\/div><div class=\"empty\"><h2>Nothing dead right now<\/h2><p>Every product with stock on hand is still selling at something close to its usual pace.<\/p><\/div>"}, "cash": {"title": "Cash flow", "html": "<div class=\"page-head\"><div><h1>Cash flow forecast<\/h1><p>If you placed every order in your current purchase plan today, here is roughly when the money would actually leave, based on each supplier's real deposit and payment terms.<\/p><\/div><\/div><div class=\"kpis\" style=\"margin-bottom:16px\"><div class=\"kpi\"><span>Total across the current purchase plan<\/span><b>18,700 EGP<\/b><\/div><\/div><div class=\"panel graph\"><div class=\"cfrow\"><span class=\"cflabel\">Due now<\/span><div class=\"cfbar-track\"><div class=\"cfbar\" style=\"width:2%\"><\/div><\/div><span class=\"cfval\">0 EGP<\/span><\/div><div class=\"cfrow\"><span class=\"cflabel\">Due in 1 to 7 days<\/span><div class=\"cfbar-track\"><div class=\"cfbar\" style=\"width:2%\"><\/div><\/div><span class=\"cfval\">0 EGP<\/span><\/div><div class=\"cfrow\"><span class=\"cflabel\">Due in 8 to 14 days<\/span><div class=\"cfbar-track\"><div class=\"cfbar\" style=\"width:100%\"><\/div><\/div><span class=\"cfval\">18,700 EGP<\/span><\/div><div class=\"cfrow\"><span class=\"cflabel\">Due in 15 to 30 days<\/span><div class=\"cfbar-track\"><div class=\"cfbar\" style=\"width:2%\"><\/div><\/div><span class=\"cfval\">0 EGP<\/span><\/div><div class=\"cfrow\"><span class=\"cflabel\">Due after 30 days<\/span><div class=\"cfbar-track\"><div class=\"cfbar\" style=\"width:2%\"><\/div><\/div><span class=\"cfval\">0 EGP<\/span><\/div><\/div><div class=\"section\"><h2>By supplier<\/h2><div class=\"tbl-wrap\"><table class=\"t\"><thead><tr><th>Supplier<\/th><th class=\"num\">Total<\/th><th class=\"num\">Deposit now<\/th><th class=\"num\">Balance<\/th><\/tr><\/thead><tbody><tr><td class=\"name\"><bdi>Alex Leather<\/bdi><\/td><td class=\"num\">18,700 EGP<\/td><td class=\"num\">-<\/td><td class=\"num\">18,700 EGP <span class=\"small muted\">(due in 14 days)<\/span><\/td><\/tr><\/tbody><\/table><\/div><\/div><p class=\"gridnote\">Set each supplier's deposit percentage and payment days on the Suppliers page. Nothing here is guessed from the terms note, only from those two numbers.<\/p>"}, "accuracy": {"title": "Forecast accuracy", "html": "<div class=\"page-head\"><div><h1>Forecast accuracy<\/h1><p>Every month the app writes down what it expects each product to sell. When you type in what really sold, this page compares the two, so you can see how far to trust the numbers.<\/p><\/div><\/div><div class=\"kpis\" style=\"margin-bottom:16px\"><div class=\"kpi\"><span>Overall accuracy<\/span><b>93%<\/b><small>18 product months checked<\/small><\/div><\/div><div class=\"tbl-wrap\"><table class=\"t\"><thead><tr><th>Product<\/th><th class=\"num\">Forecast<\/th><th class=\"num\">Actually sold<\/th><th class=\"num\">Off by<\/th><th>Accuracy<\/th><th class=\"num\">Months checked<\/th><\/tr><\/thead><tbody><tr><td class=\"name\"><bdi>Leather belt<\/bdi><\/td><td class=\"num\">17<\/td><td class=\"num\">19<\/td><td class=\"num\">2<\/td><td><span class=\"pill v-OK\">84%<\/span><\/td><td class=\"num\">3<\/td><\/tr><tr><td class=\"name\"><bdi>Wool scarf<\/bdi><\/td><td class=\"num\">20<\/td><td class=\"num\">19<\/td><td class=\"num\">1<\/td><td><span class=\"pill v-OK\">91%<\/span><\/td><td class=\"num\">3<\/td><\/tr><tr><td class=\"name\"><bdi>Cotton tee<\/bdi><\/td><td class=\"num\">38<\/td><td class=\"num\">42<\/td><td class=\"num\">4<\/td><td><span class=\"pill v-OK\">93%<\/span><\/td><td class=\"num\">3<\/td><\/tr><tr><td class=\"name\"><bdi>Tote bag<\/bdi><\/td><td class=\"num\">11<\/td><td class=\"num\">11<\/td><td class=\"num\">0<\/td><td><span class=\"pill v-OK\">93%<\/span><\/td><td class=\"num\">3<\/td><\/tr><tr><td class=\"name\"><bdi>Eid gift box<\/bdi><\/td><td class=\"num\">21<\/td><td class=\"num\">21<\/td><td class=\"num\">0<\/td><td><span class=\"pill v-OK\">95%<\/span><\/td><td class=\"num\">3<\/td><\/tr><tr><td class=\"name\"><bdi>Leather wallet<\/bdi><\/td><td class=\"num\">41<\/td><td class=\"num\">40<\/td><td class=\"num\">1<\/td><td><span class=\"pill v-OK\">97%<\/span><\/td><td class=\"num\">3<\/td><\/tr><\/tbody><\/table><\/div><p class=\"gridnote\">Accuracy is 100% minus the total gap between forecast and real sales, as a share of real sales. Above 80% is strong for a small shop. Big misses usually mean a one-off event, a stockout, or a season shape that needs adjusting.<\/p>"}, "health": {"title": "Health check", "html": "<div class=\"page-head\"><div><h1>Health check<\/h1><p>Checks what you typed before you trust any order. Red rows can produce a wrong quantity.<\/p><\/div><\/div><div class=\"split onpage\" style=\"margin:0 0 14px\"><div><b style=\"color:var(--crit)\">0<\/b><span class=\"small\">Fix this<\/span><\/div><div><b style=\"color:var(--order)\">2<\/b><span class=\"small\">Review<\/span><\/div><div><b style=\"color:var(--ok)\">4<\/b><span class=\"small\">Good<\/span><\/div><\/div><label class=\"switch\" style=\"margin-bottom:12px\"><input type=\"checkbox\" data-act=\"healthOnly\" checked=\"\" readonly=\"\" tabindex=\"-1\" disabled=\"\"><span>Only rows that need attention<\/span><\/label><div class=\"tbl-wrap\"><table class=\"t\"><thead><tr><th>Product<\/th><th>Result<\/th><th>What to check<\/th><th><\/th><\/tr><\/thead><tbody><tr><td class=\"name\"><bdi>Leather belt<\/bdi><\/td><td><span class=\"pill h-REVIEW\">Review<\/span><\/td><td class=\"wrap\"><ul class=\"issues\"><li class=\"warn\">Overstocked. Cash is frozen here.<\/li><li class=\"warn\">Marked flat, but sales swing a lot. Is it seasonal?<\/li><\/ul>< const $ = s => document.querySelector(s);
let lang = (new URLSearchParams(location.search).get('lang') || (navigator.language || '')).toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
let tab = 'dash';
function render() {
  const P = PAGES[lang], X = TXT[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('#d-bar').textContent = X.bar; $('#d-cta').textContent = X.cta; $('#d-back').textContent = X.back;
  $('#d-shop').textContent = X.shop; $('#d-plan').textContent = X.plan; $('#d-vo').textContent = X.vo; $('#d-lang').textContent = X.lang;
  $('#nav').innerHTML = P.nav;
  document.querySelectorAll('#nav [data-tab]').forEach(b => { if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); });
  $('#bar-title').textContent = P.tabs[tab].title;
  $('#view').innerHTML = P.tabs[tab].html;
}
let tt = null;
function toast(msg) { const el = $('#toast'); el.innerHTML = '<span></span>'; el.firstChild.textContent = msg; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, 3200); }
function go(t) { if (!PAGES[lang].tabs[t]) return; tab = t; render(); window.scrollTo(0, 0); }
$('#d-lang').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; render(); };
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
$('#view').addEventListener('click', e => {
  const a = e.target.closest('a[href]'); if (a && !a.dataset.act) { e.preventDefault(); return; }
  const el = e.target.closest('[data-act],button,.chip');
  if (!el) return;
  e.preventDefault();
  if (el.dataset.act === 'tab' && el.dataset.tab && PAGES[lang].tabs[el.dataset.tab]) { go(el.dataset.tab); return; }
  toast(TXT[lang].toast);
});
