<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230E2743%27/%3E%3Crect x=%278%27 y=%2717%27 width=%273.6%27 height=%277%27 rx=%271.3%27 fill=%27%23fff%27 opacity=%27.55%27/%3E%3Crect x=%2714.2%27 y=%2712%27 width=%273.6%27 height=%2712%27 rx=%271.3%27 fill=%27%23fff%27 opacity=%27.8%27/%3E%3Crect x=%2720.4%27 y=%278%27 width=%273.6%27 height=%2716%27 rx=%271.3%27 fill=%27%235DA2F2%27/%3E%3C/svg%3E">
<title>Etlob Sa7</title>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E2743; --navy-2:#163456; --navy-3:#21466F;
  --ink:#13202F; --body:#3B4A5A; --muted:#66768A; --faint:#98A6B6;
  --line:#DCE3EB; --line-2:#EDF1F5; --paper:#FFFFFF; --wash:#F4F6F9; --wash-2:#E9EEF4;
  --accent:#1A6DD4; --accent-2:#1459B0; --accent-bg:#E8F1FC;
  --crit:#B42318; --crit-bg:#FDECEA;
  --order:#8A5100; --order-bg:#FFF0D1;
  --ok:#157346; --ok-bg:#E2F2E9;
  --over:#2B5EA7; --over-bg:#E6EEFA;
  --none:#5E6B7A; --none-bg:#EDF0F3;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:Inter, "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r:10px;
}
html[lang="ar"]{
  --sans:"IBM Plex Sans Arabic", Inter, system-ui, "Segoe UI", Tahoma, Arial, sans-serif;
  --serif:"IBM Plex Sans Arabic", Georgia, serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--wash);color:var(--body);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
[hidden]{display:none !important}
h1,h2,h3{color:var(--ink);margin:0;line-height:1.2}
h1{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.01em}
h2{font-family:var(--serif);font-size:20px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0 0 .8em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.t td.num,.t th.num{text-align:end;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.nowrap{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* ---------- boot + login ---------- */
.boot{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.login-brand{background:var(--navy);color:#C9D6E6;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login-brand h2{color:#fff;font-size:38px;line-height:1.15;max-width:17ch;margin-top:28px}
.login-brand p{max-width:40ch;margin-top:14px}
.login-form{display:grid;place-items:center;padding:32px}
.login-card{width:100%;max-width:380px}
.login-card h1{margin-bottom:8px}
.login-card .lede{color:var(--muted);margin-bottom:22px}
.login-card label{display:block;font-weight:600;color:var(--ink);margin-bottom:6px}
.login-card input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:16px}
.login-card input.code{letter-spacing:.4em;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.login-card .btn{width:100%;margin-top:14px;padding:12px}
.login-links{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:14px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.msg{margin-top:16px;padding:10px 12px;border-radius:8px;font-size:14px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.bad{background:var(--crit-bg);color:var(--crit)}
.msg.info{background:var(--accent-bg);color:var(--accent-2)}
.login-foot{margin-top:28px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:12px}
@media (max-width:820px){
  .login{grid-template-columns:1fr}
  .login-brand{padding:24px}
  .login-brand h2{font-size:24px;margin-top:14px}
  .login-brand .hide-sm{display:none}
}

/* ---------- brand mark ---------- */
.mark{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.mark svg{flex:0 0 30px}
.mark b{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.01em}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--navy) 240px,var(--wash) 240px)}
html[dir="rtl"] .app{background:linear-gradient(270deg,var(--navy) 240px,var(--wash) 240px)}
.side{background:var(--navy);color:#B9C8DA;position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px;display:flex;flex-direction:column;gap:18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:12px;color:#7F95AF;padding:14px 10px 6px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:start;background:none;border:0;color:#C9D6E6;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button[aria-current="page"]{background:#fff;color:var(--navy);font-weight:600}
.badge{font-size:11.5px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;font-variant-numeric:tabular-nums}
.badge.crit{background:#E5484D;color:#fff}
.nav button[aria-current="page"] .badge{background:var(--wash-2);color:var(--navy)}
.nav button[aria-current="page"] .badge.crit{background:var(--crit);color:#fff}
.account{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding:14px 10px 4px;font-size:13px}
.account .email{color:#fff;word-break:break-all}
.account .plan{margin:6px 0 10px}
.account .row{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:none;border:1px solid rgba(255,255,255,.22);color:#DDE6F1;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:13px}
.ghost:hover{border-color:#fff;color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:5;background:rgba(244,246,249,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 28px;min-height:52px}
.bar .title{font-weight:600;color:var(--ink)}
.status{margin-inline-start:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.status.saving i{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.status.dirty i{background:var(--order)}
.status.error i{background:var(--crit)}
@keyframes pulse{50%{opacity:.3}}
.view{padding:26px 28px 90px;max-width:1320px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{color:var(--muted);max-width:72ch;margin:6px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.section{margin-top:28px}
.section > h2{margin-bottom:10px}

@media (max-width:900px){
  .app{grid-template-columns:1fr;background:var(--wash) !important}
  .side{position:sticky;top:0;z-index:10;height:auto;flex-direction:column;gap:8px;padding:10px 12px 8px}
  .side .top{display:flex;justify-content:space-between;align-items:center}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:4px;padding-bottom:2px}
  .nav::-webkit-scrollbar{display:none}
  .nav-label{display:none}
  .nav button{width:auto;white-space:nowrap;flex:0 0 auto}
  .account{display:none}
  .bar{position:static;padding:10px 16px}
  .view{padding:18px 16px 80px}
  h1{font-size:23px}
  .grid .w-name input{min-width:130px}
  .grid .w-sel select{min-width:118px}
  .po-total{text-align:start}
}
.side .top .ghost{display:none}
@media (max-width:900px){.side .top .ghost{display:inline-block}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--navy-3)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.danger{color:var(--crit)}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.iconbtn{background:none;border:0;color:var(--faint);cursor:pointer;padding:6px 10px;font-size:18px;line-height:1}
.iconbtn:hover{color:var(--crit)}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);max-height:72vh}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.t th{position:sticky;top:0;z-index:2;background:var(--wash-2);color:var(--ink);font-weight:600;text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px;vertical-align:bottom}
.t td{padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.wrap{white-space:normal;min-width:240px}
.t .name{font-weight:600;color:var(--ink)}
.t th .sub{display:block;font-weight:400;color:var(--muted);font-size:12px}
.t tfoot td{font-weight:700;color:var(--ink);background:var(--wash);border-top:1px solid var(--line)}

/* input grids */
.grid td{padding:0;border-inline-end:1px solid var(--line-2)}
.grid th{border-inline-end:1px solid var(--line)}
.grid input,.grid select{display:block;width:100%;border:0;background:transparent;padding:9px 10px;color:var(--ink);min-width:0;border-radius:0;font-variant-numeric:tabular-nums}
.grid select{padding-inline-end:4px;cursor:pointer}
.grid input:hover,.grid select:hover{background:var(--wash)}
.grid input:focus,.grid select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#fff}
.grid input.bad{background:var(--crit-bg);color:var(--crit)}
.grid .stick{--vb:transparent;position:sticky;inset-inline-start:0;z-index:1;background:var(--paper);box-shadow:inset 4px 0 0 var(--vb),inset -1px 0 0 var(--line)}
html[dir="rtl"] .grid .stick{box-shadow:inset -4px 0 0 var(--vb),inset 1px 0 0 var(--line)}
.vb-CRITICAL{--vb:var(--crit) !important}.vb-ORDER{--vb:#D98A00 !important}.vb-OK{--vb:var(--ok) !important}.vb-OVER{--vb:var(--over) !important}
.grid th.stick{z-index:3;background:var(--wash-2)}
.grid .w-name input{min-width:190px;font-weight:600}
.grid .w-sel select{min-width:150px}
.grid .w-m input{width:62px;text-align:end}
.grid .w-n input{width:88px;text-align:end}
.grid .w-t input{min-width:150px}
.grid td.v{padding:0 10px;min-width:170px}
.grid tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--accent-bg)}100%{background:transparent}}
.grid th.m-sep{border-inline-start:2px solid var(--line)}
.grid td.m-sep{border-inline-start:2px solid var(--line-2)}
.gridnote{font-size:13px;color:var(--muted);margin:10px 2px 0}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 7px}
.v-CRITICAL{color:var(--crit);background:var(--crit-bg)}
.v-ORDER{color:var(--order);background:var(--order-bg)}
.v-OK{color:var(--ok);background:var(--ok-bg)}
.v-OVER{color:var(--over);background:var(--over-bg)}
.v-NODEMAND,.v-NOHIST{color:var(--none);background:var(--none-bg)}
.h-FIX{color:var(--crit);background:var(--crit-bg)}
.h-REVIEW{color:var(--order);background:var(--order-bg)}
.h-GOOD{color:var(--ok);background:var(--ok-bg)}
.tag{display:inline-block;font-weight:700;font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--wash-2);color:var(--ink)}

/* ---------- dashboard ---------- */
.today{background:var(--navy);color:#C9D6E6;border-radius:var(--r);padding:22px 24px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center}
.today .big{font-family:var(--serif);font-size:54px;line-height:.9;color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.today h2{color:#fff;font-size:21px}
.today p{margin:4px 0 0}
.today .btn{background:#fff;color:var(--navy);border-color:#fff}
.today.calm .big{color:#8FE0B4}
@media (max-width:700px){.today{grid-template-columns:auto 1fr}.today .btn{grid-column:1/-1}}
.alert{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-radius:var(--r);padding:12px 16px;margin-top:12px;font-size:14px}
.alert.bad{background:var(--crit-bg);color:var(--crit)}
.alert.warn{background:var(--order-bg);color:var(--order)}
.alert.good{background:var(--ok-bg);color:var(--ok)}
.alert.info{background:var(--accent-bg);color:var(--accent-2)}
.alert b{color:inherit}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{padding:15px 18px 16px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);margin-inline-end:-1px;margin-bottom:-1px}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{display:block;font-family:var(--serif);font-size:25px;color:var(--ink);font-weight:600;line-height:1.2;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--faint);margin-top:3px}
.kpi.warn b{color:var(--order)}
.kpi.bad b{color:var(--crit)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line-2);margin:12px 0 14px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px 20px;font-size:14px}
.legend div{display:flex;align-items:center;gap:7px}
.split{display:flex;gap:10px;margin-top:10px}
.split div{flex:1;background:var(--wash);border-radius:8px;padding:10px 12px}
.split b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink)}
.split.onpage div{background:var(--paper);border:1px solid var(--line)}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);padding:36px 28px;text-align:center}
.empty h2{margin-bottom:8px}
.empty p{color:var(--muted);max-width:56ch;margin:0 auto 18px}
.empty .actions{justify-content:center}

/* ---------- settings ---------- */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.field{padding:16px 18px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);margin-inline-end:-1px;margin-bottom:-1px}
.field label{display:block;font-weight:600;color:var(--ink);margin-bottom:7px}
.field input[type=text],.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-variant-numeric:tabular-nums}
.field input.bad{border-color:var(--crit);background:var(--crit-bg)}
.field .help{font-size:13px;color:var(--muted);margin-top:7px}
.unit{position:relative}
.unit span{position:absolute;inset-inline-end:11px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px;pointer-events:none}
.unit input{padding-inline-end:52px !important}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;color:var(--ink)}
.switch input{appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;cursor:pointer;flex:0 0 40px;margin:0}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{inset-inline-start:21px}
.routine{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.routine p{margin:4px 0 0;color:var(--muted);max-width:70ch}

/* ---------- seasons ---------- */
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px}
@media (max-width:520px){.profiles{grid-template-columns:1fr}}
.prof{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.prof-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.prof-head input{font-weight:600;font-size:15px;border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0;flex:1}
.prof-head h3{flex:1}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:74px;margin:6px 0 4px;border-bottom:1px solid var(--line);position:relative}
.bars i{display:block;background:var(--navy-3);border-radius:3px 3px 0 0;min-height:2px}
.bars .one{position:absolute;inset-inline:0;border-top:1px dashed var(--faint)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.months label{font-size:11px;color:var(--muted);text-align:center;display:block}
.months input{width:100%;padding:5px 2px;border:1px solid var(--line);border-radius:6px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.months input:disabled{background:var(--wash);color:var(--body);border-color:var(--line-2)}
.prof-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:13px;flex-wrap:wrap}

/* ---------- ABC matrix ---------- */
.mx{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px}
.mx .h{font-size:13px;font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:4px 8px}
.mx .cell.zero{opacity:.55}
.mx .h small{display:block;font-weight:400;color:var(--muted)}
.mx .cell{border:1px solid var(--line);border-radius:8px;padding:12px;min-height:118px;background:var(--paper)}
.mx .cell b{font-size:15px;color:var(--ink)}
.mx .cell .n{font-family:var(--serif);font-size:26px;color:var(--ink);float:inline-end;line-height:1}
.mx .cell p{font-size:12.5px;margin:6px 0 0;line-height:1.45}
.mx .hot{background:var(--ok-bg);border-color:#BFE3CE}
.mx .mid{background:var(--order-bg);border-color:#F3D9A4}
.mx .cold{background:var(--crit-bg);border-color:#F4C7C2}
@media (max-width:760px){.mx .cell p{display:none}.mx .cell{min-height:70px}}

/* ---------- purchase plan ---------- */
.po{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-top:16px;overflow:hidden}
.po-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.po-head .meta{font-size:13px;color:var(--muted);margin-top:3px}
.po-total{text-align:end}
.po-total b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink)}
.po .t th{position:static}
.po-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;background:var(--wash);border-top:1px solid var(--line);flex-wrap:wrap}

/* ---------- filters ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--body)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip b{font-variant-numeric:tabular-nums;margin-inline-start:4px}

/* ---------- health ---------- */
.issues{margin:0;padding:0;list-style:none}
.issues li{display:flex;gap:8px;align-items:baseline;font-size:13.5px;padding:2px 0}
.issues li::before{content:"";width:7px;height:7px;border-radius:50%;flex:0 0 7px;transform:translateY(-1px)}
.issues li.error::before{background:var(--crit)}
.issues li.warn::before{background:var(--order)}

/* ---------- start here ---------- */
.guide{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px}
@media (max-width:1000px){.guide{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 18px 44px}
html[dir="rtl"] .steps li{padding:0 44px 18px 0}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:-1px;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.steps li b{display:block;color:var(--ink)}
.steps li p{margin:2px 0 0;color:var(--body)}
.plain{margin:0;padding-inline-start:18px}
.plain li{margin-bottom:6px}
.legend-list{display:grid;gap:8px}
.legend-list div{display:flex;align-items:center;gap:10px;font-size:14px}

/* ---------- toast + dialog ---------- */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:14px;z-index:50;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 8px 28px rgba(14,39,67,.25)}
.toast button{background:none;border:0;color:#8CC2FF;font-weight:700;cursor:pointer;padding:0}
.overlay{position:fixed;inset:0;background:rgba(14,39,67,.45);display:grid;place-items:center;z-index:60;padding:16px}
.dialog{background:var(--paper);border-radius:12px;max-width:480px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(14,39,67,.3)}
.dialog h2{margin-bottom:8px}
.dialog p{color:var(--body)}
.dialog textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px}
.dialog .actions{justify-content:flex-end;margin-top:16px}
.dialog.wide{max-width:640px}
.cmp-t{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.cmp-t th{text-align:start;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.cmp-t td{padding:8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.cmp-t tr.current td{background:var(--accent-bg)}
.cmp-t .num{text-align:end;font-variant-numeric:tabular-nums}
.cmp-add{display:flex;gap:8px;align-items:end;margin-top:14px;flex-wrap:wrap}
.cmp-add label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.cmp-add select,.cmp-add input{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px}
.cmp-add input{width:110px}
/* ---------- charts + reasoning ---------- */
.chart{width:100%;min-width:620px;height:auto;display:block}
.glegend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:2px 0 10px;font-size:13px}
.gl{display:inline-flex;align-items:center;gap:6px;color:var(--body)}
.gl i{width:14px;height:3px;border-radius:2px;flex:0 0 14px}
.cfrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.cflabel{flex:0 0 170px;font-size:13.5px;color:var(--body)}
.cfbar-track{flex:1;height:20px;background:var(--wash-2);border-radius:5px;overflow:hidden}
.cfbar{height:100%;background:var(--navy-3);border-radius:5px;min-width:2px}
.cfval{flex:0 0 90px;text-align:end;font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px}
.why{font-size:12.5px;color:var(--muted);font-weight:400;white-space:normal;max-width:52ch;margin-top:3px;line-height:1.45}
.t td .why{white-space:normal}

.lang{background:none;border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
.side .lang{border-color:rgba(255,255,255,.22);color:#DDE6F1}
</style>

/* ================= basics ================= */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const DEMO = new URLSearchParams(location.search).has('demo');
const S = { selectMode: false, selected: new Set(), sid: DEMO ? 'demo' : store.get('es7.sid'), me: null, ws: null, res: null, rev: 0, tab: store.get('es7.tab') || 'dash',
            dirty: false, saving: false, timer: null, retry: null, filter: 'ALL', healthOnly: true, loginEmail: '', undo: null };
let LANG = store.get('es7.lang') || ((navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en');

function t(key, vars) {
  let s = (T[LANG] && T[LANG][key]) != null ? T[LANG][key] : (T.en[key] != null ? T.en[key] : key);
  if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const NF0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
const NF1 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 1, minimumFractionDigits: 1 });
const NF2 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
const n0 = v => (v == null || !isFinite(v)) ? t('na') : NF0.format(Math.round(v));
const n1 = v => (v == null || !isFinite(v)) ? t('na') : NF1.format(v);
const money = v => (v == null || !isFinite(v)) ? t('na') : NF0.format(Math.round(v)) + ' ' + t('egp');
const pct = v => (v == null || !isFinite(v)) ? t('na') : Math.round(v * 100) + '%';
const monthName = (m, long) => (long ? MONTHS_LONG : MONTHS)[LANG][((m - 1) % 12 + 12) % 12];
const calMonth = (col, last) => (((last - 12 + col - 1) % 12) + 12) % 12 + 1;
const newId = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

function parseNum(raw) {
  let s = String(raw == null ? '' : raw).trim();
  if (!s) return { ok: true, v: null };
  s = s.replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))
       .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0))
       .replace(/\u066B/g, '.').replace(/[,\u066C\s]/g, '').replace(/%$/, '');
  const v = Number(s);
  return isFinite(v) ? { ok: true, v: v } : { ok: false, v: null };
}
const val = v => (v == null ? '' : String(v));
// Keep English names readable inside Arabic pages (and the reverse).
const bdi = v => '<bdi>' + esc(v) + '</bdi>';
const iso = v => '\u2068' + v + '\u2069';
const digits = v => String(v == null ? '' : v)
  .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))
  .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0))
  .replace(/\D/g, '');

/* ================= server calls ================= */
// Talks to the Supabase server. Same functions and answers as the old Apps Script version.
const API_URL = 'https://wqbcxyswrqxvqrehelnw.supabase.co/functions/v1/app';
async function gs(fn, ...args) {
  try {
    // Demo mode runs on the same server with the real engine, but nothing is saved.
    const payload = (DEMO && fn === 'api') ? { fn: 'demo', args: [args[1], args[2]] } : { fn, args };
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const j = await r.json().catch(() => null);
    return j || { error: 'SERVER' };
  } catch (e) { console.error(e); return { error: 'NET' }; }
}
const call = (action, payload) => gs('api', S.sid, action, payload == null ? null : payload);

function applyStatic() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  $$('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $$('[data-act="lang"]').forEach(el => { el.textContent = LANG === 'ar' ? 'English' : 'العربية'; });
  $$('.appname').forEach(el => { el.textContent = CFG.appName; });

}
function setLang(l) {
  LANG = l; store.set('es7.lang', l);
  $('#toast').hidden = true;
  applyStatic();
  if (!$('#app').hidden) { renderShell(); renderTab(); setStatus(S.statusKey || 'saved'); }
}

/* ================= toast + dialog ================= */
let toastTimer = null;
function toast(msg, action) {
  const el = $('#toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button type="button">' + esc(action.label) + '</button>' : '');
  el.hidden = false;
  if (action) el.querySelector('button').onclick = () => { el.hidden = true; action.fn(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, action ? 7000 : 4200);
}
function dialog({ title, body, ok, danger, textarea }) {
  return new Promise(resolve => {
    const ov = $('#overlay');
    ov.innerHTML = '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t">' +
      '<h2 id="dlg-t">' + esc(title) + '</h2>' +
      (body ? '<p>' + esc(body) + '</p>' : '') +
      (textarea != null ? '<textarea readonly>' + esc(textarea) + '</textarea>' : '') +
      '<div class="actions">' +
      (ok ? '<button class="btn" data-r="0">' + esc(t('cancel')) + '</button>' : '') +
      '<button class="btn ' + (danger ? 'primary danger' : 'primary') + '" data-r="1">' + esc(ok || t('close')) + '</button>' +
      '</div></div>';
    ov.hidden = false;
    const done = r => { ov.hidden = true; ov.innerHTML = ''; document.removeEventListener('keydown', onKey); resolve(r); };
    const onKey = e => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', onKey);
    ov.onclick = e => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === '1'); else if (e.target === ov) done(false); };
    const ta = ov.querySelector('textarea');
    if (ta) { ta.focus(); ta.select(); } else ov.querySelector('[data-r="1"]').focus();
  });
}

/* ================= sign in ================= */
function show(id) { ['boot', 'login', 'app'].forEach(x => { $('#' + x).hidden = x !== id; }); }
function loginMsg(text, kind, html) {
  const el = $('#login-msg');
  if (!text) { el.hidden = true; return; }
  el.className = 'msg ' + (kind || 'info');
  el.innerHTML = esc(text) + (html || '');
  el.hidden = false;
}
function toLogin(reason) {
  S.sid = null; store.del('es7.sid');
  clearTimeout(S.timer); clearTimeout(S.retry); S.dirty = false;
  show('login');
  $('#f-email').hidden = false; $('#f-code').hidden = true;
  if (reason === 'INACTIVE') {
    loginMsg(t('login.inactive'), 'bad', CFG.renewUrl ? ' <a href="' + esc(CFG.renewUrl) + '" target="_blank" rel="noopener">' + esc(t('login.renew')) + '</a>' : '');
  } else if (reason === 'EXPIRED') loginMsg(t('login.expired'), 'info');
  else loginMsg('');
  setTimeout(() => $('#email').focus(), 50);
}
async function sendCode(e) {
  if (e) e.preventDefault();
  const email = ($('#email').value || S.loginEmail || '').trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { loginMsg(t('err.BAD_EMAIL'), 'bad'); return; }
  const btn = $('#f-email button');
  btn.disabled = true;
  const r = await gs('requestCode', email, LANG);
  btn.disabled = false;
  if (!r.ok) { loginMsg(t('err.' + (r.error || 'SERVER')), 'bad'); return; }
  S.loginEmail = email;
  $('#f-email').hidden = true; $('#f-code').hidden = false;
  $('#code').value = '';
  loginMsg(t('login.sent', { email: email }), 'ok');
  setTimeout(() => $('#code').focus(), 50);
}
async function verify(e) {
  if (e) e.preventDefault();
  const code = digits($('#code').value);
  if (code.length !== 6) { loginMsg(t('err.BAD_CODE'), 'bad'); return; }
  const btn = $('#f-code button[type=submit]');
  btn.disabled = true;
  const r = await gs('verifyCode', S.loginEmail, code);
  btn.disabled = false;
  if (!r.ok) {
    if (r.error === 'INACTIVE') { toLogin('INACTIVE'); return; }
    loginMsg(t('err.' + (r.error || 'SERVER')), 'bad'); return;
  }
  S.sid = r.sid; store.set('es7.sid', r.sid);
  loginMsg('');
  boot();
}

/* ================= boot + save ================= */
async function boot() {
  if (!S.sid) { toLogin(); return; }
  show('boot');
  $('#boot').innerHTML = '<div><div class="spinner"></div><span>' + esc(t('boot.loading')) + '</span></div>';
  const r = await call('load');
  if (r.error === 'AUTH') { toLogin('EXPIRED'); return; }
  if (r.error === 'INACTIVE') { toLogin('INACTIVE'); return; }
  if (r.error) {
    $('#boot').innerHTML = '<div style="text-align:center"><p>' + esc(t('boot.failed')) + '</p><button class="btn primary" id="b-retry">' + esc(t('boot.retry')) + '</button></div>';
    $('#b-retry').onclick = boot;
    return;
  }
  S.me = r.me; S.ws = r.ws; S.res = r.res; S.rev = r.ws.rev || 0;
  show('app');
  if (DEMO && !$('#demobar')) {
    const ar = LANG === 'ar';
    document.body.insertAdjacentHTML('afterbegin', '<div id="demobar" style="position:sticky;top:0;z-index:50;background:#0E2743;color:#fff;padding:9px 16px;font-size:14px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap">' +
      '<span>' + (ar ? 'دي نسخة تجريبية فيها كل مميزات باقة Store. مفيش حاجة بتتحفظ.' : 'This is a live demo with every Store feature. Nothing you change is saved.') + '</span>' +
      '<a href="https://etlobsa7.com/#pricing" style="background:#fff;color:#0E2743;padding:6px 14px;border-radius:6px;text-decoration:none;font-weight:600">' + (ar ? 'ابدأ تجربتك المجانية' : 'Start your free trial') + '</a></div>');
  }
  renderShell();
  renderTab();
  setStatus('saved');
  showNotices(r.notices);
}

function setStatus(key) {
  S.statusKey = key;
  const el = $('#status');
  el.className = 'status ' + key;
  el.querySelector('span').textContent = t('status.' + key);
}

function markDirty() {
  S.dirty = true;
  setStatus('dirty');
  clearTimeout(S.timer);
  S.timer = setTimeout(save, 900);
}

async function save(extra) {
  clearTimeout(S.timer);
  if (S.saving) { S.again = true; return; }
  if (!S.dirty && !extra) return;
  S.saving = true; S.dirty = false; S.again = false;
  setStatus('saving');
  const payload = Object.assign({ ws: S.ws, rev: S.rev }, extra || {});
  const r = await call('save', payload);
  S.saving = false;
  if (r.error === 'AUTH') { toLogin('EXPIRED'); return; }
  if (r.error === 'INACTIVE') { toLogin('INACTIVE'); return; }
  if (r.error === 'CONFLICT') { toast(t('err.conflict')); boot(); return; }
  if (r.error) {
    S.dirty = true; setStatus('error');
    if (r.error === 'TOO_BIG') { toast(t('err.TOO_BIG')); return; }
    clearTimeout(S.retry);
    S.retry = setTimeout(() => save(), 6000);
    return;
  }
  S.rev = r.rev;
  S.res = r.res;
  if (r.replaced && !S.dirty) { S.ws = r.ws; renderTab(); }
  else refreshResults();
  renderShell();
  showNotices(r.notices);
  if (S.dirty || S.again) { S.again = false; save(); }
  else setStatus('saved');
}

function showNotices(list) {
  (list || []).forEach(n => {
    const max = n === 'LIMIT_SUPPLIERS' ? S.me.limits.suppliers : S.me.limits.products;
    const extra = (n === 'LIMIT_PRODUCTS' && upsellText()) ? ' ' + upsellText() : '';
    toast(t('notice.' + n, { max: max }) + extra,
      CFG.siteUrl && n !== 'LIMIT_PROFILES' ? { label: t('upgradePlan'), fn: () => window.open(CFG.siteUrl, '_blank', 'noopener') } : null);
  });
}

window.addEventListener('beforeunload', e => {
  if (S.dirty || S.saving) { e.preventDefault(); e.returnValue = t('status.leave'); return t('status.leave'); }
});

/* ================= shell ================= */
const TABS = [
  { id: 'start', g: 0 }, { id: 'walk', g: 0 }, { id: 'dash', g: 0 },
  { id: 'settings', g: 1 }, { id: 'seasons', g: 1 }, { id: 'suppliers', g: 1 }, { id: 'products', g: 1 },
  { id: 'plan', g: 2 }, { id: 'orders', g: 2 }, { id: 'demand', g: 2 }, { id: 'trends', g: 2 },
  { id: 'score', g: 2 }, { id: 'dead', g: 2 }, { id: 'cash', g: 2 }, { id: 'health', g: 2 }
];
const RESULT_TABS = ['dash', 'plan', 'orders', 'demand', 'trends', 'score', 'dead', 'cash', 'health'];

function renderShell() { renderNav(); renderAccount(); }

function renderNav() {
  if (!S.res) return;
  const d = S.res.dash;
  const badges = {
    products: { n: S.ws.products.length },
    suppliers: { n: S.ws.suppliers.length },
    plan: { n: d.decisions.CRITICAL + d.decisions.ORDER, crit: d.decisions.CRITICAL > 0 },
    health: { n: d.fix, crit: d.fix > 0, hideZero: true }
  };
  let html = '', g = -1;
  TABS.forEach(tab => {
    if (tab.g !== g) { g = tab.g; if (g > 0) html += '<div class="nav-label">' + esc(t('nav.g' + g)) + '</div>'; }
    const b = badges[tab.id];
    const badge = b && !(b.hideZero && !b.n) ? '<span class="badge' + (b.crit ? ' crit' : '') + '">' + b.n + '</span>' : '';
    html += '<button type="button" data-act="tab" data-tab="' + tab.id + '"' + (S.tab === tab.id ? ' aria-current="page"' : '') + '><span>' + esc(t('nav.' + tab.id)) + '</span>' + badge + '</button>';
  });
  $('#nav').innerHTML = html;
  $('#bar-title').textContent = t('nav.' + S.tab);
  const cur = $('#nav [aria-current="page"]');
  if (cur && window.matchMedia('(max-width:900px)').matches) cur.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function renderAccount() {
  const lim = S.me.limits;
  const usage = lim.products >= 500 ? t('plan.usageUnl', { n: S.ws.products.length }) : t('plan.usage', { n: S.ws.products.length, max: lim.products });
  $('#account').innerHTML =
    '<div class="email">' + esc(S.me.email) + '</div>' +
    '<div class="plan">' + esc(t('plan.' + S.me.plan)) + '<br><span style="color:#7F95AF">' + esc(usage) + '</span></div>' +
    '<div class="row">' +
    (CFG.whatsapp ? '<a class="ghost" style="text-decoration:none" href="https://wa.me/' + esc(CFG.whatsapp) + '" target="_blank" rel="noopener">' + esc(t('nav.support')) + '</a>' : '') +
    '<button class="ghost" data-act="logout">' + esc(t('nav.signout')) + '</button></div>';
}

function goTab(id, opts) {
  if (!TABS.some(x => x.id === id)) id = 'dash';
  S.tab = id; store.set('es7.tab', id);
  renderNav();
  renderTab();
  if (!opts || !opts.keepScroll) window.scrollTo(0, 0);
}

function renderTab() {
  const view = $('#view');
  const wrap = view.querySelector('.tbl-wrap');
  const keep = { y: window.scrollY, x: wrap ? wrap.scrollLeft : 0, ty: wrap ? wrap.scrollTop : 0 };
  const fn = VIEWS[S.tab] || VIEWS.dash;
  view.innerHTML = fn();
  $('#bar-title').textContent = t('nav.' + S.tab);
  return keep;
}

function refreshResults() {
  if (RESULT_TABS.indexOf(S.tab) >= 0) {
    const keep = renderTab();
    window.scrollTo(0, keep.y);
    const wrap = $('#view .tbl-wrap');
    if (wrap) { wrap.scrollLeft = keep.x; wrap.scrollTop = keep.ty; }
  } else if (S.tab === 'products') {
    updateVerdicts();
  } else if (S.tab === 'seasons') {
    $$('[data-used]').forEach(el => { el.textContent = t('sea.used', { n: S.ws.products.filter(p => p.profileId === el.dataset.used).length }); });
  }
  renderAccount();
}

function limitMsg(kind) {

        esc(t('dash.todayP', { split: todaySplit(d), v: money(d.orderValue), s: S.res.plan.length === 1 ? t('dash.sup1') : t('dash.supN', { n: S.res.plan.length }) })) + '</p></div>' +

  let alerts = '';

  else if (d.review) alerts += '<div class="alert warn"><span>' + esc(t('dash.review', { n: d.review })) + '</span>' + btn(t('dash.openHealth'), 'tab', ' data-tab="health"', 'small') + '</div>';
  if (S.res.budget.status === 'OVER') alerts += '<div class="alert warn"><span>' + esc(t('dash.budgetOver', { v: money(S.res.budget.diff) })) + '</span></div>';

  const turnWarn = d.turnover != null && d.turnover < 4;
  const kpi = (k, v, cls) => '<div class="kpi ' + (cls || '') + '"><span>' + esc(t('k.' + k)) + '</span><b>' + esc(v) + '</b><small>' + esc(t('k.' + k + 'S')) + '</small></div>';
  const kpis = '<div class="kpis">' +
    kpi('stock', money(d.stockValue)) + kpi('onorder', money(d.onOrderValue)) + kpi('order', money(d.orderValue)) +
    kpi('rev', money(d.revenue)) + kpi('profit', money(d.profit)) + kpi('margin', pct(d.margin)) +
    kpi('turn', d.turnover == null ? t('na') : t('times', { n: n1(d.turnover) }), turnWarn ? 'warn' : '') +
    kpi('cover', d.avgCover == null ? t('na') : n0(d.avgCover) + ' ' + t('days')) +
    kpi('over', money(d.overstockValue), d.overstockValue > 0 ? 'warn' : '') +
    kpi('risk', money(d.riskProfit || 0), (d.riskProfit || 0) > 0 ? 'bad' : '') +
    kpi('aic', money(d.inventoryCost)) + '</div>';

  const colors = { CRITICAL: 'var(--crit)', ORDER: '#D98A00', OK: 'var(--ok)', OVER: 'var(--over)', NODEMAND: '#A9B4C0', NOHIST: '#C9D1DA' };
  const order = ['CRITICAL', 'ORDER', 'OK', 'OVER', 'NODEMAND', 'NOHIST'];
  const stack = order.filter(c => d.decisions[c]).map(c => '<i style="width:' + (100 * d.decisions[c] / d.products) + '%;background:' + colors[c] + '"></i>').join('');
  const legend = order.filter(c => d.decisions[c]).map(c => '<div>' + verdict(c) + '<b class="num">' + d.decisions[c] + '</b></div>').join('');

  const actions = d.actions.slice(0, 12).map(a =>
    '<tr><td class="name">' + bdi(a.name || t('unnamed')) + '</td><td>' + bdi(a.supplierName || t('plan.noSup')) + '</td><td>' + verdict(a.decision) +
    '</td><td class="num">' + n0(a.qty) + '</td><td class="num">' + money(a.value) + '</td></tr>').join('');

  return head(t('dash.title'), t('dash.lede')) + today + alerts +
    '<div class="section">' + kpis + '</div>' +
    '<div class="section two">' +
      '<div class="panel"><h2>' + esc(t('dash.decisions', { n: d.products })) + '</h2><div class="stack">' + stack + '</div><div class="legend">' + legend + '</div></div>' +
      '<div class="panel"><h2>' + esc(t('dash.abc')) + '</h2><div class="split">' +
        '<div><b>' + d.abc.A + '</b><span class="small">' + esc(t('dash.abcA')) + '</span></div>' +
        '<div><b>' + d.abc.B + '</b><span class="small">' + esc(t('dash.abcB')) + '</span></div>' +
        '<div><b>' + d.abc.C + '</b><span class="small">' + esc(t('dash.abcC')) + '</span></div></div>' +
        '<p class="small muted" style="margin-top:10px">' + esc(t('dash.abcP')) + (d.erratic ? ' ' + esc(t('dash.abcZ', { n: d.erratic })) : '') + '</p></div>' +
    '</div>' +
    (actions ? '<div class="section"><div class="page-head" style="margin-bottom:10px"><h2>' + esc(t('dash.actions')) + '</h2>' + btn(t('viewAll'), 'tab', ' data-tab="plan"', 'small') + '</div>' +

};

function todaySplit(d) {
  const parts = [];
  if (d.decisions.CRITICAL) parts.push(t('dash.today', { n: d.decisions.CRITICAL }));
  if (d.decisions.ORDER) parts.push(t('dash.week', { n: d.decisions.ORDER }));
  return parts.join(t('dash.and'));
}

/* ---------- Demand graphs ---------- */
// One SVG per band of similarly selling products. Drawn by hand rather than with a
// chart library, because the app must stay a single file with no external scripts.
function bandChart(band, last) {
  const W = 760, H = 280, L = 52, R = 16, TOP = 14, B = 42;
  const hist = 12, fut = 3, pts = hist + fut;
  const plotW = W - L - R, plotH = H - TOP - B;

  let max = 0;
  band.series.forEach(s => {
    s.sales.forEach(v => { if (v != null && v > max) max = v; });
    s.forecast.forEach(v => { if (v > max) max = v; });
  });
  max = Math.max(1, Math.ceil(max * 1.15 / 5) * 5);

  const x = i => L + (plotW * i) / (pts - 1);
  const y = v => TOP + plotH - (plotH * v) / max;

  let g = '';
  // horizontal grid + y labels
  for (let k = 0; k <= 4; k++) {
    const v = (max / 4) * k, yy = y(v);
    g += '<line x1="' + L + '" y1="' + yy + '" x2="' + (W - R) + '" y2="' + yy + '" stroke="var(--line-2)" stroke-width="1"/>';
    g += '<text x="' + (L - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" fill="var(--faint)">' + n0(v) + '</text>';
  }
  // month labels, every other one to avoid crowding
  for (let i = 0; i < pts; i++) {
    if (i % 2) continue;
    const m = calMonth(i + 1, last);
    g += '<text x="' + x(i) + '" y="' + (H - B + 18) + '" text-anchor="middle" font-size="11" fill="var(--faint)">' + esc(monthName(m)) + '</text>';
  }
  // boundary between history and forecast
  const xNow = x(hist - 1);
  g += '<line x1="' + xNow + '" y1="' + TOP + '" x2="' + xNow + '" y2="' + (TOP + plotH) + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3"/>';
  g += '<text x="' + xNow + '" y="' + (TOP - 3) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' + esc(t('gr.now')) + '</text>';

  band.series.forEach(s => {
    // history: skip blank months instead of drawing a line down to zero
    let d = '', started = false;
    s.sales.forEach((v, i) => {
      if (v == null) return;
      d += (started ? 'L' : 'M') + x(i) + ' ' + y(v) + ' ';
      started = true;
    });
    if (d) g += '<path d="' + d.trim() + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round"/>';
    s.sales.forEach((v, i) => {
      if (v == null) return;
      g += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="2.6" fill="' + s.color + '"><title>' + esc(s.name) + ': ' + n0(v) + '</title></circle>';
    });
    // forecast continues from the last real month
    let lastI = -1;
    s.sales.forEach((v, i) => { if (v != null) lastI = i; });
    if (lastI >= 0) {
      let f = 'M' + x(lastI) + ' ' + y(s.sales[lastI]) + ' ';
      s.forecast.forEach((v, k) => { f += 'L' + x(hist + k) + ' ' + y(v) + ' '; });
      g += '<path d="' + f.trim() + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-dasharray="4 4" opacity=".75"/>';
    }
    // when this product hits its reorder point
    const ri = s.decision === 'CRITICAL' || s.decision === 'ORDER' ? 0 : s.reorderIn;
    if (ri != null && isFinite(ri) && ri <= fut) {
      const rx = x(hist - 1 + ri);
      g += '<line x1="' + rx + '" y1="' + TOP + '" x2="' + rx + '" y2="' + (TOP + plotH) + '" stroke="' + s.color + '" stroke-width="1.5" stroke-dasharray="5 4" opacity=".8"/>';
      g += '<circle cx="' + rx + '" cy="' + TOP + '" r="3.5" fill="' + s.color + '"><title>' + esc(s.name) + ': ' +
           esc(ri <= 0.02 ? t('gr.reorderNow') : t('gr.reorder')) + '</title></circle>';
    }
  });

  const legend = band.series.map(s =>
    '<span class="gl"><i style="background:' + s.color + '"></i>' + bdi(s.name || t('unnamed')) + '</span>').join('');

  const lo = Math.round(band.lo), hi = Math.round(band.hi);
  return '<div class="panel" style="margin-top:16px">' +
    '<div class="page-head" style="margin-bottom:6px"><h3>' +
    esc(lo === hi ? t('gr.bandOne', { lo: lo }) : t('gr.band', { lo: lo, hi: hi })) + '</h3></div>' +
    '<div class="glegend">' + legend + '</div>' +
    '<div style="overflow-x:auto"><svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img" aria-label="' +
    esc(t('gr.units')) + '">' + g + '</svg></div></div>';
}

/* ---------- Plain-language reasoning behind a verdict ---------- */
function whyText(r) {
  const rate = n1(r.dDay || 0);
  if (r.decision === 'NOHIST') return t('why.NOHIST');
  if (r.decision === 'NODEMAND') return t('why.NODEMAND');
  if (r.decision === 'OVER') {
    const excess = r.dDay > 0 ? Math.max(0, r.onHand - S.ws.settings.overstockDays * r.dDay) : 0;
    return t('why.OVER', { cover: n0(r.cover), limit: n0(S.ws.settings.overstockDays),
                           excess: n0(excess), value: money(r.overstockValue) });
  }
  if (r.decision === 'OK') {
    return t('why.OK', { ip: n0(r.ip), rop: n0(r.rop), rate: rate, days: n0(r.daysToReorder) });
  }
  const base = t('why.' + r.decision, { ip: n0(r.ip), ss: n0(r.ss), rop: n0(r.rop), rate: rate, lt: n0(r.lt) });
  const risk = (r.risk && r.risk.profit > 0)
    ? ' ' + t('why.risk', { v: money(r.risk.profit), d: n0(r.risk.days) }) : '';
  return base + risk;
}

/* ================= editing ================= */
function onEdit(e) {
  const el = e.target;
  const scope = el.dataset.scope, f = el.dataset.f;
  if (!scope || !f) return;
  const isNum = !(f === 'name' || f === 'terms' || f === 'supplierId' || f === 'profileId');

  let value;
  if (el.type === 'checkbox') value = el.checked;
  else if (el.tagName === 'SELECT') value = (f === 'sl' || f === 'lastMonth') ? Number(el.value) : el.value;
  else if (isNum) {
    const p = parseNum(el.value);
    el.classList.toggle('bad', !p.ok);
    if (!p.ok) return;
    value = p.v;
  } else value = el.value;

  if (scope === 'settings') {
    if (value === null) return;
    S.ws.settings[f] = value;
    if (f === 'lastMonth' && S.tab !== 'settings') renderTab();
  } else if (scope === 'supplier') {
    const s = S.ws.suppliers.find(x => x.id === el.closest('tr').dataset.id);
    if (!s) return;
    s[f] = value;
  } else if (scope === 'product') {
    const p = S.ws.products.find(x => x.id === el.closest('tr').dataset.id);
    if (!p) return;
    if (f === 'sales') p.sales[Number(el.dataset.i)] = value;
    else p[f] = value;
  } else if (scope === 'profile') {
    const p = S.ws.profiles.find(x => x.id === el.dataset.id);
    if (!p) return;
    if (f === 'f') {
      if (value === null || value <= 0) { el.classList.add('bad'); return; }
      p.f[Number(el.dataset.i)] = value;
      $('[data-bars="' + p.id + '"]').innerHTML = barsHtml(p.f);
    } else p.name = value;
  }
  markDirty();
}

function cellAt(r, c) { return $('#pgrid [data-r="' + r + '"][data-c="' + c + '"]'); }

function onKey(e) {
  const el = e.target;
  if (e.key !== 'Enter' || el.dataset.scope !== 'product' || el.dataset.r == null) return;
  e.preventDefault();
  const next = cellAt(Number(el.dataset.r) + (e.shiftKey ? -1 : 1), el.dataset.c);
  if (next) next.focus();
}

function onPaste(e) {
  const el = e.target;
  if (el.dataset.scope !== 'product' || el.dataset.r == null) return;
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (!/[\t\n]/.test(text.replace(/\r?\n$/, ''))) return;   // single value: let the browser handle it
  e.preventDefault();
  const grid = text.replace(/\r/g, '').replace(/\n$/, '').split('\n').map(line => line.split('\t'));
  const r0 = Number(el.dataset.r), c0 = Number(el.dataset.c);
  const ws = S.ws, max = S.me.limits.products;
  let cells = 0, capped = false;
  grid.forEach((line, dr) => {
    const r = r0 + dr;
    if (r >= ws.products.length) {
      if (ws.products.length >= max) { capped = true; return; }
      ws.products.push(blankProduct());
    }
    const p = ws.products[r];
    line.forEach((raw, dc) => {
      const col = PCOLS[c0 + dc];
      if (!col) return;
      const v = String(raw).trim();
      if (col === 'name') p.name = v;
      else if (col === 'supplierId') { const s = ws.suppliers.find(x => x.name.trim().toLowerCase() === v.toLowerCase()); if (s) p.supplierId = s.id; else return; }
      else if (col === 'profileId') { const pr = ws.profiles.find(x => [x.name, x.nameAr].some(n => n && n.trim().toLowerCase() === v.toLowerCase())); if (pr) p.profileId = pr.id; else return; }
      else if (col === 'sl') { const n = parseNum(v).v; if (CFG.serviceLevels.indexOf(n) >= 0) p.sl = n; else return; }
      else {
        const pn = parseNum(v);
        if (!pn.ok) return;
        if (col[0] === 's' && col !== 'sl') p.sales[Number(col.slice(1))] = pn.v;
        else p[col] = pn.v;
      }
      cells++;
    });
  });
  renderTab();
  renderNav();
  toast(t('pro.pasted', { n: cells }) + (capped ? ' ' + limitMsg('products') : ''));
  markDirty();
}

function blankProduct() {
  return { id: newId(), name: '', supplierId: S.ws.suppliers.length === 1 ? S.ws.suppliers[0].id : '', profileId: 'flat',
           sales: Array(12).fill(null), cost: null, price: null, onHand: 0, onOrder: 0, sl: 95 };
}

    const supplierId = sel && sel.value;
    const parsed = parseNum(costEl && costEl.value);
    if (!supplierId || !parsed.ok || parsed.v == null) { toast(t('cmp.costLabel')); return; }
    withSaveThen(() => {
      const p = S.ws.products.find(x => x.id === el.dataset.id);
      if (p) p.altSuppliers.push({ supplierId: supplierId, cost: parsed.v });
    });
  },
  removeAltSupplier: el => withSaveThen(() => {
    const p = S.ws.products.find(x => x.id === el.dataset.id);
    if (p) p.altSuppliers = p.altSuppliers.filter(a => a.supplierId !== el.dataset.sup);
  }),
  copyPO: async el => {
    const text = poText(S.res.plan[Number(el.dataset.g)]);
    try { await navigator.clipboard.writeText(text); toast(t('copied')); }
    catch (err) { dialog({ title: t('plan.msgTitle'), body: t('plan.msgHint'), textarea: text }); }
  },
  waPO: el => {
    const text = poText(S.res.plan[Number(el.dataset.g)]);
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
  }
};

/* ================= wiring ================= */
function init() {
  applyStatic();
  $('#f-email').addEventListener('submit', sendCode);
  $('#f-code').addEventListener('submit', verify);
  $('#b-other').addEventListener('click', () => { $('#f-code').hidden = true; $('#f-email').hidden = false; loginMsg(''); $('#email').focus(); });
  $('#b-resend').addEventListener('click', () => sendCode());
  $('#code').addEventListener('input', e => { if (digits(e.target.value).length === 6) verify(); });

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'INPUT') return;
    const fn = ACTIONS[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && el.dataset.act && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el);
  });
  const view = $('#view');
  view.addEventListener('input', onEdit);
  view.addEventListener('change', e => { if (e.target.tagName === 'SELECT' || e.target.type === 'checkbox') onEdit(e); });
  view.addEventListener('keydown', onKey);
  view.addEventListener('paste', onPaste);
  // Leaving a field saves right away instead of waiting.
  view.addEventListener('focusout', () => { if (S.dirty) { clearTimeout(S.timer); S.timer = setTimeout(save, 150); } });

  boot();
}
init();
</script>
