<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Page not found | Etlob Sa7</title>
<link rel="icon" href="/assets/apple-touch-icon.png">
<link href="/assets/fonts/fonts.css" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#0F172A;--body:#475569;--line:#CBD5E1;--btn:#0F172A;--btn-ink:#FFFFFF;--focus:#2563EB}
@media (prefers-color-scheme:dark){:root{--bg:#0D0F13;--ink:#F3F5F8;--body:#A3ACB9;--line:#3A414C;--btn:#F3F5F8;--btn-ink:#0D0F13;--focus:#7AAEFF}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--body);font-family:'Public Sans','IBM Plex Sans Arabic',system-ui,sans-serif;padding:24px 16px}
main{max-width:560px;width:100%;text-align:center}
img{width:56px;height:56px;border-radius:12px}
h1{font-weight:700;font-size:40px;letter-spacing:-.025em;color:var(--ink);margin:18px 0 8px;line-height:1.1}
p{font-size:17px;line-height:1.6;margin:0 0 6px}
.ar{font-family:'IBM Plex Sans Arabic',sans-serif;direction:rtl;margin-top:16px}
.ar h2{font-size:24px;font-weight:700;color:var(--ink);margin:0 0 4px}
nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
html{-webkit-tap-highlight-color:transparent}
a{display:inline-block;padding:11px 18px;border-radius:8px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;touch-action:manipulation;transition:transform 160ms cubic-bezier(.23,1,.32,1)}
a:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){a:active{transform:none}}
a.p{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<main>
<img src="/assets/apple-touch-icon.png" alt="Etlob Sa7">

</main>
</body>
</html>
