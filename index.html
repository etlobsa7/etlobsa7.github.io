/* Etlob Sa7 website: one neutral palette, one type family, no decoration. */
:root{
  --bg:#FFFFFF;--bg-2:#F8FAFC;--bg-3:#F1F5F9;--card:#FFFFFF;
  --line:#E2E8F0;--line-2:#EEF2F6;--line-3:#CBD5E1;
  --ink:#0F172A;--body:#334155;--muted:#475569;--faint:#56657A;
  --accent:#2563EB;--accent-2:#1D4ED8;--accent-ink:#FFFFFF;
  --btn:#0F172A;--btn-2:#1E293B;--btn-ink:#FFFFFF;
  --ok:#15803D;--ok-bg:#F0FDF4;--warn:#B45309;--warn-bg:#FFFBEB;--bad:#B91C1C;--bad-bg:#FEF2F2;
  --c-act:#0F172A;--c-fc:#2563EB;--c-year:#64748B;--c-band:rgba(37,99,235,.12);
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.08);
  --sans:"Public Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mx:1120px;--r:12px;
  color-scheme:light;
}
html[lang="ar"]{--sans:"IBM Plex Sans Arabic","Public Sans",system-ui,"Segoe UI",Tahoma,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0F13;--bg-2:#13161B;--bg-3:#1B1F26;--card:#15181E;
  --line:#272C35;--line-2:#20242B;--line-3:#3A414C;
  --ink:#F3F5F8;--body:#CBD2DB;--muted:#A3ACB9;--faint:#98A2B0;
  --accent:#7AAEFF;--accent-2:#A3C6FF;--accent-ink:#0D0F13;
  --btn:#F3F5F8;--btn-2:#FFFFFF;--btn-ink:#0D0F13;
  --ok:#5FD08F;--ok-bg:#0F241A;--warn:#F2B65A;--warn-bg:#2A2010;--bad:#F48A80;--bad-bg:#2C1414;
  --c-act:#F3F5F8;--c-fc:#7AAEFF;--c-year:#8A94A3;--c-band:rgba(122,174,255,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0F13;--bg-2:#13161B;--bg-3:#1B1F26;--card:#15181E;
  --line:#272C35;--line-2:#20242B;--line-3:#3A414C;
  --ink:#F3F5F8;--body:#CBD2DB;--muted:#A3ACB9;--faint:#98A2B0;
  --accent:#7AAEFF;--accent-2:#A3C6FF;--accent-ink:#0D0F13;
  --btn:#F3F5F8;--btn-2:#FFFFFF;--btn-ink:#0D0F13;
  --ok:#5FD08F;--ok-bg:#0F241A;--warn:#F2B65A;--warn-bg:#2A2010;--bad:#F48A80;--bad-bg:#2C1414;
  --c-act:#F3F5F8;--c-fc:#7AAEFF;--c-year:#8A94A3;--c-band:rgba(122,174,255,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--sans);font-size:17px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--sans);color:var(--ink);margin:0 0 .5em;font-weight:700}
h1{font-size:clamp(2.2rem,4.6vw,3.4rem);line-height:1.08;letter-spacing:-.03em}
h2{font-size:clamp(1.7rem,3vw,2.4rem);line-height:1.15;letter-spacing:-.022em}
h3{font-size:1.2rem;line-height:1.35;font-weight:600;letter-spacing:-.01em}
h4{font-size:1.02rem;line-height:1.4;font-weight:600}
h1,h2,h3{text-wrap:balance}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{letter-spacing:0;line-height:1.3}
p{margin:0 0 1em}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--accent-2)}
strong{color:var(--ink);font-weight:600}
code{font-size:.9em}
.wrap{max-width:var(--mx);margin:0 auto;padding:0 24px}
.narrow{max-width:760px;margin:0 auto}
.eyebrow{font-size:.9rem;font-weight:600;color:var(--muted);margin:0 0 12px;letter-spacing:0}
.lede{font-size:clamp(1.05rem,1.6vw,1.18rem);color:var(--muted);line-height:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::selection{background:color-mix(in srgb,var(--accent) 22%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main:focus{outline:none}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:300;background:var(--btn);color:var(--btn-ink);padding:10px 14px;border-radius:8px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}

/* ---------- navigation ---------- */
.nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--line)}
.nav-in{max-width:var(--mx);margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;min-width:0}
.brand .mark{flex:0 0 auto;display:block}
.brand b{font-weight:700;color:var(--ink);font-size:1.05rem;line-height:1.15;letter-spacing:-.01em}
.brand b span{display:block;font-size:.75rem;font-weight:500;color:var(--muted);letter-spacing:0}
.tabs{display:flex;gap:2px;align-items:center}
.tab{background:none;border:0;font:inherit;font-size:.95rem;font-weight:500;color:var(--body);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;text-decoration:none}
.tab:hover{background:var(--bg-3);color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600}
.tabs .navlogin{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;padding-block:4px;margin-inline-start:8px;padding-inline-start:16px;border-inline-start:1px solid var(--line);border-radius:0}
.tabs .navlogin:hover{background:none}
.tabs .navlogin small{font-size:.75rem;font-weight:500;color:var(--muted)}
.tabs .navlogin b{font-size:.95rem;font-weight:600;color:var(--ink)}
.tabs .navlogin:hover b{color:var(--accent)}
.menubtn{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);line-height:0}
.drawer{display:none;border-top:1px solid var(--line);background:var(--bg);padding:8px 24px 16px;flex-direction:column}
.drawer.open{display:flex}
.drawer .tab{display:block;width:100%;text-align:start;padding:12px;font-size:1rem;border-radius:8px}
.drawer .tab.navlogin{border-top:1px solid var(--line);border-radius:0;margin-top:6px;padding-top:16px}
@media (max-width:1000px){.tabs{display:none}.menubtn{display:block}}
@media (max-width:600px){
  .nav-in{padding:10px 16px;gap:8px}
  .nav-in > div:last-child{gap:6px !important;flex-shrink:0}
  .brand b{font-size:.95rem}
  .brand b span{font-size:.68rem}
  #langBtn{display:none}
  .nav-in .btn-sm{padding:8px 12px;font-size:.85rem;white-space:nowrap}
}
@media (max-width:400px){.brand b span{display:none}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:8px;font:inherit;font-weight:600;font-size:.98rem;line-height:1.3;
  text-decoration:none;border:1px solid transparent;cursor:pointer;text-align:center;transition:background-color .15s,border-color .15s,color .15s}
.btn-primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn-primary:hover{background:var(--btn-2);border-color:var(--btn-2);color:var(--btn-ink)}
.btn-ghost{background:var(--bg);color:var(--ink);border-color:var(--line-3)}
.btn-ghost:hover{background:var(--bg-3);color:var(--ink)}
.btn-sm{padding:8px 14px;font-size:.9rem}
.btn-lg{padding:14px 24px;font-size:1.02rem}
.btn.loading{opacity:.7;pointer-events:none}

/* ---------- pages and sections ---------- */
.page{display:none}
.page.on{display:block}
section{padding:88px 0}
section.tight{padding:56px 0}
@media (max-width:700px){section{padding:64px 0}section.tight{padding:44px 0}}
.alt{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.head{max-width:68ch;margin:0 0 44px}
.head.mid{margin:0 auto 44px;text-align:center}
.head .lede{margin-bottom:0}
.scrollsec{position:relative}
.scrollsec > section:first-child{scroll-margin-top:70px}

/* ---------- hero ---------- */
.hero{padding:88px 0 72px;border-bottom:1px solid var(--line)}
.hero h1{max-width:15ch;margin-bottom:.45em}
.hero .lede{max-width:52ch;margin-bottom:32px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-note{margin:20px 0 0;font-size:.92rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:56px;padding-top:28px;border-top:1px solid var(--line)}
.stats b{display:block;font-size:2rem;font-weight:700;color:var(--ink);line-height:1.1;letter-spacing:-.02em;margin-bottom:6px;font-variant-numeric:tabular-nums}
.stats small{display:block;color:var(--muted);font-size:.9rem;line-height:1.5}
@media (max-width:760px){.stats{grid-template-columns:1fr;gap:20px}}
.hero-visual{margin-top:40px}
@media (min-width:1000px){
  #p-home .hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);column-gap:56px;align-items:start}
  #p-home .hero .wrap > *{grid-column:1}
  #p-home .hero .stats{grid-column:1 / -1}
  #p-home .hero .wrap > .hero-visual{grid-column:2;grid-row:1 / span 5;align-self:center;margin-top:0}
}

/* the evidence card */
.rx-card{display:block;text-decoration:none;color:var(--body);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 18px;transition:border-color .15s}
.rx-card:hover{border-color:var(--line-3);color:var(--body)}
.rx-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rx-pill{font-size:.8rem;font-weight:600;color:var(--muted);background:var(--bg-3);border-radius:6px;padding:4px 10px}
.rx-big{font-size:2.4rem;font-weight:700;line-height:1;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rx-cap{margin:10px 0 8px;font-size:.92rem;color:var(--muted)}
.rx-mini{display:block;width:100%;height:auto;margin:6px 0 4px}
.rx-act{fill:none;stroke:var(--c-act);stroke-width:2;stroke-linejoin:round}
.rx-fc{fill:none;stroke:var(--c-fc);stroke-width:2.4;stroke-linejoin:round}
.rx-band{fill:var(--c-band);stroke:none}
.rx-key{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.82rem;color:var(--muted);margin-top:6px}
.rx-key > span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.rx-key i{display:inline-block;width:18px;border-top:2px solid}
.rx-key .k1{border-color:var(--c-act)}.rx-key .k2{border-color:var(--c-fc)}
.rx-key .k3{border-top:0;height:9px;border-radius:2px;background:var(--c-band)}
.rx-go{display:inline-block;margin-top:14px;font-weight:600;color:var(--accent)}
.rx-card:hover .rx-go{text-decoration:underline;text-underline-offset:3px}

/* ---------- the real examples ---------- */
.rx-hero{padding:88px 0 56px;background:var(--bg-2);border-bottom:1px solid var(--line)}
.rx-hero h1{font-size:clamp(1.7rem,3vw,2.4rem);line-height:1.15;letter-spacing:-.022em;max-width:30ch;margin:0 0 14px}
.rx-hero .lede{max-width:64ch}
.rx-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:12px;margin-top:32px}
@media (max-width:560px){.rx-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:340px){.rx-stats{grid-template-columns:1fr}}
.rx-stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.rx-stat b{display:block;font-size:clamp(1.5rem,3vw,2rem);font-weight:700;line-height:1.1;color:var(--ink);letter-spacing:-.02em;margin-bottom:8px;font-variant-numeric:tabular-nums}
.rx-stat span{display:block;font-size:.9rem;color:var(--muted);line-height:1.5}
@media (max-width:480px){.rx-stat{padding:14px 12px}}
.proofsec{padding:64px 0}
.rx-more{text-align:center;margin:24px 0 0}
.rx-teaser{padding:48px 0}
.rx-tin{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:28px;border-radius:var(--r);background:var(--bg-2);border:1px solid var(--line)}
.rx-tin h3{margin:4px 0 6px}
.rx-tin p{margin:0}

/* charts */
.realchart{margin:24px 0 8px;padding:18px 18px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.rc-cap{font-weight:600;color:var(--ink);margin:0 0 8px}
.realchart svg{display:block;width:100%;height:auto}
.rc-grid{stroke:var(--line);stroke-width:1}
.rc-y,.rc-x{font:500 12px var(--sans);fill:var(--muted)}
.rc-l{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.rc-act{stroke:var(--c-act);stroke-width:2.2}
.rc-mon{stroke:var(--c-fc)}
.rc-year{stroke:var(--c-year);stroke-dasharray:7 6}
.rc-d-act{fill:var(--c-act)}.rc-d-mon{fill:var(--c-fc)}
.rc-band{fill:var(--c-band);stroke:none}
.rc-key{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px;font-size:.87rem;color:var(--body)}
.rc-key > span{display:inline-flex;align-items:center;gap:8px}
.rc-key i{display:inline-block;width:24px;border-top:2.5px solid}
.rc-key .k-act{border-color:var(--c-act)}
.rc-key .k-mon{border-color:var(--c-fc)}
.rc-key .k-year{border-color:var(--c-year);border-top-style:dashed}
.rc-key .k-band{border-top:0;height:12px;border-radius:3px;background:var(--c-band)}

/* tables of results */
.ptablewrap{margin-top:24px;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.ptab{width:100%;border-collapse:collapse;min-width:760px;font-size:.92rem}
.ptab th{text-align:start;font-size:.82rem;font-weight:600;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.ptab td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--body);text-align:start}
.ptab tr:last-child td{border-bottom:0}
.ptab .pf{font-weight:600;color:var(--ink)}
.ptab .pacc{min-width:170px}
.ptab .pacc b{display:block;color:var(--ink);font-variant-numeric:tabular-nums}
.ptab .pacc.lo b{color:var(--warn)}
.pbar{display:block;height:6px;border-radius:3px;background:var(--bg-3);margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;width:var(--w);background:var(--c-fc)}
.pacc.lo .pbar i{background:var(--warn)}
.pnote{margin:16px 0 0;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);color:var(--body);font-size:.94rem}
.whynote{font-size:1rem}
.pmethod{margin:14px 0 0;font-size:.87rem;color:var(--muted)}
.popnote{margin-top:14px}
details.pmore{margin-top:16px;border:0;background:none;border-radius:0}
details.pmore > summary{display:inline-block;padding:4px 0;font-size:.92rem;font-weight:500;color:var(--muted);text-decoration:underline;text-underline-offset:3px;width:fit-content}
details.pmore > summary:hover{color:var(--ink)}
details.pmore > summary::after{content:none}
details.pmore[open] > summary{margin-bottom:8px}

/* tested again */
.again{padding:88px 0 72px}
.again-h{max-width:24ch;margin:0 0 10px}
.again-sub{font-size:1.1rem;color:var(--muted);margin:0 0 32px}
.again-case{padding:28px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.again-case + .again-case{margin-top:24px}
.again-case h3{margin:0 0 8px;font-size:1.35rem}
.again-case > p{color:var(--muted)}
.again-case .realchart{border:0;padding:0;margin-top:20px}
.ag-stats{margin-top:20px}
.st-tools .rx-stat b{white-space:nowrap}
@media (max-width:480px){.again-case{padding:20px 16px}}

/* ---------- problem, features, learning ---------- */
.pains{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.pains{grid-template-columns:1fr}}
.pain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px}
.pain b{display:block;color:var(--ink);font-size:1.08rem;font-weight:600;margin-bottom:6px}
.pain p{margin:0;font-size:.97rem}
.verdict{margin:28px auto 0;text-align:center;font-size:1.12rem;font-weight:600;color:var(--ink);max-width:60ch}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:940px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:660px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.card h3{margin-bottom:8px}
.card p{margin:0;font-size:.97rem}
.kicker{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.ico{width:40px;height:40px;border-radius:10px;background:var(--bg-3);color:var(--ink);display:grid;place-items:center;margin-bottom:16px}
.learn3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.learn3{grid-template-columns:1fr}}
.learn-c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.learn-c b{display:block;font-size:1.05rem;font-weight:600;color:var(--ink);margin-bottom:8px}
.learn-c span{display:block;color:var(--muted);font-size:.95rem;line-height:1.55}
.learn-note{text-align:center;color:var(--muted);font-size:.94rem;margin:24px 0 0}

/* ---------- callouts ---------- */
.box{border-radius:var(--r);padding:24px 28px;margin:28px 0;border:1px solid var(--line);background:var(--card)}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.box .lab{display:block;color:var(--ink);font-weight:600;margin-bottom:8px}
.box ul{margin:0;padding-inline-start:20px}
.box li{margin-bottom:8px;font-size:.97rem}
.box li:last-child{margin-bottom:0}
.box.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
.box.warn{background:var(--bg-2)}
.alt .box.warn{background:var(--card)}

/* ---------- pricing ---------- */
.price-note{font-size:.88rem;color:var(--muted);margin:16px 0 0}
.head.mid .price-note{margin:12px auto 0}
.pricebar{display:grid;gap:16px;justify-items:center;margin:0 auto 36px;max-width:760px;text-align:center}
.pricebar .founding{margin:0;padding:10px 14px;border:1px solid var(--line);background:var(--bg-2);border-radius:8px;font-size:.92rem;line-height:1.5;color:var(--ink);text-align:start}
.pint{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--bg-3)}
.pint button{font:inherit;font-weight:600;font-size:.92rem;border:0;background:none;color:var(--muted);padding:8px 16px;border-radius:8px;cursor:pointer}
.pint button small{font-size:.78rem;font-weight:600;color:var(--ok)}
.pint button[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.08)}
@media (max-width:560px){.pint button{padding:8px 12px}}
.pfind{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px;font-size:.94rem}
.pfind label{font-weight:600;color:var(--ink)}
.pfind input{width:110px;padding:8px 10px;border:1px solid var(--line-3);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
.pfind-out{flex-basis:100%;margin:0;color:var(--body);min-height:1.5em}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:900px){.tiers{grid-template-columns:1fr;max-width:440px;margin:0 auto}}
.tier{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 26px}
.tier.best{border:2px solid var(--ink)}
.tier.fit{outline:2px solid var(--accent);outline-offset:3px}
.badge{position:absolute;top:-12px;inset-inline-start:24px;background:var(--btn);color:var(--btn-ink);font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:6px;white-space:nowrap}
.tier h3{font-size:1rem;font-weight:600;color:var(--muted);margin-bottom:12px}
.price{font-size:2.5rem;font-weight:700;color:var(--ink);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price small{font-size:.92rem;font-weight:500;color:var(--muted);letter-spacing:0}
.peq{margin:8px 0;font-size:.88rem;color:var(--muted)}
.who{font-size:.94rem;color:var(--muted);margin:12px 0 20px;min-height:44px}
.feats{list-style:none;padding:0;margin:0 0 24px}
.feats li{position:relative;padding:8px 0;padding-inline-start:26px;font-size:.94rem;border-bottom:1px solid var(--line-2)}
.feats li:last-child{border-bottom:0}
.feats li::before{content:"";position:absolute;inset-inline-start:3px;top:15px;width:10px;height:5px;border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg)}
.tier .btn{display:flex;width:100%}
.notinc{margin:24px auto 0;max-width:680px;text-align:center;font-size:.92rem;color:var(--muted)}

/* ---------- questions ---------- */
details{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:10px;overflow:hidden}
summary{padding:18px 22px;cursor:pointer;font-weight:600;color:var(--ink);list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.3rem;color:var(--muted);font-weight:400;line-height:1;flex:0 0 auto}
details[open] > summary::after{content:"\2212"}
details .ans{padding:0 22px 20px;font-size:.97rem}
details .ans p:last-child{margin-bottom:0}

/* ---------- closing band and footer ---------- */
.band{background:var(--bg-2);border-top:1px solid var(--line);text-align:center;padding:80px 0}
.band p{color:var(--muted);max-width:54ch;margin:0 auto 28px}
footer{background:var(--bg-2);border-top:1px solid var(--line);padding:44px 0 32px;font-size:.92rem;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
.foot-links{display:flex;gap:8px 20px;flex-wrap:wrap}
.foot-links button,.foot-links a{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;font-size:.92rem;padding:0;text-decoration:none}
.foot-links button:hover,.foot-links a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.fine{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);font-size:.85rem;color:var(--faint);max-width:80ch}

/* ---------- how it works ---------- */
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding-bottom:28px;padding-inline-start:52px}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:-2px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line-3);background:var(--card);color:var(--ink);display:grid;place-items:center;font-size:.88rem;font-weight:600}
.steps li::after{content:"";position:absolute;inset-inline-start:15.5px;top:34px;bottom:4px;border-inline-start:1px solid var(--line)}
.steps li:last-child{padding-bottom:0}
.steps li:last-child::after{content:none}
.steps b{display:block;color:var(--ink);font-size:1.08rem;font-weight:600;margin-bottom:4px}
.steps p{margin:0;font-size:.97rem}
.steps + h3{margin-top:56px;padding-top:32px;border-top:1px solid var(--line)}

/* ---------- pop-ups ---------- */
.pop{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.5)}
.pop[hidden]{display:none}
.pop-card{position:relative;width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--card);color:var(--body);border:1px solid var(--line);border-radius:14px;padding:28px 26px 24px;box-shadow:var(--shadow)}
.pop-card.wide{width:min(1000px,100%)}
.pop-card h3{margin:0 0 14px;margin-inline-end:44px}
.pop-x{position:absolute;top:12px;inset-inline-end:12px;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.3rem;line-height:1;cursor:pointer}
.pop-x:hover{background:var(--bg-3)}
.pop .ptablewrap{margin-top:6px}

/* ---------- checkout ---------- */
.ck{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.ck[hidden]{display:none}
.ck-back{position:absolute;inset:0;background:rgba(15,23,42,.5)}
.ck-box{position:relative;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;background:var(--card);color:var(--body);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 26px 22px}
.ck-x{position:absolute;top:10px;inset-inline-end:12px;width:36px;height:36px;border:0;background:none;color:var(--muted);font-size:26px;line-height:1;cursor:pointer;border-radius:8px}
.ck-x:hover{background:var(--bg-3);color:var(--ink)}
.ck h2{font-size:1.5rem;line-height:1.25;margin:0 0 6px;margin-inline-end:36px}
.ck .ck-lede{font-size:.92rem;margin:0 0 16px;color:var(--muted)}
.ck-steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;padding:0;list-style:none;font-size:.8rem;color:var(--muted)}
.ck-steps li{display:flex;align-items:center;gap:6px}
.ck-steps li b{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;background:var(--bg-3);color:var(--ink);font-size:.72rem}
.ck-steps li.on{color:var(--ink);font-weight:600}
.ck-steps li.on b{background:var(--btn);color:var(--btn-ink)}
.ck-steps li+li::before{content:"";width:14px;height:1px;background:var(--line);margin-inline-end:2px}
.ck-plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.ck-plan{position:relative;display:block;border:1px solid var(--line-3);border-radius:10px;padding:10px;cursor:pointer;background:var(--card)}
.ck-plan input{position:absolute;opacity:0;pointer-events:none}
.ck-plan b{display:block;color:var(--ink);font-size:.95rem}
.ck-plan span{display:block;font-size:.8rem;color:var(--muted);line-height:1.35;margin-top:2px}
.ck-plan .ck-free{color:var(--ok);font-weight:600}
.ck-plan.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ck-plan:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.ck label.ck-l{display:block;font-size:.84rem;font-weight:600;color:var(--ink);margin:12px 0 5px}
.ck input.ck-i{width:100%;height:46px;border:1px solid var(--line-3);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
.ck input.ck-i:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.ck .ck-hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.ck-row{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ck-int{display:inline-flex;margin:0 0 12px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--bg-3)}
.ck-int label{display:inline-flex;align-items:center;gap:6px;margin:0;padding:6px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted)}
.ck-int input{position:absolute;opacity:0;width:1px;height:1px}
.ck-int label.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.ck-int small{font-size:.74rem;color:var(--ok)}
.ck-int label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.ck-sum{margin:16px 0 0;padding:12px 14px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);font-size:.9rem;color:var(--ink);line-height:1.5}
.ck-sum span{display:block;color:var(--body);font-size:.84rem;margin-top:2px}
.ck-go{width:100%;margin-top:14px;height:50px;font-size:1rem}
.ck-go[disabled]{opacity:.6;cursor:default}
.ck-msg{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:.9rem}
.ck-msg.bad{background:var(--bad-bg);color:var(--bad)}
.ck-msg.info{background:var(--bg-3);color:var(--ink)}
.ck-msg a{color:inherit;font-weight:600;text-decoration:underline}
.ck-fine{font-size:.78rem;color:var(--muted);margin:12px 0 0;display:flex;gap:6px;align-items:flex-start}
.ck-fine svg{flex:0 0 auto;margin-top:2px}
.ck-alt{font-size:.86rem;margin:14px 0 0;text-align:center;color:var(--body)}
.ck-alt a{font-weight:600}
.ck-test{display:inline-block;font-size:.74rem;font-weight:600;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:3px 8px;margin-bottom:10px}
.ck-agree{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:.86rem;line-height:1.5;color:var(--body);cursor:pointer}
.ck-agree input{flex:0 0 auto;width:20px;height:20px;margin-top:1px;accent-color:var(--ink)}
.ck-agree a{font-weight:600}
@media (max-width:520px){
  .ck{padding:0;align-items:flex-end}
  .ck-box{max-width:none;border-radius:14px 14px 0 0;max-height:94vh;padding:22px 16px 18px}
  .ck-plans{gap:6px}
  .ck-plan{padding:9px 8px}
  .ck-row{grid-template-columns:1fr}
}

/* ---------- small things ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:12px 18px;border-radius:10px;font-size:.92rem;box-shadow:var(--shadow);z-index:200;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .15s}
.toast.on{opacity:1}
.thanks{min-height:60vh;display:flex;align-items:center;justify-content:center;padding:60px 24px}
.thanks-card{max-width:480px;text-align:center}
.thanks-ico{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 20px}

/* ---------- legal pages ---------- */
.legal h3{margin-top:32px}
.legal ul{padding-inline-start:20px}
.legal li{margin:6px 0}
.legal a{text-decoration:underline}
.legal-tbl{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:10px}
.legal-tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
.legal-tbl th,.legal-tbl td{padding:10px 12px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
.legal-tbl th{background:var(--bg-2);color:var(--ink);font-weight:600}
.legal-tbl tr:last-child td{border-bottom:0}
.legal-tbl code{font-size:.85em;white-space:nowrap}
</style>

var SITE_EN = {
  t1: 'Etlob Sa7<span>Demand planning for Egypt</span>',
  t2: 'Home',
  t3: 'What We Provide',
  t4: 'How It Works',
  t5: 'A real example',
  t6: 'Pricing',
  t7: 'FAQ',
  t8: 'Start free trial',
  t9: 'Home',
  t10: 'What We Provide',
  t11: 'How It Works',
  t12: 'A real example',
  t13: 'Pricing',
  t14: 'FAQ',
  t15: 'Built in Cairo for Egyptian brands',
  t16: 'Know exactly what to reorder, and when.',
  t17: 'Many small brands sell well and guess at buying. This removes the guess: how many units to order, from which supplier, on which day, for every product you sell.',
  t18: '<a class="btn btn-primary btn-lg" data-go="pricing" href="#">Start your free trial</a>\n<a class="btn btn-ghost btn-lg" href="/demo/">See the app in action</a>',
  t19: 'Runs in your browser. Arabic and English included. Priced in Egyptian pounds.',
  t20: '<b>99.8%</b><small>Of customers found the product in stock, when a real Walmart store ordered exactly what the app said</small>',
  t21: '<b>14 days</b><small>Free trial on Basic and Pro (5 days on Store). Card required; nothing is charged until the trial ends.</small>',
  t22: '<b>Save 17%</b><small>Off the monthly price when you pay yearly: 12 months for the price of 10.</small>',
  t23: '<b>2 min</b><small>To sign in. Just your email, no password to remember.</small>',
  t24: 'The problem',
  t25: 'You may be doing both of these at once',
  t26: 'And they are often the same problem wearing two different faces.',
  t27: 'Your best seller keeps running out',
  t28: 'You reorder when the shelf looks low. Your supplier needs three weeks, and you spend them turning away the customers you worked hardest and paid most to win.',
  t29: 'Your worst product is holding your cash hostage',
  t30: 'Stock you bought on a good feeling hasn\'t moved in four months. That is not inventory. It is cash stuck in a box while you can\'t afford to restock what actually sells.',
  t31: 'Both are caused by the same thing: buying decisions made on instinct\n        instead of on your own numbers.',
  t32: 'What this is',
  t33: 'Not a stock counter. A purchasing brain.',
  t34: 'Tracking what you already have is the input. The product is the decision at\n          the end of it.',
  t35: '01',
  t36: 'It forecasts demand instead of averaging it',
  t37: 'Separates real seasonality from randomness, so a winter product is not marked unpredictable just for selling in winter. Then it follows recent growth or decline and projects forward, not backward.',
  t38: '02',
  t39: 'It makes the reorder decision for you',
  t40: 'An exact reorder level per product, from how fast it sells, how unpredictable it is, your supplier\'s lead time and how often they are late. Then the cheapest order size, rounded to what the supplier accepts.',
  t41: '03',
  t42: 'It shows you where your money actually is',
  t43: 'Every product ranked by revenue and predictability, with a specific instruction for each combination. Your steady top earner and your erratic top earner are never managed the same way.',
  t44: '04',
  t45: 'It hands you a purchase order you can send today',
  t46: 'Recommendations grouped by supplier, so you send one combined order, not one message per product. Plus a one page dashboard: cash tied up, projected profit, and what needs action this morning.',
  t47: '<a class="btn btn-ghost" data-go="how" href="#">See every feature explained in detail</a>',
  t48: 'The core idea',
  t49: 'Ordering is a trade-off with a correct answer',
  t50: 'Very few orders, so the hassle and shipping cost per order almost disappear. But you sit on a mountain of stock: paying rent on it, unable to spend that money, watching it go out of style.',
  t51: 'You barely hold any stock. But you pay the full cost of placing an order every few days, and one late delivery empties you.',
  t52: '<strong>Exactly one order size makes the two costs added together the lowest.</strong> It differs for a 40 EGP bracelet and a 480 EGP jacket, because holding the jacket costs twelve times more per unit. Across thirty products, nobody can work that out by feel.',
  t53: 'That calculation is the whole reason this app exists. Everything else is scaffolding around it.',
  t54: 'Stop guessing what to buy',
  t55: 'Free trial on every plan. Charged only when it ends. Cancel any time before.',
  t56: '<a class="btn btn-primary btn-lg" data-go="pricing" href="#">See pricing</a>',
  t57: 'What we provide',
  t58: 'Everything you need to buy stock with confidence',
  t59: 'You fill in five pages. Everything else is worked out for you, in Arabic or English.',
  t60: '1',
  t61: 'Seasonal separation',
  t62: 'What a basic spreadsheet template usually leaves out',
  t63: 'What it is',
  t64: 'Before measuring anything, each month\'s sales are\n          divided by that month\'s seasonal index. A December that normally runs 80% above average\n          gets divided by 1.8, putting every month on a comparable footing.',
  t65: 'How you use it',
  t66: 'You pick one shape per product from a dropdown:\n          Winter Peak, Summer Peak, Ramadan and Eid, or Flat. That is the entire interaction. You\n          can edit the twelve numbers behind any shape if you want to, but most people never need\n          to.',
  t67: 'Why it matters',
  t68: 'Without this, a wool scarf selling 95 in December and 3 in June looks wildly unpredictable, so the system would hold a large, expensive safety buffer to protect you. But a scarf is not unpredictable. It is a scarf. Taking the season out first keeps that buffer at the size the product actually needs.',
  t69: '2',
  t70: 'Demand forecasting with trend detection',
  t71: 'Answers what is about to happen, not what typically happened',
  t72: 'What it is',
  t73: 'It compares the average of your most recent three\n          months against your earliest three and measures the slope between them, then projects that\n          forward and reapplies the season on top.',
  t74: 'How you use it',
  t75: 'You do nothing. You type twelve months of unit\n          sales and it appears. There is an on and off switch in Settings if you ever want to\n          disable it.',
  t76: 'Why it matters',
  t77: 'A flat average quietly under-orders every\n          growing product, forever. If a product is climbing by 3 units a month, an average of the\n          last twelve months is already about eighteen units behind reality by the time you use it.\n          That gap is exactly where stockouts on your rising stars come from, which are the most\n          expensive stockouts you can have.',
  t78: '3',
  t79: 'Safety stock that accounts for your supplier, not just your sales',
  t80: 'The part that is easy to leave out',
  t81: 'What it is',
  t82: 'Safety stock covers two separate risks at once: your\n          sales running hotter than forecast during the wait, and your supplier arriving late. Both\n          are calculated and combined properly, per product.',
  t83: 'How you use it',
  t84: 'One number per supplier. If they usually take\n          21 days but you have seen 16 and you have seen 26, you enter 4. A rough rule is in the\n          file: worst delay minus best delay, divided by four.',
  t85: 'Why it matters',
  t86: 'Many simple templates only cover the sales half, so a stockout caused by a supplier being a week late is invisible to them. Covering both also brings out a useful, counterintuitive point: a reliable slow supplier can be cheaper to stock for than an unreliable fast one. Once that is a number in front of you, it becomes leverage in a negotiation.',
  t87: '4',
  t88: 'Reorder point',
  t89: 'Answers when. Not at zero, and not at a round number you invented.',
  t90: 'What it is',
  t91: 'A stock level per product. Reach it, place the order.\n          It equals your daily sales multiplied by your supplier\'s lead time, plus safety stock.',
  t92: 'How you use it',
  t93: 'You do not calculate anything. The Order\n          Decisions page shows a coloured verdict per product: order today, order this week, stock is\n          healthy, or overstocked. Red, amber, green, blue. Under each one, a plain sentence explains exactly why.',
  t94: 'Why it matters',
  t95: 'Waiting until a product is nearly gone\n          guarantees a gap, because the supplier still needs their lead time after you notice. The\n          reorder point is the exact amount of stock that carries you through that wait and no more.\n          Ordering at the right level is worth more than ordering the right quantity.',
  t96: 'Stock falls as you sell. At the reorder point you order, and what is left carries you until the delivery arrives. Safety stock is the cushion for bad weeks.',
  t97: '5',
  t98: 'Economic order quantity',
  t99: 'Answers how much, by finding the bottom of the cost curve',
  t100: 'What it is',
  t101: 'The order size where your ordering costs and your\n          holding costs added together are at their absolute minimum. It is a published formula from\n          1913 and it is used in factories worldwide.',
  t102: 'How you use it',
  t103: 'You enter two numbers once, in Settings: what\n          placing one order costs you all in, and roughly what it costs to hold 100 EGP of stock for\n          a year. Guidance for both is written into Settings. Being 20% off on these barely changes\n          the answer.',
  t104: 'Why it matters',
  t105: 'This is a number that is rarely calculated and easy to get wrong in both directions. Over-ordering freezes cash. Under-ordering burns your time and shipping budget.',
  t106: '6',
  t107: 'Supplier minimums and carton rounding',
  t108: 'A small feature that removes a daily irritation',
  t109: 'What it is',
  t110: 'Every recommended quantity is automatically raised to\n          your supplier\'s minimum order and rounded up to a whole carton.',
  t111: 'How you use it',
  t112: 'Two numbers per supplier, entered once.',
  t113: 'Why it matters',
  t114: 'Honestly, this one is convenience rather than transformation. But it is the difference between a tool that tells you to order 67 pieces and one that tells you to order 72, which is six full boxes, which is an order you can copy and send without thinking about it.',
  t115: '7',
  t116: 'Inventory position tracking',
  t117: 'Prevents the single most expensive spreadsheet mistake',
  t118: 'What it is',
  t119: 'Every decision is made against stock on hand plus\n          stock already on order, never against what is physically in front of you.',
  t120: 'How you use it',
  t121: 'One column. When you place an order, type the\n          quantity into Stock On Order. When it arrives, move it to Stock On Hand.',
  t122: 'Why it matters',
  t123: 'Without it, here is what can happen. You order. The goods are in transit. You check the sheet next week, stock on hand is still low, so you order again. Now you have double the stock and half the cash, and you may not notice for weeks. It is an easy and expensive mistake in a home made spreadsheet, and it is preventable.',
  t124: '8',
  t125: 'Demand graphs',
  t126: 'See the shape of your sales, not just the number the engine outputs',
  t127: 'What it is',
  t128: 'A line graph of each product\'s actual monthly sales, with the forecast continuing as a dotted line and a mark showing when it will hit its reorder point. Products selling at a similar level share a graph, up to five each, so the lines stay readable even for a big catalogue.',
  t129: 'How you use it',
  t130: 'Open the Demand graphs page. Nothing to build or configure, it draws itself from the same sales history you already entered.',
  t131: 'Why it matters',
  t132: 'A number can be technically correct and still hide the story behind it. A line shows it: which products are climbing, which are fading, which have a season, and which are about to need an order. Your best sellers and your dying ones are obvious at a glance.',
  t133: 'X · steady',
  t134: 'Y · variable',
  t135: 'Z · erratic',
  t136: 'A<br/>top 80%',
  t137: '<b>AX</b><span>Your engine. Automate it, push service to 99, negotiate volume pricing.</span>',
  t138: '<b>AY</b><span>High value, swings. Review weekly, hold a fuller buffer.</span>',
  t139: '<b>AZ</b><span>The hardest box. Order smaller and more often, keep the supplier warm.</span>',
  t140: 'B<br/>next 15%',
  t141: '<b>BX</b><span>Solid mid-tier. Automate the reorder and forget it.</span>',
  t142: '<b>BY</b><span>Review monthly, moderate buffer, nothing dramatic.</span>',
  t143: '<b>BZ</b><span>Keep minimum stock. Do not chase it.</span>',
  t144: 'C<br/>last 5%',
  t145: '<b>CX</b><span>Order rarely in large batches. Low service level is fine.</span>',
  t146: '<b>CY</b><span>Quarterly review, minimal stock.</span>',
  t147: '<b>CZ</b><span>Small money, impossible to plan. Usually worth discontinuing.</span>',
  t148: '9',
  t149: 'Purchase plan grouped by supplier',
  t150: 'Turns a list of numbers into an order you can send',
  t151: 'What it is',
  t152: 'Every product that needs ordering, collected under the\n          supplier it comes from, with totals, payment terms, and an optional budget check.',
  t153: 'How you use it',
  t154: 'Open the page, read one block per supplier,\n          send one message. Enter the cash you have for orders and it tells you when the plan costs more; on Store, the budget plan then works out exactly which units to buy.',
  t155: 'Why it matters',
  t156: 'Analysis is only useful if it ends in an action. This is the page that turns everything above it into a short piece of work each week. The budget warning matters more than it sounds, because recommendations that ignore your cash position are not much use.',
  t157: '10',
  t158: 'Health Check, the data audit layer',
  t159: 'Because a confident wrong answer is worse than no answer',
  t160: 'What it is',
  t161: 'A page that audits your own inputs before you trust\n          any output. It checks for missing history, selling price below cost, unknown suppliers,\n          negative stock, one-off sales spikes, thin margins, and products marked as flat whose sales\n          clearly swing.',
  t162: 'How you use it',
  t163: 'Open it after any change. Every row shows one\n          of three verdicts: FIX THIS, REVIEW, or GOOD. Each problem row names the specific problem\n          in plain language.',
  t164: 'Why it matters',
  t165: 'Any forecast is only as good as the data typed into it, and bad data can produce a confident, completely wrong order quantity. This layer looks for those problems first. It is worth running on your first day, because a first round of data entry often has a mistake or two.',
  t166: '11',
  t167: 'One page dashboard',
  t168: 'The state of your inventory business in fifteen numbers',
  t169: 'What it is',
  t170: 'Cash tied up in stock right now, projected annual\n          revenue and gross profit, your total inventory operating cost, how many products need\n          action today, your ABC split, inventory turnover, average days of cover, and the value\n          currently locked in overstock.',
  t171: 'How you use it',
  t172: 'It updates itself. You never type into it.',
  t173: 'Why it matters',
  t174: 'Two numbers here are especially useful. Inventory turnover tells you how many times your stock cycles per year, and under four is a common sign that cash is sitting still. Value locked in overstock shows how much money is held in stock beyond your overstock limit, which you could free up by discounting the right things.',
  t175: '12',
  t176: 'The guided walkthrough, and what comes next',
  t177: 'You are buying an ongoing system, not a download',
  t178: 'What it is',
  t179: 'A worked example built into the app. One click loads a fictional clothing brand, and the walkthrough tells you exactly which number you should see on each page, from an empty shop to a finished purchase order, so you can check you did it right. About 15 minutes.',
  t180: 'How you use it',
  t181: 'Open the Guided walkthrough page after you sign in, load the practice shop, and check each page against the answer key. When you are done, clear it and enter your own shop.',
  t182: 'Why it matters',
  t183: 'A tool nobody explains tends to get abandoned. Beyond the core, Pro adds custom season shapes, supplier comparison, the supplier scorecard and the cash flow forecast; Store adds the budget plan, the cash needed for the next 3 months, demand graphs with the reorder timeline, profit at risk and the dead stock report. Everyone on a plan gets each new tool for that plan the day it ships, and your own workspace and data stay exactly where you left them even if you cancel.',
  t184: 'Also included',
  t185: 'Eighteen connected pages',
  t186: 'You type into five of them. The other thirteen do the work, some unlocking on Pro and Store.',
  t187: '<b>Start Here</b><span>Setup order, verdict legend, and an honest list of what the app cannot do</span>',
  t188: '<b>Dashboard</b><span>Cash, profit, turnover and today\'s action list on one page</span>',
  t189: '<b>Settings</b><span>Ordering cost, holding cost, overstock limit, budget, and starting each new month</span>',
  t190: '<b>Seasons</b><span>Winter, summer, Ramadan and Eid, or flat. Editable on Pro and Store.</span>',
  t191: '<b>Suppliers</b><span>Lead times, variation, minimums, carton sizes, payment terms</span>',
  t192: '<b>Products</b><span>Up to three years of sales, costs, prices, service target, stock on hand and in transit</span>',
  t193: '<b>Demand Forecast</b><span>Demand with the season removed, recent direction, variability class, forecast</span>',
  t194: '<b>Order Decisions</b><span>Safety stock, reorder point, quantity, and a plain verdict</span>',
  t195: '<b>Demand Graphs</b><span>Real sales lines per product, the forecast, and reorder timing. Store.</span>',
  t196: '<b>Purchase Plan</b><span>Orders grouped by supplier with totals and budget check</span>',
  t197: '<b>Health Check</b><span>Audits your data and flags anything that would produce a wrong order</span>',

  t199: '<a class="btn btn-primary" data-go="pricing" href="#">Start your free trial</a>',
  t200: 'How it works',
  t201: 'Set up once in an afternoon. Ten minutes a week after that.',
  t202: 'No software to install, nothing to connect to your shop. You sign in with your\n          email and type in numbers you already have.',
  t203: 'Setting up, about two hours once',
  t204: 'Enter two numbers in Settings',
  t205: 'What it costs you to place one order, all in, including your own time. And roughly what\n            it costs to hold 100 EGP of stock for a year. Both have written guidance and typical\n            Egyptian ranges on the Settings page. Rough is fine.',
  t206: 'List your suppliers',
  t207: 'How many days each one actually takes, how much that varies, their minimum order, their carton size, and their payment terms. One row each.',
  t208: 'Enter your products',
  t209: 'At least twelve months of unit sales per product (two years or more lets the app learn your seasons), cost, price, stock on hand, stock already on order, your target service level, and which seasonal shape it follows. This is the only part that takes real time, and it is once.',
  t210: 'Run the Health Check',
  t211: 'Before trusting anything. It tells you which rows have problems and exactly what is\n            wrong with them. Expect a few on your first pass. That is normal and it is the point.',
  t212: 'Read your first order decision',
  t213: 'Open Purchase Plan. Send the orders. That is the system working.',
  t214: 'Every Monday, ten minutes',
  t215: 'Count stock and update On Hand. Update On Order for anything you have paid for. Open Order\n        Decision, read the coloured verdicts, and send whatever Purchase Plan tells you to send.',
  t216: 'Start of each month, fifteen minutes',
  t217: 'Press Start a new month in Settings, type last month\'s sales into the new column, and re-run the Health Check.',
  t218: 'Every quarter, half an hour',
  t219: 'On Store, look through the demand graphs for anything that surprised you this quarter. Check the Dead Stock Report and discount or discontinue whatever has stopped moving. Revisit your seasonal profiles if a product changed shape.',
  t220: 'What you need before you start',
  t221: 'At least twelve months of unit sales per product, two years if you have them. Not revenue, units.',
  t222: 'Your cost and selling price per product.',
  t223: 'A rough idea of how long each supplier takes, and how much they vary.',
  t224: 'A current stock count. Actual counted, not estimated.',
  t225: 'Two data habits that matter more than any formula',
  t226: '<strong>A month you were out of stock is not a month of low demand.</strong> Leave it\n          blank rather than entering 0, or you teach the system that nobody wanted it.',
  t227: '<strong>Strip out one-off distortions before entering.</strong> A\n          viral week, a single wholesale order, an influencer drop. Left in, they will inflate your\n          orders for a full year.',
  t228: 'The evidence',
  t229: 'Tested against how people actually order',
  t230: 'We would rather show you the method and the limits than make a claim you\n          cannot check.',
  t231: 'The simulation',
  t232: 'Two years of daily trading, an eight product catalogue, thirty independent runs. Every ordering method got the exact same random demand and the same random supplier delays. Both learning methods re-planned every 30 days using only the sales they had seen so far, exactly like a real user.',

  t260: '142,079',
  t261: 'All figures in EGP. Total cost\n        combines ordering cost, holding cost, and the gross margin lost to stockouts. The system beat\n        gut feel in 30 runs out of 30, and beat the standard template in 29 out of 30.',
  t262: 'The result that actually matters',
  t263: 'Read fill rate and stock held together. Anyone can raise service by buying more stock: the standard template held 163,866 EGP of stock to reach 98.2%. Reaching a higher 99.4% while holding less stock is the part that needs the maths. That difference is the product.',
  t264: 'How the app itself was verified',
  t265: 'This simulation was run against the original spreadsheet model. Since then the same\n        calculation engine was rebuilt for the web app and tested again, independently, before\n        anyone could sign up:',
  t266: 'Every formula was checked against a hand worked calculation, and against dozens of edge\n          cases: an empty workspace, a product with one month of data, zero cost, price below cost,\n          missing suppliers, negative stock, no suppliers at all, and a fully loaded catalogue.',
  t267: 'Bad data cases were tested to confirm the Health Check actually catches problems rather\n          than silently producing confident nonsense.',
  t268: 'Sign in, subscription access, and every page were driven end to end in a real browser\n          before launch, in both languages.',
  t269: 'Three real issues were found and fixed this way: two of the built in season shapes did\n          not average out to a neutral 1.0 across the year, which was quietly skewing order sizes for\n          those products; a revenue-ranking edge case could leave a shop with no top tier product at\n          all; and the one-off spike check was flagging ordinary steady products. A clean interface\n          proves the buttons work. It does not prove the numbers are right, which is why this gets\n          checked separately every time something changes.',
  t270: 'Honesty',
  t271: 'What this system is not',
  t272: 'Better you hear it from us now.',
  t273: '<strong>Decision support, not a guarantee.</strong> It cannot predict a supplier vanishing or a shipment stuck at customs.',
  t274: '<strong>A brand new product cannot be forecast.</strong> Order it on judgement for its first six months.',
  t275: '<strong>Under 12 months of history, season adjustment stays off.</strong> Under six months, the Health Check tells you not to rely on it.',
  t276: '<strong>Seasons are learned from two years of sales.</strong> With one year, you pick the season shape, because one lucky December is not a season.',
  t277: '<strong>Erratic products stay expensive.</strong> Sales with no pattern need a large safety buffer, and that costs money.',
  t278: '<strong>No accounting, POS, barcode scanning or multi-location stock.</strong> It plans; you keep counting stock your usual way.',
  t279: '<strong>It is only as good as what you type in.</strong> That is why the Health Check exists.',
  t280: 'Pricing',
  t281: 'Monthly or yearly. Stop renewal whenever you like.',
  t282: 'Every plan includes the full system, both languages, the guided walkthrough, and new tools as they are added. Fourteen days free on Basic and Pro, five days on Store.',
  t283: 'Prices are in Egyptian pounds, paid by card through Paymob. A yearly plan saves 17%.',

  t320: 'Questions',
  t321: 'Before you buy',
  t322: 'Do I need to understand any of the maths?',
  t323: 'No. You enter your sales history, your costs and your supplier details.\n          The system gives you plain instructions: order today, order this week, you are covered, or\n          you are overstocked. The included walkthrough explains every concept in ordinary language\n          if you want to understand what is happening underneath, and many people do after a month\n          or two.',
  t324: 'I sell on Instagram, not a website. Does that matter?',
  t325: 'Not at all. It does not connect to any platform. It works from your\n          sales numbers, wherever those sales happened. Instagram, WhatsApp, a physical shop, a\n          marketplace, or all four at once.',
  t326: 'What if I only have six or eight months of history?',
  t327: 'It still works. Seasonal adjustment switches itself off automatically and\n          the Health Check tells you clearly that results are rougher. Below six months for a given\n          product, the honest answer is that no forecasting method is reliable, and the system says\n          so rather than pretending.',
  t328: 'Do I need to install anything?',
  t329: 'No. It runs in your browser, on your phone or your computer, the same way\n          a website does. There is nothing to download and nothing to keep updated yourself. You do\n          need an internet connection while you use it, since your numbers are calculated on our\n          servers and saved to your account as you type.',
  t330: 'Arabic or English?',
  t331: 'Both are included with every plan at no extra cost. The Arabic version is\n          fully right to left and built around EGP.',
  t332: 'How many products can it handle?',
  t333: 'Basic covers up to 15 products and 10 suppliers, with the four built in season shapes fixed as they are. Pro covers up to 50 products, Store up to 200, both with up to 100 suppliers and your own custom season shapes.',
  t334: 'What new tools are coming?',
  t335: 'New tools and improvements as they are built, plus any corrections. Pro adds custom season shapes, supplier comparison, the supplier scorecard and the cash flow forecast; Store adds the budget plan, the cash needed for the next 3 months, demand graphs with the reorder timeline, profit at risk and the dead stock report. Everyone gets each tool in their plan the day it ships. If you cancel, your workspace is kept and waiting for you if you come back later.',
  t336: 'Can I cancel easily?',
  t337: 'Yes, any time: in the app, open Settings, then Plan and billing, and press Stop renewal. Nothing more is charged, and you keep access until the end of the month or year you paid for. After that the app pauses and your data stays saved. Or message us on WhatsApp and we do it for you.',
  t338: 'How is this different from the free templates online?',
  t339: 'Free templates record what you already have. They do not forecast demand, do not calculate safety stock from your supplier\'s actual reliability, do not separate seasonality from randomness, and do not respect minimum order quantities. Those are precisely the parts that change what you buy. The real store tests on this page show how the app does on actual sales.',
  t340: 'Will this work for a service business or for made to order products?',
  t341: 'Not really, and we would rather say so. This is built for businesses\n          holding physical stock they buy in and resell. If you make to order, the reorder logic does\n          not apply to your finished goods, though it can still be useful for raw materials and\n          components.',
  t342: 'Who can see my business data?',
  t343: 'Only you. Each account gets its own private workspace that nobody else\n          can open, including other subscribers. You sign in with a one time code sent to your own\n          email, and your account works on up to two devices at a time. Nobody at Etlob Sa7 looks at\n          your numbers as part of running the product.',
  t344: 'What if I get stuck?',
  t345: 'Message us directly on WhatsApp, the number is right there in the app once you are\n          signed in. The guided walkthrough tutorial included with every plan also covers most of\n          what trips people up.',
  t346: 'Ready to stop guessing?',

  t416: 'Terms and conditions',
  t417: 'Results on this site come from tests on real public sales data (the Walmart M5 dataset) with the assumptions stated next to them, not from audited customer accounts. This product is decision support for inventory purchasing. It does not guarantee any business outcome.',

  t640: 'The same formulas were checked on all ten stores in the dataset (20 store-years), so they are not tuned to the two shown.',
  t642: 'Range the app gave in advance (built so about 8 in 10 months land inside)',
  t643: 'Expected range',
  t644: '<td class="pf">Expected range, each month of 2015</td><td>Low and high for each month, made Dec 2014</td><td>Real monthly sales</td><td class="pacc"><b>10 of 12 months inside</b><span class="pbar"><i style="--w:83.3%"></i></span></td>',
  t645: '<td class="pf">Expected range, each month of 2015</td><td>Low and high for each month, made Dec 2014</td><td>Real monthly sales</td><td class="pacc"><b>11 of 12 months inside</b><span class="pbar"><i style="--w:91.7%"></i></span></td>',
  t646: '<strong>Why the lines do not match month by month.</strong> This store\'s monthly ups and downs did not repeat from one year to the next, and no forecast can predict a bump that never happened before. Prices barely moved (under 1%), and the data does not record promotions, events or weather. What the app did: it came within 4.7% of the real year, and 10 of 12 real months landed inside its range. In a shop whose busy months repeat, such as Ramadan, Eid, school season or winter, it learns that pattern and follows it.',
  t647: 'It learns your shop',
  t648: 'It learns from your own shop as you use it.',
  t649: '<b>Your seasons</b><span>Give it two years of sales and it finds each product\'s own busy and quiet months, and leans on it only as much as your two years agree.</span>',
  t650: '<b>Your suppliers\' real delivery times</b><span>Mark orders received and it learns how long each supplier really takes, then uses that in every reorder point.</span>',
  t651: '<b>How right it has been</b><span>Each new month you enter is checked against what it forecast, so you see its real accuracy on your own shop.</span>',
  t652: 'On every plan. You can see what it has learned on the dashboard.',
  t653: 'Method: the app was given 2013 and 2014 only, then used week by week through 2015. The 40 products were picked at random (fixed seed) from hobby and household products that sold in every month of 2013 and 2014. The data has no suppliers or product costs, so three suppliers (7, 14 and 21 days, with random delays) and a cost of 55% of shelf price are assumed. The app learns each product\'s season from its own two years and the whole shop\'s, and leans on it only as much as the two years agree; with less than two years it falls back to the closest built-in season shape. The owner checks the app every Sunday and orders exactly what it says. Averages of 40 runs, each run scored on its own. Results are in US dollars.',
  t655: '<td class="pf">Gross profit for 2015</td><td>41,700 USD</td><td>40,900 USD</td><td class="pacc"><b>98.1%</b><span class="pbar"><i style="--w:98.1%"></i></span></td>',
  t684: 'Hi, I have a question about Etlob Sa7.',
  t683: 'Chat with us on WhatsApp',
  t682: 'Every Sunday morning, an email with what to order this week, what is coming up, and what the app has learned about your shop, made from your saved data. Turn it off in Settings or from the link in the email.',
  t696: 'When this week\'s orders cost more than the cash you have, it picks which units to buy so the money goes where it protects the most profit until the next order can arrive, and puts those quantities straight into your supplier messages. On two real Walmart years it lost 75% and 82% less profit than buying the most urgent orders in full. It is part of the Store plan.',
  t695: 'What does the budget plan do?',
  t694: 'Method: each Sunday the shop had 80% of the average weekly cash the app spends with no limit, and unspent cash carried to the next week. The budget plan was compared with buying the most urgent orders in full (order today first, then revenue class, then value) and with cutting every order by the same share. Profit lost is the margin on sales missed for lack of stock. Cash plan: the prediction made at the start of each month of 2015 against what the orders really cost. Averages of 10 runs, same products, suppliers and costs as tests 1 and 2, and all 20 store-years with 3 runs each.',
  t693: '<strong>Plainly:</strong> with cash short, cutting every order by the same share also does better than buying the most urgent first, and the budget plan lost 36% and 42% less profit than that too. Across all 20 store-years it lost 91% less profit than most urgent first and 45% less than cutting evenly. It is not magic: with 80% of the cash some sales are still lost (with full cash the app served 99.8% and 99.7%). The cash plan is strongest for next month and the 3-month total; months 2 and 3 on their own were 82% and 81% right in California, 68% and 65% in Wisconsin.',
  t692: '<b>85.1% / 79.0%</b><span>Cash needed for next month, right (California / Wisconsin)</span>',
  t691: '<b>88% to 92%</b><span>How close the app\'s estimate of the next 3 months of stock spending came to what was really spent</span>',
  t690: '<b>95.0% / 95.9%</b><span>Of real demand served on 80% of the cash, against 90.6% / 78.0% for most urgent first</span>',
  t689: '<b>75% to 82%</b><span>Less profit lost to empty shelves when cash covered only 80% of the orders, compared with buying the most urgent orders first</span>',
  t688: 'Same method: the app saw 2013 and 2014 only, then ran through the real 2015 with less cash than its orders needed.',
  t687: 'Test 3: the Store tools, on the same two Walmart years',

  t560: 'Every test so far',
  t559: 'Source: M5 Forecasting Accuracy competition data, store CA_3 (California): Makridakis, Spiliotis and Assimakopoulos, University of Nicosia (M Open Forecasting Center), with data provided by Walmart; Kaggle, 2020, <a href="https://www.kaggle.com/c/m5-forecasting-accuracy" target="_blank" rel="noopener">kaggle.com/c/m5-forecasting-accuracy</a>. Method paper: <a href="https://doi.org/10.1016/j.ijforecast.2021.11.013" target="_blank" rel="noopener">International Journal of Forecasting, 2022</a>. Copy used: the <a href="https://github.com/Nixtla/m5-forecasts" target="_blank" rel="noopener">Nixtla public mirror</a>. Used under the Kaggle competition rules: only results are shown here, never the raw data. Same method as test 1. Not affiliated with or endorsed by Walmart.',
  t558: '<strong>Where it falls short.</strong> Two results stay under 80%: the predictability class (72.5% exact, never more than one class off) and whether a product grows or shrinks next year (57.5%, close to a coin toss, so the app shows it as last year\'s direction, not a promise). Each product month by month is 80.3%, about the same as a three month average (79.0%), because single products sell in lumps. For the whole store month by month, repeating last year did slightly better here (93.4% against 92.2%); in Wisconsin the app did better (94.5% against 93.8%), and across all 20 store-years too (92.8% against 85.1%).',

  t504: '<b>Store: when cash is the limit<em>Store</em></b><span>The budget plan picks which units to buy when your cash is short, and the cash plan shows what the next 3 months of orders will cost. Plus demand graphs with the reorder timeline, profit at risk and the dead stock report.</span>',
  t503: '<b>Supplier scorecard and cash flow<em>Pro, Store</em></b><span>Rates each supplier\'s reliability, shows which is cheapest for a product over a year, and forecasts what your planned orders will cost and when.</span>',
  t502: '<b>One page dashboard</b><span>Cash tied up in stock, profit ahead, turnover, and what needs action today.</span>',
  t501: '<b>Health check</b><span>Catches data mistakes, like a price below cost or negative stock, before they cause a wrong order.</span>',
  t500: '<b>Ordered stock and upcoming orders</b><span>Type in what you ordered and see what arrives next; mark it received and stock updates itself while each supplier\'s real delivery time is learned.</span>',
  t499: '<b>Purchase plan by supplier</b><span>One ready order per supplier, with totals and a budget check, sent to WhatsApp in one tap.</span>',
  t498: '<b>No double orders</b><span>Every decision counts stock already on its way, so you never reorder what is in transit.</span>',
  t497: '<b>Best order size</b><span>The quantity that keeps ordering and storage costs lowest, rounded to your supplier\'s minimum and carton.</span>',
  t496: '<b>Reorder point</b><span>The exact stock level to order at, so new stock lands before you run out.</span>',
  t495: '<b>Safety stock for sales and suppliers</b><span>A buffer per product sized for both busier weeks and late suppliers.</span>',
  t494: '<b>Follows recent sales</b><span>Leans most on your latest months, so the forecast keeps up when a product speeds up or slows down.</span>',
  t493: '<b>Season-aware forecasts</b><span>Removes each product\'s normal seasonal swing, then forecasts the next three months and the whole year.</span>',

  t472: '<strong>Plainly:</strong> two results stay under 80%: the predictability class (40.0% exact, never more than one class off) and growing or shrinking (55%). This store\'s sales fell 20.5% from 2013 to 2014, then rose 5.2% in 2015. The app planned from the lower, more recent level, so its whole year forecast came in 8% under the real year, but 11 of 12 months still landed inside its range and 99.8% of real demand was served from stock. Profit at risk was 87.7% right here, and 89.9% across all 20 store-years.',
  t473: 'Method: the same as test 1. The app was given 2013 and 2014 only, then used week by week through 2015, with 40 hobby and household products picked at random (fixed seed) from those that sold in every month of 2013 and 2014, three assumed suppliers (7, 14 and 21 days, with random delays) and a cost of 55% of shelf price. Averages of 40 runs, each run scored on its own. Results are in US dollars.',
