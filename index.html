  t315: 'ضيف كارتك علشان تبدأ التجربة. مفيش أي خصم لحد ما تخلص؛ وقف التجديد من البرنامج قبلها ومش هتدفع حاجة.',
  t318: 'بياناتك فاضلة مكانها',
  t319: 'مساحة عملك بتفضل محفوظة حتى لو ألغيت، فكل حاجة زي ما سبتها بالظبط لو رجعت.',
  t320: 'أسئلة',
  t321: 'قبل ما تشتري',
  t322: 'محتاج أفهم أي رياضيات؟',
  t323: 'لأ. تدخل تاريخ مبيعاتك، تكلفتك، وبيانات موردينك. النظام بيديك تعليمات واضحة: اطلب النهارده، اطلب الأسبوع ده، انت متغطي، أو انت زيادة. الدليل الإرشادي المتضمن بيشرح كل مفهوم بلغة عادية لو عايز تفهم اللي بيحصل تحت، وناس كتير بتحب تفهم بعد شهر أو اتنين.',
  t324: 'بابيع على إنستجرام، مش موقع. ده يفرق؟',
  t325: 'خالص لأ. مش متربط بأي منصة. بيشتغل من أرقام مبيعاتك، أي ما كانت. إنستجرام، واتساب، محل فعلي، ماركت بليس، أو الأربعة مع بعض.',
  t326: 'لو عندي بس ستة أو تمن شهور تاريخ؟',
  t327: 'لسه بيشتغل. التعديل الموسمي بيتقفل لوحده وفحص البيانات بيقولك بوضوح إن النتايج أخشن. تحت ستة شهور لمنتج معين، الصراحة إن مفيش طريقة توقع موثوقة، والنظام بيقولك كده بدل ما يتظاهر.',
  t328: 'محتاج أثبت أي برنامج؟',
  t329: 'لأ. بيشتغل في متصفحك، على موبايلك أو الكمبيوتر، زي أي موقع. مفيش حاجة تنزلها ومفيش حاجة تحدثها بنفسك. محتاج اتصال إنترنت وانت بتستخدمه، لأن أرقامك بتتحسب على السيرفرات بتاعتنا وبتتحفظ في حسابك وانت بتكتب.',
  t330: 'عربي ولا إنجليزي؟',
  t331: 'الاتنين متضمنين في كل باقة من غير أي تكلفة إضافية. النسخة العربية من اليمين للشمال بالكامل ومبنية حول الجنيه المصري.',
  t332: 'كام منتج يقدر يستوعب؟',
  t333: 'الأساسية بتغطي لحد 15 منتج و10 موردين، مع أشكال المواسم الأربعة الجاهزة ثابتة زي ما هي. Pro بتغطي لحد 50 منتج، وStore لحد 200، والاتنين بلحد 100 مورد وتقدر تضيف أشكال موسم خاصة بيك.',
  t334: 'إيه الأدوات الجديدة اللي جاية؟',
  t335: 'أدوات جديدة وتحسينات أول ما تجهز، زائد أي تصحيحات. باقة Pro بتضيف أشكال المواسم الخاصة ومقارنة الموردين وتقييم الموردين وتوقع التدفق النقدي؛ وباقة Store بتضيف رسوم الطلب مع جدول مواعيد إعادة الطلب، والربح المعرض للخطر، وتقرير البضاعة الراكدة. كل مستخدم بياخد أي أداة في باقته يوم ما تنزل. لو ألغيت، مساحة عملك متحفظة وواقفاك لو رجعت بعدين.',
  t336: 'أقدر ألغي بسهولة؟',
  t337: 'أيوه، في أي وقت: في البرنامج افتح الإعدادات، وبعدين الباقة والدفع، ودوس وقف التجديد. مش هيتخصم حاجة تاني، وتفضل معاك الخدمة لحد آخر الشهر أو السنة اللي دفعتها. بعدها البرنامج بيقف مؤقتا وبياناتك بتفضل محفوظة. أو ابعتلنا على واتساب وإحنا نعملها.',
  t338: 'إيه الفرق بينه وبين القوالب المجانية على النت؟',
  t339: 'القوالب المجانية بتسجل اللي عندك بالفعل. مش بتتوقع طلب، مش بتحسب مخزون أمان من موثوقية موردك الفعلية، مش بتفصل الموسمية عن العشوائية، ومش بتحترم أقل كمية طلب. دي بالظبط الأجزاء اللي بتغير اللي بتشتريه. تجارب الفروع الحقيقية في الصفحة دي بتوريك الأداة بتعمل إيه على مبيعات فعلية.',
  t340: 'هيشتغل لخدمة أو منتجات بالطلب المسبق؟',
  t341: 'مش فعلا، ومفضلين نقولها. ده مبني لبيزنس محتفظ بمخزون فعلي بيشتريه ويبيعه. لو بتصنع بالطلب، منطق إعادة الطلب مش هيتطبق على منتجك النهائي، بس ممكن يفيدك في المواد الخام والمكونات.',
  t342: 'مين يقدر يشوف بيانات بيزنسي؟',
  t343: 'انت بس. كل حساب بياخد مساحة عمل خاصة بيه محدش يقدر يفتحها، حتى مشتركين تانيين. تسجل دخول برمز مؤقت بيوصلك على إيميلك، وحسابك بيشتغل على جهازين في نفس الوقت. محدش في اطلب صح بيبص على أرقامك كجزء من تشغيل الأداة.',
  t344: 'لو تهت؟',
  t345: 'كلمنا مباشرة على واتساب، الرقم موجود جوه الأداة بعد ما تسجل دخول. الدليل الإرشادي المتضمن مع كل باقة كمان بيغطي أغلب اللي ممكن يحيرك.',
  t346: 'مستعد تسيب التخمين؟',

  t350: 'افتح الأداة وسجل دخول بالإيميل اللي دفعت بيه: هنبعتلك كود من 6 أرقام، وباقتك شغالة بالفعل.',

  t409: '<strong style="color:var(--ink);display:block;margin-bottom:6px">اطلب صح</strong>\n        تخطيط الطلب والشراء، اتصنع في القاهرة لماركات مصرية.',

  t417: 'النتايج في الموقع ده جاية من تجارب على بيانات مبيعات حقيقية مفتوحة (بيانات Walmart M5) والافتراضات مكتوبة جنبها، مش من حسابات عملاء متدققة. المنتج ده دعم قرار لشراء المخزون. مش بيضمن أي نتيجة بيزنس.',
  t424: 'واتساب \u2066+20 109 009 9849\u2069',
  t425: 'اتفرج على الأداة الأول',
  t426: '<b>البضاعة المطلوبة والطلبيات الجاية</b><span>اكتب اللي طلبته، شوف اللي جاي الأول، وعلّمه إنه وصل: المخزون بيتحدث لوحده والموردين بيتسجلهم مدد توريد حقيقية</span>',

  t641: 'الأداة، توقع السنة كلها معمول في ديسمبر 2014',
  t640: 'ونفس المعادلات اتجربت كمان على العشر فروع في بيانات M5، سنتين لكل فرع (20 سنة فرع)، فهي مش متظبطة على الفرعين اللي قدامك بس.',
  t642: 'المدى اللي الأداة حددته من الأول (معمول بحيث حوالي 8 من كل 10 شهور يقعوا جواه)',
  t643: 'المدى المتوقع',
  t644: '<td class="pf">المدى المتوقع، كل شهر في 2015</td><td>أقل وأعلى رقم لكل شهر، معمول في ديسمبر 2014</td><td>المبيعات الشهرية الحقيقية</td><td class="pacc"><b>10 من 12 شهر جواه</b><span class="pbar"><i style="--w:83.3%"></i></span></td>',
  t645: '<td class="pf">المدى المتوقع، كل شهر في 2015</td><td>أقل وأعلى رقم لكل شهر، معمول في ديسمبر 2014</td><td>المبيعات الشهرية الحقيقية</td><td class="pacc"><b>11 من 12 شهر جواه</b><span class="pbar"><i style="--w:91.7%"></i></span></td>',
  t646: '<strong>ليه الخطوط مش متطابقة شهر بشهر.</strong> طلعات ونزلات الفرع ده الشهرية متكررتش من سنة للي بعدها، ومفيش توقع يقدر يتوقع طلعة عمرها ما حصلت قبل كده. الأسعار تقريبا متغيرتش (أقل من 1%)، والبيانات مفيهاش العروض ولا المناسبات ولا الجو. اللي الأداة عملته: قربت من إجمالي السنة الحقيقي بفرق 4.7% بس، و10 من 12 شهر حقيقي وقعوا جوه المدى بتاعها. وفي محل شهوره المزدحمة بتتكرر كل سنة، زي رمضان والعيد والمدارس والشتا، الأداة بتتعلم الشكل ده وبتمشي عليه.',
  t647: 'بتتعلم محلك',
  t648: 'بتتعلم من محلك انت وانت بتستخدمها.',
  t649: '<b>مواسمك</b><span>اديها مبيعات سنتين وهي تلاقي شهور الزحمة والهدوء لكل منتج، وبتعتمد عليه على قد ما السنتين متفقين.</span>',
  t650: '<b>مدة توريد كل مورد الحقيقية</b><span>علّم على الطلبات إنها وصلت، وهي تتعلم كل مورد بياخد قد إيه فعلا، وتستخدمه في كل نقطة إعادة طلب.</span>',
  t651: '<b>كانت صح قد إيه</b><span>كل شهر جديد بتدخله بيتقارن باللي توقعته، فتشوف دقتها الحقيقية على محلك انت.</span>',
  t652: 'في كل الباقات. وتقدر تشوف اتعلمت إيه في لوحة التحكم.',
  t653: 'الطريقة: نفس التجربة 1. الأداة خدت 2013 و2014 بس، وبعدين اتستخدمت أسبوع بأسبوع طول 2015، على 40 منتج هوايات وأدوات منزلية اتختاروا عشوائي (ببذرة ثابتة) من اللي اتباعوا كل شهر في 2013 و2014، وتلات موردين مفترضين (7 و14 و21 يوم، بتأخير عشوائي)، وتكلفة 55% من سعر البيع. متوسط 40 تجربة، وكل تجربة بتتقاس لوحدها. النتايج بالدولار الأمريكي.',
  t655: '<td class="pf">إجمالي ربح 2015</td><td>41,700 دولار</td><td>40,900 دولار</td><td class="pacc"><b>98.1%</b><span class="pbar"><i style="--w:98.1%"></i></span></td>',
  t684: 'أهلا، عندي سؤال عن اطلب صح.',
  t683: 'كلمنا على واتساب',
  t682: 'كل يوم أحد الصبح، إيميل فيه تطلب إيه الأسبوع ده، وإيه اللي جاي، والبرنامج اتعلم إيه عن محلك، معمول من بياناتك المحفوظة. تقدر تقفله من الإعدادات أو من اللينك اللي في الإيميل.',

  t559: 'المصدر: بيانات مسابقة M5 Forecasting Accuracy، فرع WI_2 (ويسكونسن): مكريداكيس وسبيليوتيس وأسيماكوبولوس، جامعة نيقوسيا (M Open Forecasting Center)، والبيانات من وول مارت؛ Kaggle، 2020، <a href="https://www.kaggle.com/c/m5-forecasting-accuracy" target="_blank" rel="noopener">kaggle.com/c/m5-forecasting-accuracy</a>. ورقة الطريقة: <a href="https://doi.org/10.1016/j.ijforecast.2021.11.013" target="_blank" rel="noopener">المجلة الدولية للتوقع، 2022</a>. النسخة المستخدمة: <a href="https://github.com/Nixtla/m5-forecasts" target="_blank" rel="noopener">النسخة العامة من Nixtla</a>. مستخدمة حسب شروط مسابقة Kaggle: بنعرض النتايج بس هنا، مش البيانات الخام. نفس طريقة التجربة 1. مش تابعين لوول مارت ولا معتمدين منها.',
  t558: '<strong>بصراحة:</strong> نتيجتين لسه تحت 80%: فئة الثبات (40.0% بالظبط، وعمرها ما بعدت أكتر من فئة واحدة)، وبيكبر ولا بيقل (55%). مبيعات الفرع ده نزلت 20.5% من 2013 لـ 2014، وبعدين زادت 5.2% في 2015. الأداة خططت على المستوى الأحدث والأقل، فتوقع السنة كلها طلع أقل من الحقيقي بـ 8%، بس 11 من 12 شهر فضلوا جوه المدى بتاعها، و99.8% من الطلب الحقيقي اتلبى من المخزون. الربح المعرض للخطر طلع صح بنسبة 87.7% هنا، و89.9% على الـ 20 سنة فرع كلها.',

  t503: '<b>تقييم الموردين والتدفق النقدي<em>Pro, Store</em></b><span>بيقيّم التزام كل مورد، ويوريك مين الأرخص لكل منتج على مدار السنة، ويتوقع طلبياتك المخططة هتكلفك قد إيه وامتى.</span>',
  t502: '<b>لوحة متابعة في صفحة واحدة</b><span>الفلوس المجمدة في البضاعة، الربح الجاي، دوران المخزون، واللي محتاج تتصرف فيه النهارده.</span>',
  t501: '<b>فحص البيانات</b><span>بيمسك غلطات البيانات، زي سعر أقل من التكلفة أو مخزون بالسالب، قبل ما تعمل طلبية غلط.</span>',

  t499: '<b>خطة شراء لكل مورد</b><span>طلبية جاهزة لكل مورد، بالإجمالي ومراجعة الميزانية، وتتبعت على واتساب بضغطة.</span>',

  t496: '<b>نقطة إعادة الطلب</b><span>مستوى المخزون اللي تطلب عنده بالظبط، علشان البضاعة الجديدة توصل قبل ما اللي عندك يخلص.</span>',

  t467: 'خدنا مبيعات يومية حقيقية من فرع وول مارت في كاليفورنيا، من بيانات M5 المفتوحة: 40 منتج هوايات وأدوات منزلية، من 2013 لـ 2015. الأداة شافت 2013 و2014 بس، وبعدين خططت لـ 2015. ده اللي توقعته جنب اللي المحل باعه فعلا.',

  t471: 'الدقة',
  t472: '<strong>فين بتقصر.</strong> نتيجتين لسه تحت 80%: فئة الثبات (72.5% بالظبط، وعمرها ما بعدت أكتر من فئة واحدة)، وهل المنتج هيكبر ولا هيقل السنة الجاية (57.5%، قريب من رمي العملة، فالأداة بتعرضه كاتجاه السنة اللي فاتت مش كوعد). كل منتج شهر بشهر 80.3%، تقريبا زي متوسط تلات شهور (79.0%)، لأن المنتج الواحد بيتباع على دفعات. وعلى مستوى المحل كله شهر بشهر، تكرار السنة اللي فاتت طلع أحسن شوية هنا (93.4% قصاد 92.2%)؛ في ويسكونسن الأداة كانت أحسن (94.5% قصاد 93.8%)، وعلى الـ 20 سنة فرع كمان (92.8% قصاد 85.1%).',
  t473: 'الطريقة: الأداة خدت بيانات 2013 و2014 بس، وبعدين اتستخدمت أسبوع بأسبوع طول 2015. الـ 40 منتج اتختاروا عشوائي (ببذرة ثابتة) من منتجات الهوايات والأدوات المنزلية اللي اتباعت كل شهر في 2013 و2014. البيانات مفيهاش موردين ولا تكلفة، فافترضنا تلات موردين (7 و14 و21 يوم، بتأخير عشوائي) وتكلفة 55% من سعر البيع. الأداة بتتعلم موسم كل منتج من سنتينه ومن موسم المحل كله، وبتعتمد عليه على قد ما السنتين متفقين؛ ولو عندك أقل من سنتين بترجع لأقرب شكل موسم جاهز. صاحب المحل بيراجع الأداة كل يوم أحد ويطلب اللي بتقوله بالظبط. متوسط 40 تجربة، وكل تجربة بتتقاس لوحدها. النتايج بالدولار الأمريكي.',

  lg_privacy_eb: "قانوني",

  lg_privacy_d: "آخر تحديث: 3 أكتوبر 2026.",
  lg_privacy_0: "مين إحنا",
  lg_privacy_1: "Etlob Sa7 (\"إحنا\") بتشغّل موقع etlobsa7.com وتطبيق Etlob Sa7. السياسة دي بتوضح البيانات الشخصية اللي بنجمعها، وليه، ومين بيساعدنا في معالجتها، وبنحتفظ بيها قد إيه، والاختيارات المتاحة ليك. بيانات النشاط موجودة في آخر الصفحة.",
  lg_privacy_2: "بنجمع إيه، وليه",
  lg_privacy_3: "بنجمع بس اللي الخدمة محتاجاه علشان تشتغل:",
  lg_privacy_4: "<li><strong>إيميلك</strong>: علشان نعمل حسابك، ونبعتلك رموز الدخول، ونبلغك بخصوص التجربة المجانية والمدفوعات (ومنها التذكير قبل أي خصم)، وكمان ملخص كل يوم أحد بأرقام محلك انت، إلا لو قفلته. تقدر تقفل الملخص من الإعدادات في التطبيق أو من اللينك اللي في كل رسالة.</li><li><strong>اختياراتك</strong>: اللغة اللي بتستخدم بيها التطبيق، علشان إيميلاتنا تبقى بنفس اللغة؛ وهل ملخص يوم الأحد شغال؛ ولو وقفت التجديد واخترت تقولنا السبب، السبب اللي اخترته وأي ملاحظة كتبتها.</li><li><strong>اسمك ورقم موبايلك</strong>: بتكتبهم لما تضيف كارت. شركة الدفع Paymob محتاجاهم علشان تنفذ الدفع بالكارت، وبنحتفظ بيهم علشان نملالك نموذج الدفع المرة الجاية.</li><li><strong>بيانات الباقة والدفع</strong>: باقتك، ومواعيد التجربة والاشتراك، وأرقام الطلب والعملية والاشتراك عند Paymob، والمبالغ، ونتيجة كل عملية دفع. محتاجينها علشان نديك الصلاحية ونحتفظ بسجلات دفع سليمة.</li><li><strong>بيانات نشاطك اللي بتكتبها في التطبيق</strong>: المنتجات، وتاريخ المبيعات، والموردين، والتكاليف، والأسعار، والطلبيات. البيانات دي بتاعتك، وبنستخدمها بس علشان التطبيق يشتغل ليك.</li><li><strong>سجلات الأمان</strong>: إمتى اتبعت رمز دخول، وإمتى دخلت وكام مرة، وأحداث الدفع، مربوطة بإيميلك. رموز الدخول ومفاتيح الجلسة بتتخزن بس بشكل مشفر باتجاه واحد (hash)، عمرها ما بتتخزن بشكل مقروء. بنستخدم السجلات دي علشان نحمي الحسابات ونمنع إساءة الاستخدام ونصلح المشاكل.</li><li><strong>سجلات الخوادم المعتادة</strong>: زي أغلب المواقع، مقدمي الاستضافة بيسجلوا تفاصيل تقنية عن كل طلب، زي عنوان IP والوقت ونوع المتصفح، للأمان ولاستمرار الخدمة.</li>",
  lg_privacy_5: "إحنا مش بنجمع رقم كارتك (بتكتبه في صفحة Paymob مش صفحتنا)، ولا موقعك، ولا جهات اتصالك. مش بنستخدم أدوات تحليل أو إعلانات أو تتبع، ومش بنبيع أو بنأجر أي بيانات شخصية.",
  lg_privacy_6: "أساس استخدامنا للبيانات",
  lg_privacy_7: "بنستخدم بياناتك علشان نقدم الخدمة اللي اشتركت فيها، وبالموافقة اللي بتديها لما تبدأ تجربة أو باقة، وعلشان نحافظ على أمان الخدمة، ونلتزم بالواجبات القانونية والمحاسبية. بنحرص إننا نتعامل مع البيانات الشخصية بما يتفق مع قانون حماية البيانات الشخصية المصري (القانون رقم 151 لسنة 2020).",
  lg_privacy_8: "مين بيعالج البيانات معانا",
  lg_privacy_9: "<li><strong>Supabase</strong>: قاعدة البيانات وخادم التطبيق، في مركز بياناتها في فرانكفورت بألمانيا (Amazon Web Services، eu-central-1). بيانات نشاطك وحسابك وسجلات الدفع متخزنة هنا.</li><li><strong>Paymob</strong>: شركة الدفع بالكارت في مصر. بتستلم اسمك وإيميلك وموبايلك مع كل عملية دفع، وبتحتفظ بالكارت للتجديدات حسب سياسة الخصوصية بتاعتها.</li><li><strong>Resend</strong>: بتبعت إيميلات الدخول والحساب. بتستلم إيميلك ونص الرسالة، وممكن تعالجهم في الولايات المتحدة.</li><li><strong>GitHub Pages</strong>: بتستضيف الموقع ده وملفات صفحات التطبيق، وبتحتفظ بسجلات الخوادم المعتادة. GitHub مقرها في الولايات المتحدة.</li><li><strong>واتساب</strong> (Meta): بس لو اخترت تكلمنا عليه.</li>",
  lg_privacy_10: "ده معناه إن بياناتك بتتخزن وبتتعالج برا مصر، في ألمانيا والولايات المتحدة. بنستخدم مقدمي خدمة معروفين بيحموا البيانات بالتشفير وضوابط الوصول، وبنشارك مع كل واحد بس اللي محتاجه.",
  lg_privacy_11: "مين يقدر يشوف بيانات نشاطك",
  lg_privacy_12: "إنت بس، لما تدخل برمز بيتبعت لإيميلك. قاعدة البيانات بترفض أي وصول مباشر: خادم التطبيق بس هو اللي يقدر يقراها، ومش بيرجّع مساحة العمل غير لصاحبها اللي داخل بحسابه. إحنا مش بنبص على بيانات نشاطك، إلا لو طلبت مساعدتنا وكان ده الطريق الوحيد إننا نساعدك.",
  lg_privacy_13: "بنحتفظ بالبيانات قد إيه",
  lg_privacy_14: "<li>حسابك وبيانات نشاطك: طول ما حسابك موجود، حتى بعد ما توقف التجديد، علشان مساحة عملك تفضل مستنياك لو رجعت. اطلب مننا وإحنا نمسحها.</li><li>لو فتحت صفحة الكارت ومضفتش كارت ومدخلتش خالص، بنمسح الحساب ده وبياناته بعد 30 يوم.</li><li>سجلات الأمان: لحد 12 شهر.</li><li>سجلات الدفع: المدة اللي قانون الضرايب والمحاسبة المصري بيطلبها، حتى بعد ما باقي الحساب يتمسح.</li>",
  lg_privacy_15: "الكوكيز وتخزين المتصفح",
  lg_privacy_16: "إحنا مش بنستخدم كوكيز. الموقع والتطبيق بيحفظوا حاجات صغيرة في تخزين المتصفح علشان يشتغلوا، زي اللغة وتسجيل دخولك. التفاصيل في <a href=\"#cookies\" data-go=\"cookies\">سياسة الكوكيز والتخزين</a>.",
  lg_privacy_17: "حقوقك",
  lg_privacy_18: "تقدر تطلب مننا:",
  lg_privacy_19: "<li>نعرفك إيه البيانات الشخصية اللي عندنا عنك ونديك نسخة منها؛</li><li>نصحح أي حاجة غلط؛</li><li>نمسح حسابك وبياناتك (ما عدا سجلات الدفع اللي القانون بيلزمنا نحتفظ بيها)؛</li><li>نوقف استخدام بياناتك في غرض إنت معترض عليه، أو تسحب موافقة اديتها.</li>",
  lg_privacy_20: "ابعتلنا على واتساب <bdi>+20 109 009 9849</bdi>. ممكن نطلب منك تأكد الطلب من إيميل حسابك، علشان محدش غيرك يطلب بياناتك. بنرد في أسرع وقت، وفي حدود المدة اللي القانون بيحددها. ولو مش راضي، تقدر تشتكي لمركز حماية البيانات الشخصية في مصر.",
  lg_privacy_21: "الأمان",
  lg_privacy_22: "الاتصال بالموقع والتطبيق مشفر (HTTPS). رموز الدخول بتنتهي بعد 10 دقايق وبتشتغل مرة واحدة. قاعدة البيانات مقفولة بحيث خادم التطبيق بس هو اللي يوصلها. مفيش طريقة آمنة 100%، لكن لو حصل اختراق أثر على بياناتك هنبلغك ونبلغ الجهات المختصة زي ما القانون بيطلب.",
  lg_privacy_23: "الأطفال",
  lg_privacy_24: "الخدمة للأنشطة التجارية ومش موجهة لأي حد أقل من 18 سنة. ومش بنجمع عن قصد بيانات عن أطفال.",
  lg_privacy_25: "تغييرات السياسة",
  lg_privacy_26: "لو غيرنا السياسة دي بشكل مهم، هننشر النسخة الجديدة هنا بتاريخ جديد، ونبلغ المشتركين بالإيميل قبل ما التغيير يطبق عليهم.",
  lg_privacy_27: "بيانات النشاط",
  lg_privacy_28: "<li><strong>الاسم التجاري:</strong> Etlob Sa7 (اطلب صح)</li><li><strong>نشاطنا:</strong> اشتراك شهري أو سنوي في تطبيق أونلاين لتخطيط الطلب والمشتريات، للأنشطة التجارية</li><li><strong>المقر:</strong> القاهرة، مصر</li><li><strong>التواصل:</strong> واتساب <bdi>+20 109 009 9849</bdi></li><li><strong>الموقع:</strong> etlobsa7.com</li>",
  lg_terms_eb: "قانوني",
  lg_terms_h: "الشروط والأحكام",
  lg_terms_d: "آخر تحديث: 3 أكتوبر 2026.",
  lg_terms_0: "الشروط دي اتفاق بينك وبين Etlob Sa7 على استخدام الموقع والتطبيق. لما تبدأ تجربة أو تدفع باقة أو تستخدم التطبيق، بتكون موافق عليها، ومعاها <a href=\"#privacy\" data-go=\"privacy\">سياسة الخصوصية</a> و<a href=\"#refunds\" data-go=\"refunds\">سياسة الاسترداد والإلغاء</a>.",
  lg_terms_1: "التطبيق ده إيه",
  lg_terms_2: "Etlob Sa7 تطبيق باشتراك بيحول تاريخ مبيعاتك لتوقعات طلب ونقط إعادة طلب وكميات شراء. هو أداة بتساعدك تاخد القرار. مش بيطلب نيابة عنك، ومش بيضمن أي بيع أو ربح أو توريد من مورد، ومش بيحل محل تقديرك. القرار النهائي في كل طلبية ليك.",

  lg_terms_7: "التجربة المجانية والدفع والتجديد التلقائي",
  lg_terms_8: "<li>كل باقة بتبدأ بتجربة مجانية: 14 يوم على الأساسية وPro، و5 أيام على Store. كل حساب له تجربة مجانية واحدة.</li><li>علشان تبدأ التجربة بتضيف كارت في صفحة Paymob الآمنة. بيتخصم مرة واحدة 1 جنيه في نفس اليوم للتأكد إن الكارت شغال.</li><li>بتختار تدفع شهري أو سنوي. شهر الدفع 30 يوم، وسنة الدفع 360 يوم (12 شهر دفع). الباقة السنوية سعرها زي 10 شهور من السعر الشهري.</li><li>لو موقفتش التجديد قبل ما التجربة تخلص، الكارت بيتخصم منه سعر الباقة والمدة اللي اخترتها تلقائيا لما التجربة تخلص، وبعدها في أول كل شهر أو سنة جديدة، لحد ما توقف التجديد.</li><li>التذكير: في تجربة الـ 14 يوم بنبعتلك إيميل قبل أول دفعة بـ 7 أيام؛ وفي تجربة Store اللي 5 أيام بنبعتلك تاني يوم من بدايتها. وفي الباقة السنوية بنبعتلك قبل كل تجديد بـ 7 أيام. وكل تذكير فيه لينك توقف بيه التجديد أونلاين.</li><li>الأسعار معروضة بالجنيه المصري في صفحة الأسعار وفي التطبيق قبل ما تدفع، وهي المبلغ اللي بيتخصم.</li><li>لو الدفع فشل، Paymob بتحاول تاني والتطبيق بيفضل شغال 3 أيام. لو فضل فاشل، الصلاحية بتتوقف لحد ما تدفع. وبياناتك بتفضل محفوظة.</li><li>لو غيرت الباقة أو المدة بعد التجربة، بتدفع السعر الجديد، والمدة المدفوعة في الباقة القديمة بتتنقل للجديدة بسعر اليوم فيها. ولو المدة دي قيمتها أكتر من سنة في الباقة الجديدة، غيرها لما مدتك الحالية تخلص.</li><li>عرض المؤسسين: أول 30 محل أول دفعة كاملة ليهم تتم بيبقوا أعضاء مؤسسين. العضو المؤسس بيحتفظ بالأسعار اللي كانت سارية يوم ما بقى عضو، لأي باقة ومدة، طول ما اشتراكه مستمر من غير ما يخلص. لو خلص (وقف التجديد والمدة المدفوعة انتهت، أو دفعة فشلت ومااتصلحتش خلال 3 أيام)، السعر المؤسس بينتهي والأسعار الحالية بتطبق. صفحة الأسعار بتوضح فاضل كام مكان.</li><li>ممكن نغير الأسعار للمستقبل. هنبلغك بالإيميل قبلها بـ 14 يوم على الأقل قبل ما السعر الجديد يطبق عليك، وتقدر توقف التجديد قبلها. وسعر العضو المؤسس مش بيزيد طول ما هو ساري.</li>",

/* ---------- bilingual rendering ---------- */
var LANG = (function () {
  try {
    var saved = localStorage.getItem('etlob-site-lang');
    if (saved === 'en' || saved === 'ar') return saved;
  } catch (e) {}
  return (navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
})();

function applyLang() {
  var dict = LANG === 'ar' ? SITE_AR : SITE_EN;
  document.querySelectorAll('[data-t]').forEach(function (el) {
    var k = el.getAttribute('data-t');
    if (dict[k] != null) el.textContent = dict[k];
  });
  document.querySelectorAll('[data-t-html]').forEach(function (el) {
    var k = el.getAttribute('data-t-html');
    if (dict[k] != null) el.innerHTML = dict[k];
  });
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('.langbtn').forEach(function (b) {
    b.textContent = LANG === 'ar' ? 'English' : 'العربية';
  });
  try { localStorage.setItem('etlob-site-lang', LANG); } catch (e) {}
  if (window.ckRender) window.ckRender();
}

function toggleLang() {
  LANG = LANG === 'ar' ? 'en' : 'ar';
  applyLang();
}

document.addEventListener('DOMContentLoaded', function () {

  var a = document.getElementById('langBtn'), b = document.getElementById('langBtnM');
  if (a) a.addEventListener('click', toggleLang);
  if (b) b.addEventListener('click', toggleLang);
  applyLang();
});

        b.style.insetInlineStart = (x * 40) + 'px'; b.style.bottom = (18 + r * 35) + 'px'; ins.push(b);
      });
    });
    shelves.push({ out: a, outs: outs, over: o, ins: ins, plank: plank, card: pains[0] });
  }
  function frameShelves() {
    var vh = window.innerHeight;
    shelves.forEach(function (S) {
      var r = S.card.getBoundingClientRect(), p = Math.min(1, Math.max(0, (vh * .92 - r.top) / (vh * .62)));
      var dir = rtl() ? 1 : -1, nOut = S.outs.length;
      S.outs.forEach(function (b, i) {
        var t = Math.min(1, Math.max(0, p * (nOut + 1.2) - (nOut - 1 - i) - .3));   /* the right-most carton leaves first */
        b.style.transform = 'translate(' + (dir * -1 * t * 160).toFixed(1) + 'px,' + (-Math.sin(t * Math.PI) * 26).toFixed(1) + 'px) rotate(' + (dir * -1 * t * 24).toFixed(1) + 'deg)';
        b.style.opacity = (1 - t).toFixed(2);
      });
      S.out.classList.toggle('empty', p > .92);
      var nIn = S.ins.length, landed = 0;
      S.ins.forEach(function (b, i) {
        var t = Math.min(1, Math.max(0, p * (nIn + 2) - i));
        var e = t < 1 ? 1 - Math.pow(1 - t, 3) : 1; if (t >= 1) landed++;
        b.style.transform = 'translateY(' + (-(1 - e) * 120).toFixed(1) + 'px)'; b.style.opacity = Math.min(1, t * 3).toFixed(2);
      });
      S.plank.style.transform = 'scaleY(' + (1 + landed / nIn * .5).toFixed(2) + ') translateY(' + (landed / nIn * 2).toFixed(1) + 'px)';
      S.over.classList.toggle('full', landed === nIn);
    });
  }

  if (reduce || !('IntersectionObserver' in window) || !document.documentElement.classList.contains('js-anim')) { return; }

  /* parcels drop onto the provide grid when it comes into view */
  var grid = document.querySelector('#s-provide .pgrid');
  if (grid) {
    grid.querySelectorAll('.pcard').forEach(function (c, i) { c.style.setProperty('--i', i); });
    new IntersectionObserver(function (es, ob) { es.forEach(function (e) { if (e.isIntersecting) { grid.classList.add('drop'); ob.disconnect(); } }); }, { threshold: .12 }).observe(grid);
    setTimeout(function () { var r = grid.getBoundingClientRect(); if (r.top < innerHeight && r.bottom > 0) grid.classList.add('drop'); }, 2500);
  }

  var ticking = false;
  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(function () { ticking = false; frameShelves(); }); } }
  window.addEventListener('scroll', onScroll, { passive: true }); window.addEventListener('resize', onScroll);
  setTimeout(frameShelves, 100);
})();
</script>
