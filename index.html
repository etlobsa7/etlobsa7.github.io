  lg_privacy_eb: "Legal",
  lg_privacy_h: "Privacy policy",
  lg_privacy_d: "Last updated 3 October 2026.",
  lg_privacy_0: "Who we are",
  lg_privacy_1: "Etlob Sa7 (\"we\", \"us\") runs the website etlobsa7.com and the Etlob Sa7 app. This policy explains what personal information we collect, why, who helps us process it, how long we keep it, and the choices you have. Our business details are at the end of this page.",
  lg_privacy_2: "What we collect, and why",
  lg_privacy_3: "We only collect what the service needs to work:",
  lg_privacy_4: "<li><strong>Your email address</strong>: to create your account, send your sign-in codes, send notices about your trial and payments (including reminders before a charge), and, unless you turn it off, a Sunday summary of your own shop's numbers. Turn the summary off in the app's Settings or from the link in each one.</li><li><strong>Your preferences</strong>: the language you use the app in, so our emails match it; whether the Sunday summary is on; and, if you stop renewal and choose to tell us, the reason you picked and any note you wrote.</li><li><strong>Your name and mobile number</strong>: entered when you add a card. Paymob, our payment company, needs them to process card payments. We keep them to fill in the payment form for you next time.</li><li><strong>Plan and billing records</strong>: your plan, trial and paid-until dates, Paymob order, transaction and subscription numbers, amounts, and whether each payment worked. We need these to give you access and to keep proper billing records.</li><li><strong>The business data you type into the app</strong>: products, sales history, suppliers, costs, prices and orders. It is yours. We use it only to run the app for you.</li><li><strong>Security records</strong>: when a sign-in code was sent, when you signed in and how many times, and payment events, linked to your email. Sign-in codes and session keys are stored only as one-way scrambled values (hashes), never in readable form. We use these records to keep accounts safe, stop abuse and fix problems.</li><li><strong>Standard server logs</strong>: like most websites, our hosting providers record technical details of each request, such as IP address, time and browser type, for security and to keep the service running.</li>",
  lg_privacy_5: "We do not collect your card number (you type it on Paymob's page, not ours), your location, or your contacts. We do not use analytics, advertising or tracking tools, and we do not sell or rent personal data.",
  lg_privacy_6: "Why we are allowed to use it",
  lg_privacy_7: "We use your information to provide the service you sign up for, with the consent you give when you start a trial or a plan, to keep the service secure, and to meet legal and accounting duties. We aim to handle personal data in line with Egypt's Personal Data Protection Law (Law No. 151 of 2020).",
  lg_privacy_8: "Who processes it for us",
  lg_privacy_9: "<li><strong>Supabase</strong>: our database and app server, in its Frankfurt, Germany data centre (Amazon Web Services, eu-central-1). Your business data, account and billing records are stored here.</li><li><strong>Paymob</strong>: our card payment company in Egypt. It receives your name, email and mobile number with each payment, and keeps your card on file for renewals under its own privacy policy.</li><li><strong>Resend</strong>: sends our sign-in and account emails. It receives your email address and the message, and may process them in the United States.</li><li><strong>GitHub Pages</strong>: hosts this website and the app's page files, and keeps standard server logs. GitHub is based in the United States.</li><li><strong>WhatsApp</strong> (Meta): only if you choose to message us there.</li>",
  lg_privacy_10: "This means your information is stored and processed outside Egypt, in Germany and the United States. We use well known providers that protect data with encryption and access controls, and we share only what each one needs.",
  lg_privacy_11: "Who can see your business data",
  lg_privacy_12: "Only you, by signing in with a code sent to your own email. The database refuses direct access: only the app's own server can read it, and it returns a workspace only to its signed-in owner. We do not look at your business data, except when you ask us for help and looking is the only way to give it.",
  lg_privacy_13: "How long we keep it",
  lg_privacy_14: "<li>Your account and business data: while your account exists, including after you stop renewal, so your workspace is waiting if you come back. Ask us and we delete it.</li><li>If you open the card page but never add a card and never sign in, we delete that account and its details after 30 days.</li><li>Security records: up to 12 months.</li><li>Billing records: as long as Egyptian tax and accounting law requires, even after the rest of your account is deleted.</li>",
  lg_privacy_15: "Cookies and browser storage",
  lg_privacy_16: "We do not use cookies. The website and app keep a few small items in your browser's storage so they work, such as your language and your sign-in. Details are in our <a href=\"#cookies\" data-go=\"cookies\">Cookie and storage policy</a>.",
  lg_privacy_17: "Your rights",
  lg_privacy_18: "You can ask us to:",
  lg_privacy_19: "<li>tell you what personal data we hold about you and give you a copy;</li><li>correct anything that is wrong;</li><li>delete your account and data (billing records we must keep by law are the exception);</li><li>stop using your data for a purpose you object to, or withdraw a consent you gave.</li>",
  lg_privacy_20: "Message us on WhatsApp at +20 109 009 9849. We may ask you to confirm the request from your account email, so nobody else can ask for your data. We reply as soon as we can, and within the time the law requires. If you are not satisfied, you can complain to Egypt's Personal Data Protection Center.",
  lg_privacy_21: "Security",
  lg_privacy_22: "Connections to the website and app are encrypted (HTTPS). Sign-in codes expire after 10 minutes and work once. The database is locked so that only the app's server can reach it. No method is perfectly secure, but if a breach affected your data we would tell you and the authorities as the law requires.",
  lg_privacy_23: "Children",
  lg_privacy_24: "The service is for businesses and is not meant for anyone under 18. We do not knowingly collect data about children.",
  lg_privacy_25: "Changes to this policy",
  lg_privacy_26: "If we change this policy in a way that matters, we will post the new version here with a new date, and tell subscribers by email before the change applies to them.",
  lg_privacy_27: "Business details",
  lg_privacy_28: "<li><strong>Trading name:</strong> Etlob Sa7</li><li><strong>What we sell:</strong> a monthly or yearly subscription to an online demand planning and purchasing app, for businesses</li><li><strong>Based in:</strong> Cairo, Egypt</li><li><strong>Contact:</strong> WhatsApp +20 109 009 9849</li><li><strong>Website:</strong> etlobsa7.com</li>",
  lg_terms_eb: "Legal",
  lg_terms_h: "Terms and conditions",
  lg_terms_d: "Last updated 3 October 2026.",
  lg_terms_0: "These terms are an agreement between you and Etlob Sa7 for using the website and the app. By starting a trial, paying for a plan or using the app, you agree to them, together with our <a href=\"#privacy\" data-go=\"privacy\">Privacy policy</a> and our <a href=\"#refunds\" data-go=\"refunds\">Refund and cancellation policy</a>.",
  lg_terms_1: "What the app is",
  lg_terms_2: "Etlob Sa7 is a subscription app that turns your sales history into demand forecasts, reorder points and purchase quantities. It is a decision support tool. It does not place orders for you, does not guarantee any sale, profit or supplier delivery, and does not replace your own judgement. You make the final decision on every order.",
  lg_terms_3: "Who can use it",
  lg_terms_4: "You must be at least 21 years old (the age of full legal capacity in Egypt) or otherwise legally able to enter into contracts, and you must use the app for a real or planned business, not for personal or household use.",
  lg_terms_5: "Your account",
  lg_terms_6: "You sign in with a one-time code sent to your email, so keep your email account secure. One account is for one subscriber's own business and works on up to two devices at a time. You are responsible for what happens in your account and for the accuracy of the data you enter.",
  lg_terms_7: "Free trial, billing and automatic renewal",
  lg_terms_8: "<li>Every plan starts with a free trial: 14 days on Basic and Pro, 5 days on Store. Each account gets one free trial.</li><li>To start the trial you add a card on Paymob's secure page. A one-time card check of 1 EGP is taken that day to confirm the card works.</li><li>You choose to pay monthly or yearly. A billing month is 30 days and a billing year is 360 days (12 billing months). A yearly plan costs the same as 10 months of the monthly price.</li><li>Unless you stop renewal before the trial ends, your card is charged the price of the plan and period you chose automatically when the trial ends, and then at the start of each new month or year, until you stop renewal.</li><li>Reminders: after a 14-day trial we email you 7 days before the first payment; on Store's 5-day trial we email you the day after it starts. On a yearly plan we email you 7 days before each renewal. Each reminder has a link to stop renewal online.</li><li>Prices are shown in Egyptian pounds on the pricing page and in the app before you pay, and are the amount charged.</li><li>If a payment fails, Paymob tries again and the app stays open for 3 days. If it still fails, access pauses until you pay. Your data is kept.</li><li>If you change plan or period after the trial, you pay the new price and any time already paid on the old plan is carried over at the new plan's price per day. If that time is worth more than a year of the new plan, switch when your current period ends.</li><li>Founding offer: the first 30 shops whose first full payment goes through become founding members. A founding member keeps the prices that applied on the day they became one, for any plan and period, for as long as their subscription continues without running out. If it runs out (renewal stopped and the paid period ended, or a failed payment not fixed within 3 days), the founding price ends and current prices apply. The pricing page shows how many places are left.</li><li>We may change prices for the future. We will tell you by email at least 14 days before a new price applies to you, and you can stop renewal before then. While a founding member's price lasts, it does not go up.</li>",
  lg_terms_9: "Cancelling and refunds",
  lg_terms_10: "Stop renewal any time in the app (Settings, then Plan and billing) or by messaging us on WhatsApp. Nothing more is charged, and you keep access until the end of the trial or the month or year you already paid for. After that the app pauses and your data stays saved. Refunds are covered by our <a href=\"#refunds\" data-go=\"refunds\">Refund and cancellation policy</a>.",
  lg_terms_11: "Using the app fairly",
  lg_terms_12: "You agree not to share or resell access, not to try to break, overload, scrape or reverse engineer the app, and not to use it for anything unlawful. We may suspend an account that does.",
  lg_terms_13: "Your data",
  lg_terms_14: "The sales, supplier and product data you enter is yours. You give us permission to store and process it only to run the app for you. You can ask for a copy or for it to be deleted at any time. See the <a href=\"#privacy\" data-go=\"privacy\">Privacy policy</a>.",
  lg_terms_15: "Our app and content",
  lg_terms_16: "The app, its design, text, calculations and the Etlob Sa7 name and logo belong to us. Your subscription gives you a personal, non-transferable right to use the app for your business while your plan or trial is active.",
  lg_terms_17: "Results are not guaranteed",
  lg_terms_18: "Forecasts, reorder points and order quantities are calculations based on the data you provide. They are not financial, accounting or legal advice, and they can be wrong, especially when data is incomplete, wrong or too short, when demand changes suddenly, or when a supplier is late. Review anything unusual before acting on it. The test results on our website come from public sales data with the assumptions stated there; they are not a promise of results for your business.",
  lg_terms_19: "Availability",
  lg_terms_20: "We work to keep the app available, but it may sometimes be unavailable for maintenance or because of problems with the internet or our providers. We do not promise uninterrupted service.",
  lg_terms_21: "Limitation of liability",
  lg_terms_22: "As far as the law allows, we are not liable for lost profits, lost sales, stock bought or not bought because of the app's output, or other indirect losses, and our total liability for any claim is limited to the amount you paid us in the three months before the claim. Nothing in these terms limits liability that the law does not allow to be limited, such as liability for fraud.",
  lg_terms_23: "Ending an account",
  lg_terms_24: "You can stop renewal or ask us to delete your account at any time. We can suspend or close an account for non-payment, misuse or a serious breach of these terms, and will tell you why first where reasonably possible.",
  lg_terms_25: "Changes to these terms",
  lg_terms_26: "If we change these terms in a way that matters, we will post the new version here with a new date and tell subscribers by email at least 14 days before it applies to them. If you do not agree, you can stop renewal before then.",
  lg_terms_27: "Law and disputes",
  lg_terms_28: "These terms are governed by the laws of the Arab Republic of Egypt. Please contact us first so we can try to solve any problem directly. Any dispute that cannot be solved this way goes to the competent courts in Cairo.",
  lg_terms_29: "Business details",
  lg_terms_30: "<li><strong>Trading name:</strong> Etlob Sa7</li><li><strong>What we sell:</strong> a monthly or yearly subscription to an online demand planning and purchasing app, for businesses</li><li><strong>Based in:</strong> Cairo, Egypt</li><li><strong>Contact:</strong> WhatsApp +20 109 009 9849</li><li><strong>Website:</strong> etlobsa7.com</li>",
  lg_cookies_eb: "Legal",
  lg_cookies_h: "Cookie and storage policy",
  lg_cookies_d: "Last updated 3 October 2026.",
  lg_cookies_0: "The short version",
  lg_cookies_1: "etlobsa7.com, the app and the demo set no cookies. We use no analytics, advertising or tracking tools, and every font and script is served from our own site, so loading a page does not contact Google, Facebook or any other tracker.",
  lg_cookies_2: "What we keep in your browser",
  lg_cookies_3: "To work, the website and app keep a few items in your browser's own storage (local storage and session storage). They stay on your device and are only sent to our server when needed to sign you in or check a payment:",
  lg_cookies_4: "<div class=\"legal-tbl\"><table><thead><tr><th>Name</th><th>Used on</th><th>What it is for</th><th>How long</th></tr></thead><tbody><tr><td><code>etlob-site-lang</code></td><td>Website</td><td>Remembers the language you chose for the website.</td><td>Until you clear it</td></tr><tr><td><code>es7.lang, es7.theme, es7.tab</code></td><td>App and demo</td><td>Remember your language, light or dark mode, and the last page you had open.</td><td>Until you clear it</td></tr><tr><td><code>es7.sid</code></td><td>App</td><td>Keeps you signed in. It holds a random sign-in key; our server stores only a scrambled (hashed) copy.</td><td>Until you sign out; the key stops working after 14 days without use</td></tr><tr><td><code>es7.pending</code></td><td>Website and app</td><td>The reference of a payment you just started, so we can confirm it when Paymob sends you back.</td><td>Removed when you sign in; ignored after 2 days</td></tr><tr><td><code>es7.ckForm (session storage)</code></td><td>Website and app</td><td>The plan, billing period, email, name and mobile you typed in the card form, so you do not retype them if a card is declined.</td><td>Deleted when you close the tab</td></tr><tr><td><code>es7.chkHide</code></td><td>App</td><td>Remembers that you hid the getting-started list.</td><td>Until you clear it</td></tr><tr><td><code>es7.signinEmail</code></td><td>Website and app</td><td>Passes the email you typed on the website to the sign-in page.</td><td>Removed as soon as it is read</td></tr></tbody></table></div>",
  lg_cookies_5: "Do we need your consent?",
  lg_cookies_6: "All of these are strictly necessary for features you ask for (signing in, paying, remembering your language), so we do not show a cookie banner. If we ever add analytics or advertising tools, we will ask for your consent first and update this page.",
  lg_cookies_7: "Other sites",
  lg_cookies_8: "When you go to Paymob's card page to pay, Paymob may set its own cookies needed to process the payment, under its own policy. WhatsApp links open WhatsApp only when you tap them.",
  lg_cookies_9: "Clearing it",
  lg_cookies_10: "You can delete these items any time from your browser settings (clear site data for etlobsa7.com). You will then need to sign in again and choose your language again.",
  lg_cookies_11: "Business details",
  lg_cookies_12: "<li><strong>Trading name:</strong> Etlob Sa7</li><li><strong>What we sell:</strong> a monthly or yearly subscription to an online demand planning and purchasing app, for businesses</li><li><strong>Based in:</strong> Cairo, Egypt</li><li><strong>Contact:</strong> WhatsApp +20 109 009 9849</li><li><strong>Website:</strong> etlobsa7.com</li>",

  lg_refunds_h: "Refund and cancellation policy",
  lg_refunds_d: "Last updated 3 October 2026.",

  lg_refunds_1: "Every plan starts free: 14 days on Basic and Pro, 5 days on Store. When you add your card, a one-time card check of 1 EGP is taken to confirm the card works; this check is not refunded. Stop renewal before the trial ends and the plan price is never charged.",
  lg_refunds_2: "How to cancel",
  lg_refunds_3: "Stop renewal any time in the app: Settings, then Plan and billing, then Stop renewal. Or message us on WhatsApp at +20 109 009 9849 and we do it for you. No form and no phone call. Nothing more is charged, and you keep access until the end of the trial or the month or year you already paid for.",

  lg_refunds_5: "Because every plan starts with a free trial, and we remind you before the first payment and before each yearly renewal, payments are not refunded once charged, including yearly payments, part of a month or year, or time you did not use. This does not affect any right to a refund that the law gives you. We always refund in full:",
  lg_refunds_6: "<li>a payment taken twice for the same period;</li><li>a charge made after you stopped renewal in time;</li><li>a charge of the wrong amount (the difference is refunded).</li>",
  lg_refunds_7: "How to ask for a refund",
  lg_refunds_8: "Message us on WhatsApp at +20 109 009 9849 with your account email and the date of the charge. We reply within 3 working days. Approved refunds go back to the card you paid with, through Paymob; how long it takes to show on your statement depends on your bank.",
  lg_refunds_9: "Changing plan",
  lg_refunds_10: "If you move to another plan or period after the trial, time you already paid for is carried over to the new plan at its price per day. It is not paid out in cash.",
  lg_refunds_11: "Please talk to us first",
  lg_refunds_12: "If something looks wrong with a charge, message us before disputing it with your bank. It is usually faster to fix directly.",

  t261: 'كل الأرقام بالجنيه المصري. التكلفة الإجمالية بتجمع تكلفة الطلب، تكلفة التخزين، وهامش الربح الضايع بسبب نفاد المخزون. النظام كسب بالإحساس في 30 تجربة من 30، وكسب القالب العادي في 29 من 30.',
  t262: 'النتيجة اللي فعلا مهمة',
  t263: 'اقرا نسبة التوفر والمخزون مع بعض. أي حد يقدر يرفع الخدمة بشراء مخزون أكتر: القالب العادي احتفظ بـ 163,866 جنيه بضاعة علشان يوصل 98.2%. إنك توصل لـ 99.4% أعلى بمخزون أقل ده الجزء اللي محتاج الحساب. الفرق ده هو المنتج.',
  t264: 'إزاي الأداة نفسها اتأكد منها',
  t265: 'المحاكاة دي اتعملت على نموذج الجدول الأصلي. من ساعتها نفس محرك الحساب اتبنى تاني لتطبيق الويب واتعمله اختبار تاني، بشكل مستقل، قبل ما أي حد يقدر يشترك:',
  t266: 'كل معادلة اتراجعت مقابل حساب يدوي، ومقابل عشرات الحالات الصعبة: مساحة عمل فاضية، منتج بشهر بيانات واحد، تكلفة صفر، سعر أقل من التكلفة، موردين ناقصين، مخزون بالسالب، مفيش موردين خالص، وكتالوج كامل محمل.',
  t267: 'اتعمل اختبار على بيانات غلط علشان نتأكد إن فحص البيانات فعلا بيمسك المشاكل بدل ما يطلع كلام واثق وغلط بهدوء.',
  t268: 'تسجيل الدخول، صلاحية الاشتراك، وكل صفحة اتشغلوا من الأول للآخر في متصفح حقيقي قبل الإطلاق، باللغتين.',
  t269: 'ثلاث مشاكل حقيقية اتلاقت واتصلحت كده: اتنين من أشكال المواسم الجاهزة كان متوسطهم السنوي مش واحد بالظبط، وده كان بيغير مقاسات الطلب لمنتجات معينة من غير ما حد يحس؛ حالة صعبة في ترتيب الإيراد كانت ممكن تسيب محل من غير أي منتج في الفئة العليا خالص؛ وفحص القفزة المفاجئة كان بيعلم على منتجات ثابتة عادية. واجهة نضيفة بتثبت إن الأزرار شغالة. مش بتثبت إن الأرقام صح، وده بالظبط سبب إننا بنراجع ده لوحده في كل مرة أي حاجة بتتغير.',
  t270: 'الصراحة',

  t275: '<strong>تحت 12 شهر تاريخ، التعديل الموسمي بيفضل مقفول.</strong> وتحت ستة شهور، فحص البيانات هيقولك ماتعتمدش عليه.',
  t276: '<strong>المواسم بتتعلم من مبيعات سنتين.</strong> لو عندك سنة واحدة، انت اللي بتختار شكل الموسم، لأن ديسمبر واحد كان حظ مش موسم.',
  t277: '<strong>المنتجات العشوائية هتفضل مكلفة.</strong> المبيعات اللي ملهاش نمط محتاجة مخزون أمان كبير، وده بيكلف فلوس.',
  t278: '<strong>من غير حسابات ولا كاشير ولا باركود ولا فروع متعددة.</strong> هي بتخطط، وانت بتعد مخزونك بطريقتك.',

  t315: 'محتاج كارت علشان تبدأ. مفيش أي خصم لحد ما التجربة تخلص، وتقدر توقفها أونلاين قبلها.',
  t318: 'بياناتك فاضلة مكانها',
  t319: 'مساحة عملك بتفضل محفوظة حتى لو ألغيت، فكل حاجة زي ما سبتها بالظبط لو رجعت.',
  t320: 'أسئلة',
  t321: 'قبل ما تشتري',
  t322: 'محتاج أفهم أي رياضيات؟',
  t323: 'لأ. تدخل تاريخ مبيعاتك، تكلفتك، وبيانات موردينك. النظام بيديك تعليمات واضحة: اطلب النهارده، اطلب الأسبوع ده، انت متغطي، أو انت زيادة. الدليل الإرشادي المتضمن بيشرح كل مفهوم بلغة عادية لو عايز تفهم اللي بيحصل تحت، وناس كتير بتحب تفهم بعد شهر أو اتنين.',
  t324: 'بابيع على إنستجرام، مش موقع. ده يفرق؟',
  t325: 'خالص لأ. مش متربط بأي منصة. بيشتغل من أرقام مبيعاتك، أي ما كانت. إنستجرام، واتساب، محل فعلي، ماركت بليس، أو الأربعة مع بعض.',
  t326: 'لو عندي بس ستة أو تمن شهور تاريخ؟',
  t327: 'لسه بيشتغل. التعديل الموسمي بيتقفل لوحده وفحص البيانات بيقولك بوضوح إن النتايج أخشن. تحت ستة شهور لمنتج معين، الصراحة إن مفيش طريقة توقع موثوقة، والنظام بيقولك كده بدل ما يتظاهر.',
  t328: 'محتاج أثبت أي برنامج؟',
  t329: 'لأ. بيشتغل في متصفحك، على موبايلك أو الكمبيوتر، زي أي موقع. مفيش حاجة تنزلها ومفيش حاجة تحدثها بنفسك. محتاج اتصال إنترنت وانت بتستخدمه، لأن أرقامك بتتحسب على السيرفرات بتاعتنا وبتتحفظ في حسابك وانت بتكتب.',
  t330: 'عربي ولا إنجليزي؟',
  t331: 'الاتنين متضمنين في كل باقة من غير أي تكلفة إضافية. النسخة العربية من اليمين للشمال بالكامل ومبنية حول الجنيه المصري.',
  t332: 'كام منتج يقدر يستوعب؟',
  t333: 'الأساسية بتغطي لحد 15 منتج و10 موردين، مع أشكال المواسم الأربعة الجاهزة ثابتة زي ما هي. Pro بتغطي لحد 50 منتج، وStore لحد 200، والاتنين بلحد 100 مورد وتقدر تضيف أشكال موسم خاصة بيك.',
  t334: 'إيه الأدوات الجديدة اللي جاية؟',
  t335: 'أدوات جديدة وتحسينات أول ما تجهز، زائد أي تصحيحات. باقة Pro بتضيف أشكال المواسم الخاصة ومقارنة الموردين وتقييم الموردين وتوقع التدفق النقدي؛ وباقة Store بتضيف خطة الميزانية، وفلوس البضاعة للـ 3 شهور الجاية، ورسوم الطلب مع جدول مواعيد إعادة الطلب، والربح المعرض للخطر، وتقرير البضاعة الراكدة. كل مستخدم بياخد أي أداة في باقته يوم ما تنزل. لو ألغيت، مساحة عملك متحفظة وواقفاك لو رجعت بعدين.',
  t336: 'أقدر ألغي بسهولة؟',
  t337: 'أيوه، في أي وقت: في البرنامج افتح الإعدادات، وبعدين الباقة والدفع، ودوس وقف التجديد. مش هيتخصم حاجة تاني، وتفضل معاك الخدمة لحد آخر الشهر أو السنة اللي دفعتها. بعدها البرنامج بيقف مؤقتا وبياناتك بتفضل محفوظة. أو ابعتلنا على واتساب وإحنا نعملها.',
  t338: 'إيه الفرق بينه وبين القوالب المجانية على النت؟',
  t339: 'القوالب المجانية بتسجل اللي عندك بالفعل. مش بتتوقع طلب، مش بتحسب مخزون أمان من موثوقية موردك الفعلية، مش بتفصل الموسمية عن العشوائية، ومش بتحترم أقل كمية طلب. دي بالظبط الأجزاء اللي بتغير اللي بتشتريه. تجارب الفروع الحقيقية في الصفحة دي بتوريك الأداة بتعمل إيه على مبيعات فعلية.',
  t340: 'هيشتغل لخدمة أو منتجات بالطلب المسبق؟',
  t341: 'مش فعلا، ومفضلين نقولها. ده مبني لبيزنس محتفظ بمخزون فعلي بيشتريه ويبيعه. لو بتصنع بالطلب، منطق إعادة الطلب مش هيتطبق على منتجك النهائي، بس ممكن يفيدك في المواد الخام والمكونات.',
  t342: 'مين يقدر يشوف بيانات بيزنسي؟',
  t343: 'انت بس. كل حساب بياخد مساحة عمل خاصة بيه محدش يقدر يفتحها، حتى مشتركين تانيين. تسجل دخول برمز مؤقت بيوصلك على إيميلك، وحسابك بيشتغل على جهازين في نفس الوقت. محدش في اطلب صح بيبص على أرقامك كجزء من تشغيل الأداة.',
  t344: 'لو تهت؟',
  t345: 'كلمنا مباشرة على واتساب، الرقم موجود جوه الأداة بعد ما تسجل دخول. الدليل الإرشادي المتضمن مع كل باقة كمان بيغطي أغلب اللي ممكن يحيرك.',
  t346: 'مستعد تسيب التخمين؟',

  t350: 'افتح الأداة وسجل دخول بالإيميل اللي دفعت بيه: هنبعتلك كود من 6 أرقام، وباقتك شغالة بالفعل.',

  t417: 'النتايج في الموقع ده جاية من تجارب على بيانات مبيعات حقيقية مفتوحة (بيانات Walmart M5) والافتراضات مكتوبة جنبها، مش من حسابات عملاء متدققة. المنتج ده دعم قرار لشراء المخزون. مش بيضمن أي نتيجة بيزنس.',
  t424: 'واتساب \u2066+20 109 009 9849\u2069',
  t425: 'اتفرج على الأداة الأول',
  t426: '<b>البضاعة المطلوبة والطلبيات الجاية</b><span>اكتب اللي طلبته، شوف اللي جاي الأول، وعلّمه إنه وصل: المخزون بيتحدث لوحده والموردين بيتسجلهم مدد توريد حقيقية</span>',

  t641: 'الأداة، توقع السنة كلها معمول في ديسمبر 2014',
  t640: 'ونفس المعادلات اتجربت على العشر فروع في البيانات (20 سنة فرع)، فهي مش متظبطة على الفرعين اللي قدامك بس.',
  t642: 'المدى اللي الأداة حددته من الأول (معمول بحيث حوالي 8 من كل 10 شهور يقعوا جواه)',
  t643: 'المدى المتوقع',
  t644: '<td class="pf">المدى المتوقع، كل شهر في 2015</td><td>أقل وأعلى رقم لكل شهر، معمول في ديسمبر 2014</td><td>المبيعات الشهرية الحقيقية</td><td class="pacc"><b>10 من 12 شهر جواه</b><span class="pbar"><i style="--w:83.3%"></i></span></td>',
  t645: '<td class="pf">المدى المتوقع، كل شهر في 2015</td><td>أقل وأعلى رقم لكل شهر، معمول في ديسمبر 2014</td><td>المبيعات الشهرية الحقيقية</td><td class="pacc"><b>11 من 12 شهر جواه</b><span class="pbar"><i style="--w:91.7%"></i></span></td>',
  t646: '<strong>ليه الخطوط مش متطابقة شهر بشهر.</strong> طلعات ونزلات الفرع ده الشهرية متكررتش من سنة للي بعدها، ومفيش توقع يقدر يتوقع طلعة عمرها ما حصلت قبل كده. الأسعار تقريبا متغيرتش (أقل من 1%)، والبيانات مفيهاش العروض ولا المناسبات ولا الجو. اللي الأداة عملته: قربت من إجمالي السنة الحقيقي بفرق 4.7% بس، و10 من 12 شهر حقيقي وقعوا جوه المدى بتاعها. وفي محل شهوره المزدحمة بتتكرر كل سنة، زي رمضان والعيد والمدارس والشتا، الأداة بتتعلم الشكل ده وبتمشي عليه.',
  t647: 'بتتعلم محلك',
  t648: 'بتتعلم من محلك انت وانت بتستخدمها.',
  t649: '<b>مواسمك</b><span>اديها مبيعات سنتين وهي تلاقي شهور الزحمة والهدوء لكل منتج، وبتعتمد عليه على قد ما السنتين متفقين.</span>',
  t650: '<b>مدة توريد كل مورد الحقيقية</b><span>علّم على الطلبات إنها وصلت، وهي تتعلم كل مورد بياخد قد إيه فعلا، وتستخدمه في كل نقطة إعادة طلب.</span>',
  t651: '<b>كانت صح قد إيه</b><span>كل شهر جديد بتدخله بيتقارن باللي توقعته، فتشوف دقتها الحقيقية على محلك انت.</span>',
  t652: 'في كل الباقات. وتقدر تشوف اتعلمت إيه في لوحة التحكم.',
  t653: 'الطريقة: الأداة خدت بيانات 2013 و2014 بس، وبعدين اتستخدمت أسبوع بأسبوع طول 2015. الـ 40 منتج اتختاروا عشوائي (ببذرة ثابتة) من منتجات الهوايات والأدوات المنزلية اللي اتباعت كل شهر في 2013 و2014. البيانات مفيهاش موردين ولا تكلفة، فافترضنا تلات موردين (7 و14 و21 يوم، بتأخير عشوائي) وتكلفة 55% من سعر البيع. الأداة بتتعلم موسم كل منتج من سنتينه ومن موسم المحل كله، وبتعتمد عليه على قد ما السنتين متفقين؛ ولو عندك أقل من سنتين بترجع لأقرب شكل موسم جاهز. صاحب المحل بيراجع الأداة كل يوم أحد ويطلب اللي بتقوله بالظبط. متوسط 40 تجربة، وكل تجربة بتتقاس لوحدها. النتايج بالدولار الأمريكي.',
  t655: '<td class="pf">إجمالي ربح 2015</td><td>41,700 دولار</td><td>40,900 دولار</td><td class="pacc"><b>98.1%</b><span class="pbar"><i style="--w:98.1%"></i></span></td>',
  t684: 'أهلا، عندي سؤال عن اطلب صح.',
  t683: 'كلمنا على واتساب',
  t682: 'كل يوم أحد الصبح، إيميل فيه تطلب إيه الأسبوع ده، وإيه اللي جاي، والبرنامج اتعلم إيه عن محلك، معمول من بياناتك المحفوظة. تقدر تقفله من الإعدادات أو من اللينك اللي في الإيميل.',
  t696: 'لما طلبات الأسبوع تبقى أغلى من الكاش اللي معاك، بتختار تشتري أنهي قطع علشان الفلوس تروح في المكان اللي بيحمي أكبر ربح لحد ما الطلب الجاي يوصل، وبتحط الكميات دي على طول في رسايل الموردين. على سنتين حقيقيتين من وول مارت، ضيعت ربح أقل بـ 75% و82% من شراء الطلبات الأكثر استعجالا كاملة. وهي جزء من باقة Store.',
  t695: 'خطة الميزانية بتعمل إيه؟',
  t694: 'الطريقة: كل يوم أحد المحل كان معاه 80% من متوسط الكاش الأسبوعي اللي الأداة بتصرفه من غير حد، والكاش اللي ماتصرفش بيترحل للأسبوع اللي بعده. خطة الميزانية اتقارنت بشراء الطلبات الأكثر استعجالا كاملة (اطلب النهارده الأول، بعدين فئة الإيراد، بعدين القيمة) وبتقليل كل طلب بنفس النسبة. الربح الضايع هو هامش المبيعات اللي راحت علشان البضاعة خلصت. خطة الكاش: التوقع اللي اتعمل أول كل شهر في 2015 قصاد اللي الطلبات اتكلفته فعلا. متوسط 10 تجارب، بنفس المنتجات والموردين والتكاليف بتوع التجربة 1 و2، والـ 20 سنة فرع كلها بـ 3 تجارب لكل واحدة.',
  t693: '<strong>بصراحة:</strong> لما الكاش يقل، تقليل كل طلب بنفس النسبة كمان أحسن من شراء الأكثر استعجالا الأول، وخطة الميزانية ضيعت ربح أقل منه كمان بـ 36% و42%. وعلى الـ 20 سنة فرع كلها، ضيعت ربح أقل بـ 91% من الأكثر استعجالا الأول، وأقل بـ 45% من التقليل بالتساوي. ده مش سحر: بـ 80% من الكاش لسه في مبيعات بتضيع (بالكاش كامل الأداة لبت 99.8% و99.7%). خطة الكاش أقوى في الشهر الجاي وإجمالي الـ 3 شهور؛ الشهر التاني والتالت لوحدهم طلعوا صح بنسبة 82% و81% في كاليفورنيا، و68% و65% في ويسكونسن.',
  t692: '<b>85.1% / 79.0%</b><span>فلوس الشهر الجاي، صح (كاليفورنيا / ويسكونسن)</span>',
  t691: '<b><bdi>88%</bdi> لـ <bdi>92%</bdi></b><span>قد إيه تقدير الأداة لفلوس البضاعة في الـ 3 شهور الجاية قرب من اللي اتصرف فعلا</span>',
  t690: '<b>95.0% / 95.9%</b><span>من الطلب الحقيقي اتلبى بـ 80% من الكاش، قصاد 90.6% / 78.0% للأكثر استعجالا الأول</span>',

  t559: 'المصدر: بيانات مسابقة M5 Forecasting Accuracy، فرع CA_3 (كاليفورنيا): مكريداكيس وسبيليوتيس وأسيماكوبولوس، جامعة نيقوسيا (M Open Forecasting Center)، والبيانات من وول مارت؛ Kaggle، 2020، <a href="https://www.kaggle.com/c/m5-forecasting-accuracy" target="_blank" rel="noopener">kaggle.com/c/m5-forecasting-accuracy</a>. ورقة الطريقة: <a href="https://doi.org/10.1016/j.ijforecast.2021.11.013" target="_blank" rel="noopener">المجلة الدولية للتوقع، 2022</a>. النسخة المستخدمة: <a href="https://github.com/Nixtla/m5-forecasts" target="_blank" rel="noopener">النسخة العامة من Nixtla</a>. مستخدمة حسب شروط مسابقة Kaggle: بنعرض النتايج بس هنا، مش البيانات الخام. نفس طريقة التجربة 1. مش تابعين لوول مارت ولا معتمدين منها.',
  t558: '<strong>فين بتقصر.</strong> نتيجتين لسه تحت 80%: فئة الثبات (72.5% بالظبط، وعمرها ما بعدت أكتر من فئة واحدة)، وهل المنتج هيكبر ولا هيقل السنة الجاية (57.5%، قريب من رمي العملة، فالأداة بتعرضه كاتجاه السنة اللي فاتت مش كوعد). كل منتج شهر بشهر 80.3%، تقريبا زي متوسط تلات شهور (79.0%)، لأن المنتج الواحد بيتباع على دفعات. وعلى مستوى المحل كله شهر بشهر، تكرار السنة اللي فاتت طلع أحسن شوية هنا (93.4% قصاد 92.2%)؛ في ويسكونسن الأداة كانت أحسن (94.5% قصاد 93.8%)، وعلى الـ 20 سنة فرع كمان (92.8% قصاد 85.1%).',

  t504: '<b>Store: لما الكاش هو اللي بيحدد<em>Store</em></b><span>خطة الميزانية بتختار تشتري أنهي قطع لما الكاش يقل، وخطة الكاش بتوريك طلبات الـ 3 شهور الجاية هتتكلف كام. ومعاهم رسوم الطلب مع جدول مواعيد إعادة الطلب، والربح المعرض للخطر، وتقرير البضاعة الراكدة.</span>',
  t503: '<b>تقييم الموردين والتدفق النقدي<em>Pro, Store</em></b><span>بيقيّم التزام كل مورد، ويوريك مين الأرخص لكل منتج على مدار السنة، ويتوقع طلبياتك المخططة هتكلفك قد إيه وامتى.</span>',
  t502: '<b>لوحة متابعة في صفحة واحدة</b><span>الفلوس المجمدة في البضاعة، الربح الجاي، دوران المخزون، واللي محتاج تتصرف فيه النهارده.</span>',
  t501: '<b>فحص البيانات</b><span>بيمسك غلطات البيانات، زي سعر أقل من التكلفة أو مخزون بالسالب، قبل ما تعمل طلبية غلط.</span>',
  t500: '<b>البضاعة المطلوبة والطلبيات الجاية</b><span>اكتب اللي طلبته وشوف اللي جاي الأول؛ علّمه إنه وصل والمخزون بيتحدث لوحده ومدة توريد كل مورد الحقيقية بتتسجل.</span>',
  t499: '<b>خطة شراء لكل مورد</b><span>طلبية جاهزة لكل مورد، بالإجمالي ومراجعة الميزانية، وتتبعت على واتساب بضغطة.</span>',
  t498: '<b>مفيش طلب مرتين</b><span>كل قرار بيحسب البضاعة اللي في الطريق، فعمرك ما هتطلب حاجة لسه جاية.</span>',
  t497: '<b>أحسن كمية طلب</b><span>الكمية اللي بتخلي تكلفة الطلب والتخزين أقل حاجة، ومتقربة لأقل طلبية وللكرتونة عند المورد.</span>',
  t496: '<b>نقطة إعادة الطلب</b><span>مستوى المخزون اللي تطلب عنده بالظبط، علشان البضاعة الجديدة توصل قبل ما اللي عندك يخلص.</span>',
  t495: '<b>مخزون أمان للبيع وللموردين</b><span>احتياطي لكل منتج محسوب للأسابيع الزحمة وللموردين المتأخرين مع بعض.</span>',
  t494: '<b>بيمشي مع مبيعاتك الأخيرة</b><span>بيعتمد أكتر على آخر شهورك، فالتوقع بيلحق المنتج لما بيعه يسرع أو يهدى.</span>',
  t493: '<b>توقعات فاهمة الموسم</b><span>بيشيل الطلوع والنزول الموسمي العادي لكل منتج، وبعدين يتوقع التلات شهور الجاية والسنة كلها.</span>',
  t465: 'الدليل على بيانات حقيقية',
  t466: 'سنة 2015 لمحل حقيقي، متوقعة من 2013 و2014 بس',
  t467: 'خدنا مبيعات يومية حقيقية من فرع وول مارت في كاليفورنيا، من بيانات M5 المفتوحة: 40 منتج هوايات وأدوات منزلية، من 2013 لـ 2015. الأداة شافت 2013 و2014 بس، وبعدين خططت لـ 2015. ده اللي توقعته جنب اللي المحل باعه فعلا.',
  t468: 'الميزة',
  t469: 'الأداة توقعت',
  t470: 'اللي حصل فعلا',
  t471: 'قد إيه التوقع كان قريب (100% = مظبوط)',
  t472: '<strong>بصراحة:</strong> نتيجتين لسه تحت 80%: فئة الثبات (40.0% بالظبط، وعمرها ما بعدت أكتر من فئة واحدة)، وبيكبر ولا بيقل (55%). مبيعات الفرع ده نزلت 20.5% من 2013 لـ 2014، وبعدين زادت 5.2% في 2015. الأداة خططت على المستوى الأحدث والأقل، فتوقع السنة كلها طلع أقل من الحقيقي بـ 8%، بس 11 من 12 شهر فضلوا جوه المدى بتاعها، و99.8% من الطلب الحقيقي اتلبى من المخزون. الربح المعرض للخطر طلع صح بنسبة 87.7% هنا، و89.9% على الـ 20 سنة فرع كلها.',
  t473: 'الطريقة: نفس التجربة 1. الأداة خدت 2013 و2014 بس، وبعدين اتستخدمت أسبوع بأسبوع طول 2015، على 40 منتج هوايات وأدوات منزلية اتختاروا عشوائي (ببذرة ثابتة) من اللي اتباعوا كل شهر في 2013 و2014، وتلات موردين مفترضين (7 و14 و21 يوم، بتأخير عشوائي)، وتكلفة 55% من سعر البيع. متوسط 40 تجربة، وكل تجربة بتتقاس لوحدها. النتايج بالدولار الأمريكي.',

  t458: 'التكلفة الإجمالية لسنتين، بالجنيه. الأقل أحسن.',
  t459: 'كل معادلة اتراجعت مقابل حساب يدوي، عشرات الحالات الصعبة والبيانات الغلط اتختبرت، والأداة كلها اتشغلت من الأول للآخر باللغتين. ثلاث مشاكل حقيقية اتلاقت واتصلحت.',

  lg_privacy_eb: "قانوني",
  lg_privacy_h: "سياسة الخصوصية",
  lg_privacy_d: "آخر تحديث: 3 أكتوبر 2026.",
  lg_privacy_0: "مين إحنا",
  lg_privacy_1: "Etlob Sa7 (\"إحنا\") بتشغّل موقع etlobsa7.com وتطبيق Etlob Sa7. السياسة دي بتوضح البيانات الشخصية اللي بنجمعها، وليه، ومين بيساعدنا في معالجتها، وبنحتفظ بيها قد إيه، والاختيارات المتاحة ليك. بيانات النشاط موجودة في آخر الصفحة.",
  lg_privacy_2: "بنجمع إيه، وليه",
  lg_privacy_3: "بنجمع بس اللي الخدمة محتاجاه علشان تشتغل:",
  lg_privacy_4: "<li><strong>إيميلك</strong>: علشان نعمل حسابك، ونبعتلك رموز الدخول، ونبلغك بخصوص التجربة المجانية والمدفوعات (ومنها التذكير قبل أي خصم)، وكمان ملخص كل يوم أحد بأرقام محلك انت، إلا لو قفلته. تقدر تقفل الملخص من الإعدادات في التطبيق أو من اللينك اللي في كل رسالة.</li><li><strong>اختياراتك</strong>: اللغة اللي بتستخدم بيها التطبيق، علشان إيميلاتنا تبقى بنفس اللغة؛ وهل ملخص يوم الأحد شغال؛ ولو وقفت التجديد واخترت تقولنا السبب، السبب اللي اخترته وأي ملاحظة كتبتها.</li><li><strong>اسمك ورقم موبايلك</strong>: بتكتبهم لما تضيف كارت. شركة الدفع Paymob محتاجاهم علشان تنفذ الدفع بالكارت، وبنحتفظ بيهم علشان نملالك نموذج الدفع المرة الجاية.</li><li><strong>بيانات الباقة والدفع</strong>: باقتك، ومواعيد التجربة والاشتراك، وأرقام الطلب والعملية والاشتراك عند Paymob، والمبالغ، ونتيجة كل عملية دفع. محتاجينها علشان نديك الصلاحية ونحتفظ بسجلات دفع سليمة.</li><li><strong>بيانات نشاطك اللي بتكتبها في التطبيق</strong>: المنتجات، وتاريخ المبيعات، والموردين، والتكاليف، والأسعار، والطلبيات. البيانات دي بتاعتك، وبنستخدمها بس علشان التطبيق يشتغل ليك.</li><li><strong>سجلات الأمان</strong>: إمتى اتبعت رمز دخول، وإمتى دخلت وكام مرة، وأحداث الدفع، مربوطة بإيميلك. رموز الدخول ومفاتيح الجلسة بتتخزن بس بشكل مشفر باتجاه واحد (hash)، عمرها ما بتتخزن بشكل مقروء. بنستخدم السجلات دي علشان نحمي الحسابات ونمنع إساءة الاستخدام ونصلح المشاكل.</li><li><strong>سجلات الخوادم المعتادة</strong>: زي أغلب المواقع، مقدمي الاستضافة بيسجلوا تفاصيل تقنية عن كل طلب، زي عنوان IP والوقت ونوع المتصفح، للأمان ولاستمرار الخدمة.</li>",
  lg_privacy_5: "إحنا مش بنجمع رقم كارتك (بتكتبه في صفحة Paymob مش صفحتنا)، ولا موقعك، ولا جهات اتصالك. مش بنستخدم أدوات تحليل أو إعلانات أو تتبع، ومش بنبيع أو بنأجر أي بيانات شخصية.",
  lg_privacy_6: "أساس استخدامنا للبيانات",
  lg_privacy_7: "بنستخدم بياناتك علشان نقدم الخدمة اللي اشتركت فيها، وبالموافقة اللي بتديها لما تبدأ تجربة أو باقة، وعلشان نحافظ على أمان الخدمة، ونلتزم بالواجبات القانونية والمحاسبية. بنحرص إننا نتعامل مع البيانات الشخصية بما يتفق مع قانون حماية البيانات الشخصية المصري (القانون رقم 151 لسنة 2020).",
  lg_privacy_8: "مين بيعالج البيانات معانا",
  lg_privacy_9: "<li><strong>Supabase</strong>: قاعدة البيانات وخادم التطبيق، في مركز بياناتها في فرانكفورت بألمانيا (Amazon Web Services، eu-central-1). بيانات نشاطك وحسابك وسجلات الدفع متخزنة هنا.</li><li><strong>Paymob</strong>: شركة الدفع بالكارت في مصر. بتستلم اسمك وإيميلك وموبايلك مع كل عملية دفع، وبتحتفظ بالكارت للتجديدات حسب سياسة الخصوصية بتاعتها.</li><li><strong>Resend</strong>: بتبعت إيميلات الدخول والحساب. بتستلم إيميلك ونص الرسالة، وممكن تعالجهم في الولايات المتحدة.</li><li><strong>GitHub Pages</strong>: بتستضيف الموقع ده وملفات صفحات التطبيق، وبتحتفظ بسجلات الخوادم المعتادة. GitHub مقرها في الولايات المتحدة.</li><li><strong>واتساب</strong> (Meta): بس لو اخترت تكلمنا عليه.</li>",
  lg_privacy_10: "ده معناه إن بياناتك بتتخزن وبتتعالج برا مصر، في ألمانيا والولايات المتحدة. بنستخدم مقدمي خدمة معروفين بيحموا البيانات بالتشفير وضوابط الوصول، وبنشارك مع كل واحد بس اللي محتاجه.",
  lg_privacy_11: "مين يقدر يشوف بيانات نشاطك",
  lg_privacy_12: "إنت بس، لما تدخل برمز بيتبعت لإيميلك. قاعدة البيانات بترفض أي وصول مباشر: خادم التطبيق بس هو اللي يقدر يقراها، ومش بيرجّع مساحة العمل غير لصاحبها اللي داخل بحسابه. إحنا مش بنبص على بيانات نشاطك، إلا لو طلبت مساعدتنا وكان ده الطريق الوحيد إننا نساعدك.",
  lg_privacy_13: "بنحتفظ بالبيانات قد إيه",
  lg_privacy_14: "<li>حسابك وبيانات نشاطك: طول ما حسابك موجود، حتى بعد ما توقف التجديد، علشان مساحة عملك تفضل مستنياك لو رجعت. اطلب مننا وإحنا نمسحها.</li><li>لو فتحت صفحة الكارت ومضفتش كارت ومدخلتش خالص، بنمسح الحساب ده وبياناته بعد 30 يوم.</li><li>سجلات الأمان: لحد 12 شهر.</li><li>سجلات الدفع: المدة اللي قانون الضرايب والمحاسبة المصري بيطلبها، حتى بعد ما باقي الحساب يتمسح.</li>",
  lg_privacy_15: "الكوكيز وتخزين المتصفح",
  lg_privacy_16: "إحنا مش بنستخدم كوكيز. الموقع والتطبيق بيحفظوا حاجات صغيرة في تخزين المتصفح علشان يشتغلوا، زي اللغة وتسجيل دخولك. التفاصيل في <a href=\"#cookies\" data-go=\"cookies\">سياسة الكوكيز والتخزين</a>.",
  lg_privacy_17: "حقوقك",
  lg_privacy_18: "تقدر تطلب مننا:",
  lg_privacy_19: "<li>نعرفك إيه البيانات الشخصية اللي عندنا عنك ونديك نسخة منها؛</li><li>نصحح أي حاجة غلط؛</li><li>نمسح حسابك وبياناتك (ما عدا سجلات الدفع اللي القانون بيلزمنا نحتفظ بيها)؛</li><li>نوقف استخدام بياناتك في غرض إنت معترض عليه، أو تسحب موافقة اديتها.</li>",
  lg_privacy_20: "ابعتلنا على واتساب <bdi>+20 109 009 9849</bdi>. ممكن نطلب منك تأكد الطلب من إيميل حسابك، علشان محدش غيرك يطلب بياناتك. بنرد في أسرع وقت، وفي حدود المدة اللي القانون بيحددها. ولو مش راضي، تقدر تشتكي لمركز حماية البيانات الشخصية في مصر.",
  lg_privacy_21: "الأمان",
  lg_privacy_22: "الاتصال بالموقع والتطبيق مشفر (HTTPS). رموز الدخول بتنتهي بعد 10 دقايق وبتشتغل مرة واحدة. قاعدة البيانات مقفولة بحيث خادم التطبيق بس هو اللي يوصلها. مفيش طريقة آمنة 100%، لكن لو حصل اختراق أثر على بياناتك هنبلغك ونبلغ الجهات المختصة زي ما القانون بيطلب.",
  lg_privacy_23: "الأطفال",

  lg_privacy_25: "تغييرات السياسة",
  lg_privacy_26: "لو غيرنا السياسة دي بشكل مهم، هننشر النسخة الجديدة هنا بتاريخ جديد، ونبلغ المشتركين بالإيميل قبل ما التغيير يطبق عليهم.",
  lg_privacy_27: "بيانات النشاط",
  lg_privacy_28: "<li><strong>الاسم التجاري:</strong> Etlob Sa7 (اطلب صح)</li><li><strong>نشاطنا:</strong> اشتراك شهري أو سنوي في تطبيق أونلاين لتخطيط الطلب والمشتريات، للأنشطة التجارية</li><li><strong>المقر:</strong> القاهرة، مصر</li><li><strong>التواصل:</strong> واتساب <bdi>+20 109 009 9849</bdi></li><li><strong>الموقع:</strong> etlobsa7.com</li>",
  lg_terms_eb: "قانوني",
  lg_terms_h: "الشروط والأحكام",
  lg_terms_d: "آخر تحديث: 3 أكتوبر 2026.",
  lg_terms_0: "الشروط دي اتفاق بينك وبين Etlob Sa7 على استخدام الموقع والتطبيق. لما تبدأ تجربة أو تدفع باقة أو تستخدم التطبيق، بتكون موافق عليها، ومعاها <a href=\"#privacy\" data-go=\"privacy\">سياسة الخصوصية</a> و<a href=\"#refunds\" data-go=\"refunds\">سياسة الاسترداد والإلغاء</a>.",
  lg_terms_1: "التطبيق ده إيه",
  lg_terms_2: "Etlob Sa7 تطبيق باشتراك بيحول تاريخ مبيعاتك لتوقعات طلب ونقط إعادة طلب وكميات شراء. هو أداة بتساعدك تاخد القرار. مش بيطلب نيابة عنك، ومش بيضمن أي بيع أو ربح أو توريد من مورد، ومش بيحل محل تقديرك. القرار النهائي في كل طلبية ليك.",
  lg_terms_3: "مين يقدر يستخدمه",
  lg_terms_4: "لازم يكون سنك 21 سنة على الأقل (سن الأهلية الكاملة في مصر) أو تكون قادر قانونا تتعاقد، ولازم تستخدم التطبيق لنشاط تجاري حقيقي أو مخطط له، مش لاستخدام شخصي أو منزلي.",
  lg_terms_5: "حسابك",
  lg_terms_6: "بتدخل برمز لمرة واحدة بيتبعت على إيميلك، فحافظ على أمان إيميلك. كل حساب لنشاط مشترك واحد، وبيشتغل على جهازين بالكتير في نفس الوقت. إنت مسؤول عن اللي بيحصل في حسابك وعن صحة البيانات اللي بتدخلها.",
  lg_terms_7: "التجربة المجانية والدفع والتجديد التلقائي",
  lg_terms_8: "<li>كل باقة بتبدأ بتجربة مجانية: 14 يوم على الأساسية وPro، و5 أيام على Store. كل حساب له تجربة مجانية واحدة.</li><li>علشان تبدأ التجربة بتضيف كارت في صفحة Paymob الآمنة. بيتخصم مرة واحدة 1 جنيه في نفس اليوم للتأكد إن الكارت شغال.</li><li>بتختار تدفع شهري أو سنوي. شهر الدفع 30 يوم، وسنة الدفع 360 يوم (12 شهر دفع). الباقة السنوية سعرها زي 10 شهور من السعر الشهري.</li><li>لو موقفتش التجديد قبل ما التجربة تخلص، الكارت بيتخصم منه سعر الباقة والمدة اللي اخترتها تلقائيا لما التجربة تخلص، وبعدها في أول كل شهر أو سنة جديدة، لحد ما توقف التجديد.</li><li>التذكير: في تجربة الـ 14 يوم بنبعتلك إيميل قبل أول دفعة بـ 7 أيام؛ وفي تجربة Store اللي 5 أيام بنبعتلك تاني يوم من بدايتها. وفي الباقة السنوية بنبعتلك قبل كل تجديد بـ 7 أيام. وكل تذكير فيه لينك توقف بيه التجديد أونلاين.</li><li>الأسعار معروضة بالجنيه المصري في صفحة الأسعار وفي التطبيق قبل ما تدفع، وهي المبلغ اللي بيتخصم.</li><li>لو الدفع فشل، Paymob بتحاول تاني والتطبيق بيفضل شغال 3 أيام. لو فضل فاشل، الصلاحية بتتوقف لحد ما تدفع. وبياناتك بتفضل محفوظة.</li><li>لو غيرت الباقة أو المدة بعد التجربة، بتدفع السعر الجديد، والمدة المدفوعة في الباقة القديمة بتتنقل للجديدة بسعر اليوم فيها. ولو المدة دي قيمتها أكتر من سنة في الباقة الجديدة، غيرها لما مدتك الحالية تخلص.</li><li>عرض المؤسسين: أول 30 محل أول دفعة كاملة ليهم تتم بيبقوا أعضاء مؤسسين. العضو المؤسس بيحتفظ بالأسعار اللي كانت سارية يوم ما بقى عضو، لأي باقة ومدة، طول ما اشتراكه مستمر من غير ما يخلص. لو خلص (وقف التجديد والمدة المدفوعة انتهت، أو دفعة فشلت ومااتصلحتش خلال 3 أيام)، السعر المؤسس بينتهي والأسعار الحالية بتطبق. صفحة الأسعار بتوضح فاضل كام مكان.</li><li>ممكن نغير الأسعار للمستقبل. هنبلغك بالإيميل قبلها بـ 14 يوم على الأقل قبل ما السعر الجديد يطبق عليك، وتقدر توقف التجديد قبلها. وسعر العضو المؤسس مش بيزيد طول ما هو ساري.</li>",
  lg_terms_9: "الإلغاء والاسترداد",
  lg_terms_10: "تقدر توقف التجديد في أي وقت من التطبيق (الإعدادات، وبعدين الباقة والدفع) أو بإنك تبعتلنا على واتساب. مش هيتخصم حاجة تاني، وبتفضل الصلاحية لحد آخر التجربة أو الشهر أو السنة اللي دفعتها. بعدها التطبيق بيقف مؤقتا وبياناتك بتفضل محفوظة. الاسترداد موضح في <a href=\"#refunds\" data-go=\"refunds\">سياسة الاسترداد والإلغاء</a>.",
  lg_terms_11: "الاستخدام السليم",
  lg_terms_12: "إنت موافق إنك متشاركش أو تبيعش الدخول للتطبيق، ومتحاولش تخترقه أو تضغط عليه أو تسحب بياناته أو تفكك كوده، ومتستخدموش في أي حاجة مخالفة للقانون. ومن حقنا نوقف أي حساب بيعمل كده.",
  lg_terms_13: "بياناتك",
  lg_terms_14: "بيانات المبيعات والموردين والمنتجات اللي بتدخلها بتاعتك. إنت بتدينا إذن نخزنها ونعالجها بس علشان نشغل التطبيق ليك. تقدر تطلب نسخة منها أو تطلب مسحها في أي وقت. شوف <a href=\"#privacy\" data-go=\"privacy\">سياسة الخصوصية</a>.",
  lg_terms_15: "التطبيق والمحتوى بتوعنا",
  lg_terms_16: "التطبيق وتصميمه ونصوصه وحساباته واسم وشعار Etlob Sa7 ملكنا. اشتراكك بيديك حق شخصي غير قابل للتحويل إنك تستخدم التطبيق لنشاطك طول ما باقتك أو تجربتك شغالة.",
  lg_terms_17: "النتائج مش مضمونة",
  lg_terms_18: "التوقعات ونقط إعادة الطلب وكميات الطلب حسابات مبنية على البيانات اللي بتدخلها. هي مش نصيحة مالية أو محاسبية أو قانونية، وممكن تطلع غلط، خصوصا لو البيانات ناقصة أو غلط أو قصيرة، أو الطلب اتغير فجأة، أو مورد اتأخر. راجع أي رقم غريب قبل ما تتصرف. نتايج الاختبارات على موقعنا من بيانات مبيعات عامة بالافتراضات المكتوبة جنبها، ومش وعد بنتايج لنشاطك.",
  lg_terms_19: "إتاحة الخدمة",
  lg_terms_20: "بنشتغل علشان التطبيق يفضل متاح، لكن ممكن يقف أحيانا للصيانة أو بسبب مشاكل في الإنترنت أو عند مقدمي الخدمة. مش بنوعد بخدمة من غير أي انقطاع.",
  lg_terms_21: "حدود المسؤولية",
  lg_terms_22: "في حدود ما يسمح بيه القانون، إحنا مش مسؤولين عن أرباح أو مبيعات ضايعة، أو بضاعة اتشرت أو متشرتش بسبب نتايج التطبيق، أو أي خسارة غير مباشرة، وأقصى مسؤوليتنا عن أي مطالبة هي المبلغ اللي دفعته لنا في التلات شهور اللي قبل المطالبة. ولا حاجة في الشروط دي بتحد من مسؤولية القانون مش بيسمح بالحد منها، زي المسؤولية عن الغش.",
  lg_terms_23: "إنهاء الحساب",
  lg_terms_24: "تقدر توقف التجديد أو تطلب مسح حسابك في أي وقت. ومن حقنا نوقف أو نقفل حساب بسبب عدم الدفع، أو سوء الاستخدام، أو مخالفة جسيمة للشروط دي، وهنبلغك بالسبب الأول لما يكون ده ممكن.",
  lg_terms_25: "تغيير الشروط",
  lg_terms_26: "لو غيرنا الشروط دي بشكل مهم، هننشر النسخة الجديدة هنا بتاريخ جديد ونبلغ المشتركين بالإيميل قبلها بـ 14 يوم على الأقل قبل ما تطبق عليهم. ولو مش موافق، تقدر توقف التجديد قبلها.",
  lg_terms_27: "القانون والنزاعات",
  lg_terms_28: "الشروط دي خاضعة لقوانين جمهورية مصر العربية. من فضلك كلمنا الأول علشان نحاول نحل أي مشكلة مباشرة. وأي نزاع ميتحلش بالطريقة دي بيروح للمحاكم المختصة في القاهرة.",
  lg_terms_29: "بيانات النشاط",
  lg_terms_30: "<li><strong>الاسم التجاري:</strong> Etlob Sa7 (اطلب صح)</li><li><strong>نشاطنا:</strong> اشتراك شهري أو سنوي في تطبيق أونلاين لتخطيط الطلب والمشتريات، للأنشطة التجارية</li><li><strong>المقر:</strong> القاهرة، مصر</li><li><strong>التواصل:</strong> واتساب <bdi>+20 109 009 9849</bdi></li><li><strong>الموقع:</strong> etlobsa7.com</li>",
  lg_cookies_eb: "قانوني",
  lg_cookies_h: "سياسة الكوكيز والتخزين",
  lg_cookies_d: "آخر تحديث: 3 أكتوبر 2026.",
  lg_cookies_0: "باختصار",
  lg_cookies_1: "موقع etlobsa7.com والتطبيق والعرض التجريبي مش بيحطوا أي كوكيز. ومش بنستخدم أدوات تحليل أو إعلانات أو تتبع، وكل الخطوط والأكواد بتتحمل من موقعنا، فلما تفتح صفحة مش بيحصل اتصال بجوجل أو فيسبوك أو أي أداة تتبع.",
  lg_cookies_2: "بنحفظ إيه في متصفحك",
  lg_cookies_3: "علشان يشتغلوا، الموقع والتطبيق بيحفظوا كام حاجة في تخزين المتصفح نفسه (local storage وsession storage). الحاجات دي بتفضل على جهازك ومش بتتبعت لخادمنا غير لما يكون ده لازم علشان تدخل أو نتأكد من عملية دفع:",
  lg_cookies_4: "<div class=\"legal-tbl\"><table><thead><tr><th>الاسم</th><th>بيتستخدم في</th><th>الغرض</th><th>المدة</th></tr></thead><tbody><tr><td><code>etlob-site-lang</code></td><td>الموقع</td><td>بيفتكر اللغة اللي اخترتها للموقع.</td><td>لحد ما تمسحه</td></tr><tr><td><code>es7.lang, es7.theme, es7.tab</code></td><td>التطبيق والعرض التجريبي</td><td>بيفتكروا لغتك، والوضع الفاتح أو الغامق، وآخر صفحة كانت مفتوحة.</td><td>لحد ما تمسحهم</td></tr><tr><td><code>es7.sid</code></td><td>التطبيق</td><td>بيخليك داخل بحسابك. فيه مفتاح دخول عشوائي، والخادم بيخزن منه نسخة مشفرة (hash) بس.</td><td>لحد ما تخرج؛ والمفتاح بيبطل بعد 14 يوم من غير استخدام</td></tr><tr><td><code>es7.pending</code></td><td>الموقع والتطبيق</td><td>رقم مرجعي لعملية دفع لسه بادئها، علشان نأكدها لما Paymob ترجعك.</td><td>بيتمسح لما تدخل؛ وبيتجاهل بعد يومين</td></tr><tr><td><code>es7.ckForm (session storage)</code></td><td>الموقع والتطبيق</td><td>الباقة ومدة الدفع والإيميل والاسم والموبايل اللي كتبتهم في نموذج الكارت، علشان متكتبهمش تاني لو الكارت اترفض.</td><td>بيتمسح لما تقفل التاب</td></tr><tr><td><code>es7.chkHide</code></td><td>التطبيق</td><td>بيفتكر إنك خبيت قايمة البداية.</td><td>لحد ما تمسحه</td></tr><tr><td><code>es7.signinEmail</code></td><td>الموقع والتطبيق</td><td>بينقل الإيميل اللي كتبته في الموقع لصفحة الدخول.</td><td>بيتمسح أول ما يتقري</td></tr></tbody></table></div>",
  lg_cookies_5: "محتاجين موافقتك؟",
  lg_cookies_6: "كل الحاجات دي ضرورية للميزات اللي بتطلبها (الدخول، والدفع، وتذكر اللغة)، علشان كده مش بنعرض شريط موافقة على الكوكيز. ولو ضفنا في يوم أدوات تحليل أو إعلانات، هنطلب موافقتك الأول ونحدث الصفحة دي.",
  lg_cookies_7: "مواقع تانية",
  lg_cookies_8: "لما تروح صفحة Paymob علشان تدفع، Paymob ممكن تحط كوكيز خاصة بيها لازمة لتنفيذ الدفع، حسب سياستها. ولينكات واتساب مش بتفتح واتساب غير لما تدوس عليها.",
  lg_cookies_9: "إزاي تمسحها",
  lg_cookies_10: "تقدر تمسح الحاجات دي في أي وقت من إعدادات المتصفح (امسح بيانات موقع etlobsa7.com). بعدها هتحتاج تدخل تاني وتختار لغتك تاني.",
  lg_cookies_11: "بيانات النشاط",
  lg_cookies_12: "<li><strong>الاسم التجاري:</strong> Etlob Sa7 (اطلب صح)</li><li><strong>نشاطنا:</strong> اشتراك شهري أو سنوي في تطبيق أونلاين لتخطيط الطلب والمشتريات، للأنشطة التجارية</li><li><strong>المقر:</strong> القاهرة، مصر</li><li><strong>التواصل:</strong> واتساب <bdi>+20 109 009 9849</bdi></li><li><strong>الموقع:</strong> etlobsa7.com</li>",
  lg_refunds_eb: "قانوني",

  lg_refunds_d: "آخر تحديث: 3 أكتوبر 2026.",
  lg_refunds_0: "التجربة المجانية",
  lg_refunds_1: "كل باقة بتبدأ مجانا: 14 يوم على الأساسية وPro، و5 أيام على Store. لما تضيف كارتك، بيتخصم مرة واحدة 1 جنيه للتأكد إن الكارت شغال، والمبلغ ده مش بيترد. لو وقفت التجديد قبل ما التجربة تخلص، سعر الباقة مش هيتخصم أبدا.",
  lg_refunds_2: "إزاي تلغي",
  lg_refunds_3: "تقدر توقف التجديد في أي وقت من التطبيق: الإعدادات، وبعدين الباقة والدفع، وبعدين إيقاف التجديد. أو ابعتلنا على واتساب <bdi>+20 109 009 9849</bdi> وإحنا نعملها ليك. من غير أي نماذج أو مكالمات. مش هيتخصم حاجة تاني، وبتفضل الصلاحية لحد آخر التجربة أو الشهر اللي دفعته.",
  lg_refunds_4: "الاسترداد",
  lg_refunds_5: "علشان كل باقة بتبدأ بتجربة مجانية، وبنفكرك قبل أول دفعة وقبل كل تجديد سنوي، الدفعات مش بترجع بعد ما تتخصم، ومنها الدفعات السنوية، حتى لو جزء من شهر أو سنة أو وقت ماستخدمتهوش. ده مش بيأثر على أي حق في الاسترداد بيديهولك القانون. وإحنا بنرجّع المبلغ كامل دايما في الحالات دي:",
  lg_refunds_6: "<li>لو المبلغ اتخصم مرتين عن نفس الفترة؛</li><li>لو اتخصم مبلغ بعد ما وقفت التجديد في ميعاده؛</li><li>لو اتخصم مبلغ غلط (بنرجّع الفرق).</li>",
  lg_refunds_7: "إزاي تطلب استرداد",
  lg_refunds_8: "ابعتلنا على واتساب <bdi>+20 109 009 9849</bdi> بإيميل حسابك وتاريخ الخصم. بنرد خلال 3 أيام عمل. المبالغ اللي بتترد بترجع على نفس الكارت اللي دفعت بيه عن طريق Paymob، والمدة اللي بتاخدها لحد ما تظهر في كشف حسابك بتعتمد على البنك بتاعك.",
  lg_refunds_9: "تغيير الباقة",

var LANG = (function () {
  try {

    if (saved === 'en' || saved === 'ar') return saved;
  } catch (e) {}
  return (navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
})();

function applyLang() {
  var dict = LANG === 'ar' ? SITE_AR : SITE_EN;
  document.querySelectorAll('[data-t]').forEach(function (el) {
    var k = el.getAttribute('data-t');
    if (dict[k] != null) el.textContent = dict[k];
  });
  document.querySelectorAll('[data-t-html]').forEach(function (el) {
    var k = el.getAttribute('data-t-html');
    if (dict[k] != null) el.innerHTML = dict[k];
  });
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('.langbtn').forEach(function (b) {
    b.textContent = LANG === 'ar' ? 'English' : 'العربية';
  });
  try { localStorage.setItem('etlob-site-lang', LANG); } catch (e) {}
  if (window.ckRender) window.ckRender();
}

function toggleLang() {
  LANG = LANG === 'ar' ? 'en' : 'ar';

}

  function go(name, push){
    var sec = inHome[name], page = sec ? "home" : (pages.indexOf(name) === -1 ? "home" : name);
    pages.forEach(function(p){ var el = document.getElementById("p-"+p); if(el) el.classList.toggle("on", p === page); });

    var em = st.email.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) { setMsg(esc(tx('BAD_EMAIL'))); document.getElementById('ck-email').focus(); return; }
    if (!/\p{L}.*\p{L}/u.test(st.name)) { setMsg(esc(tx('BAD_NAME'))); document.getElementById('ck-name').focus(); return; }
    if (!st.agree) { setMsg(esc(tx('NEED_CONSENT'))); document.getElementById('ck-agree').focus(); return; }
    if (st.phone.replace(/[\u0660-\u0669]/g, function (d) { return String(d.charCodeAt(0) - 0x0660); }).replace(/[\u06F0-\u06F9]/g, function (d) { return String(d.charCodeAt(0) - 0x06F0); }).replace(/\D/g, '').length < 8) { setMsg(esc(tx('BAD_PHONE'))); document.getElementById('ck-phone').focus(); return; }
    save(); st.busy = true; st.msg = ''; render();
    post('startTrial', [{ plan: st.plan, interval: st.int, email: em, name: st.name, phone: st.phone, agree: true, termsVersion: TERMS_VERSION }, L()]).then(function (r) {
      if (r && r.ok && r.url && r.ref) {
        try { localStorage.setItem('es7.pending', JSON.stringify({ ref: r.ref, email: em.toLowerCase(), plan: st.plan, at: Date.now() })); } catch (x) {}
        location.href = r.url; return;
      }
      st.busy = false;
      var err = (r && r.error) || 'SERVER';
      if (err === 'HAS_ACCOUNT') { setMsg(esc(tx('HAS_ACCOUNT')) + '<a href="' + APP + '" id="ck-has">' + esc(tx('HAS_ACCOUNT2')) + '</a>', 'info'); return; }
      if (err === 'BILLING_OFF') { st.info = Object.assign({}, st.info || {}, { ready: false }); render(); return; }
      setMsg(esc(TX[L()][err] ? tx(err) : tx('SERVER')));
    });
  });
})();
</script>

<script>
/* Pricing: monthly or yearly prices, which plan fits a product count, and founding places left (from the server). */
(function () {
  var D = function () { return (typeof LANG !== 'undefined' && LANG === 'ar') ? SITE_AR : SITE_EN; };
  window.ES7_INT = 'month';
  function setInt(v) {
    window.ES7_INT = v === 'year' ? 'year' : 'month';
    document.querySelectorAll('.pint button').forEach(function (b) { b.setAttribute('aria-checked', b.getAttribute('data-int') === window.ES7_INT ? 'true' : 'false'); });
    document.querySelectorAll('.price[data-m]').forEach(function (p) {
      var k = p.getAttribute(window.ES7_INT === 'year' ? 'data-y' : 'data-m');
      p.setAttribute('data-t-html', k); p.innerHTML = D()[k];
      var q = p.nextElementSibling; if (q && q.classList.contains('peq')) q.hidden = window.ES7_INT !== 'year';
    });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.pint button'); if (b) setInt(b.getAttribute('data-int'));
  });
  document.addEventListener('keydown', function (e) {
    var b = e.target.closest && e.target.closest('.pint button');
    if (!b || ['ArrowLeft', 'ArrowRight'].indexOf(e.key) < 0) return;
    e.preventDefault(); setInt(window.ES7_INT === 'year' ? 'month' : 'year');
    var on = document.querySelector('.pint button[aria-checked="true"]'); if (on) on.focus();
  });
  var LIM = [['basic', 15, 't668'], ['pro', 50, 't669'], ['store', 200, 't670']];
  function finder() {
    var inp = document.getElementById('pfind-n'), out = document.getElementById('pfind-out'); if (!inp || !out) return;
    var n = Math.floor(Number(inp.value)), fit = null;
    document.querySelectorAll('.tier').forEach(function (t) { t.classList.remove('fit'); });
    if (!(n > 0)) { out.setAttribute('data-t', 't667'); out.textContent = D().t667; return; }
    for (var i = 0; i < LIM.length; i++) if (n <= LIM[i][1]) { fit = LIM[i]; break; }
    var key = fit ? fit[2] : 't671';
    out.setAttribute('data-t', key); out.textContent = D()[key];
    if (fit) { var a = document.querySelector('.tier [data-plan-tier="' + fit[0] + '"]'); if (a) a.closest('.tier').classList.add('fit'); }
  }
  document.addEventListener('input', function (e) { if (e.target.id === 'pfind-n') finder(); });
  function founding() {
    var el = document.getElementById('founding'), r = window.ES7_INFO; if (!el) return;
    if (!r || !r.ok || !(r.foundingLeft > 0)) { el.hidden = true; return; }
    el.textContent = D().t672.split('{n}').join(String(r.foundingLeft)); el.hidden = false;
  }
  function wa() { var a = document.getElementById('waFoot'); if (a) a.href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(D().t684); }
  var base = window.applyLang;
  window.applyLang = applyLang = function () { base(); setInt(window.ES7_INT); founding(); finder(); wa(); };
  document.addEventListener('DOMContentLoaded', function () {
    setInt('month'); wa();
    setTimeout(function () {
      fetch('https://wqbcxyswrqxvqrehelnw.supabase.co/functions/v1/app', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn: 'trialInfo', args: [] }) })
        .then(function (r) { return r.json(); }).then(function (r) { window.ES7_INFO = r; founding(); }).catch(function () {});
    }, 800);
  });
})();
</script>
