<style>
:root{
  --navy:#0E2743;--navy-2:#17375D;--navy-3:#1E4778;
  --ink:#0F1822;--body:#3A4959;--muted:#6C7C90;--faint:#95A3B4;
  --line:#E0E6ED;--line-2:#EDF1F6;
  --bg:#FFFFFF;--bg-2:#F7F9FC;--bg-3:#EDF2F8;--card:#FFFFFF;
  --accent:#1A6DD4;--accent-2:#0F5BB8;--accent-ink:#FFFFFF;--gold:#B0801F;
  --ok:#17784A;--ok-bg:#E7F5EC;--warn:#8E6100;--warn-bg:#FCF3E1;--bad:#A82219;--bad-bg:#FCEBE9;
  --shadow-s:0 1px 2px rgba(14,39,67,.05),0 2px 8px rgba(14,39,67,.05);
  --shadow:0 2px 4px rgba(14,39,67,.05),0 12px 32px rgba(14,39,67,.08);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Public Sans","IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mx:1140px;--r:12px;
}
html[lang="ar"]{--serif:"IBM Plex Sans Arabic","Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#081726;--navy-2:#0D2440;--navy-3:#133155;
  --ink:#ECF2F9;--body:#B4C3D4;--muted:#8697AC;--faint:#6E7F95;
  --line:#1F3148;--line-2:#182639;
  --bg:#080E18;--bg-2:#0D1624;--bg-3:#111E31;--card:#0D1624;
  --accent:#5DA2F2;--accent-2:#79B4F7;--accent-ink:#04101E;--gold:#D6A644;
  --ok:#63D394;--ok-bg:#0F2A1C;--warn:#DDB254;--warn-bg:#2A2110;--bad:#F08A80;--bad-bg:#2B1512;
  --shadow-s:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 2px 4px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --navy:#081726;--navy-2:#0D2440;--navy-3:#133155;
  --ink:#ECF2F9;--body:#B4C3D4;--muted:#8697AC;--faint:#6E7F95;
  --line:#1F3148;--line-2:#182639;
  --bg:#080E18;--bg-2:#0D1624;--bg-3:#111E31;--card:#0D1624;
  --accent:#5DA2F2;--accent-2:#79B4F7;--accent-ink:#04101E;--gold:#D6A644;
  --ok:#63D394;--ok-bg:#0F2A1C;--warn:#DDB254;--warn-bg:#2A2110;--bad:#F08A80;--bad-bg:#2B1512;
  --shadow-s:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 2px 4px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--sans);font-size:16.5px;
  line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--serif);color:var(--ink);line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2.1rem,5.4vw,3.6rem);font-weight:700;letter-spacing:-.025em}
h2{font-size:clamp(1.65rem,3.6vw,2.5rem);font-weight:600;letter-spacing:-.015em}
h3{font-size:1.25rem;font-weight:600}
h4{font-size:1.02rem;font-weight:600;font-family:var(--sans)}
p{margin:0 0 1.05em}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
strong{color:var(--ink);font-weight:600}
.wrap{max-width:var(--mx);margin:0 auto;padding:0 24px}
.narrow{max-width:800px;margin:0 auto}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold);margin:0 0 14px}
.lede{font-size:clamp(1.02rem,1.8vw,1.18rem);color:var(--body)}

/* ---------- NAV ---------- */
.nav{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{max-width:var(--mx);margin:0 auto;padding:12px 24px;display:flex;align-items:center;
  justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0}
.brand svg{flex:0 0 32px}
.brand b{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:1.02rem;
  line-height:1.15;letter-spacing:-.01em}
.brand span{display:block;font-family:var(--sans);font-size:.66rem;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.tabs{display:flex;gap:4px;align-items:center}
.tab{background:none;border:none;font-family:var(--sans);font-size:.92rem;font-weight:500;
  color:var(--body);padding:8px 13px;border-radius:7px;cursor:pointer;transition:.15s;
  white-space:nowrap}
.tab:hover{background:var(--bg-3);color:var(--ink)}
.tab.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);
  font-weight:600}
@media(max-width:1000px){.tabs{display:none}}
.menubtn{display:none;background:none;border:1px solid var(--line);border-radius:7px;
  padding:8px 11px;cursor:pointer;color:var(--ink)}
@media(max-width:1000px){.menubtn{display:block}}
.drawer{display:none;border-top:1px solid var(--line);background:var(--bg);padding:8px 24px 16px}
.drawer.open{display:block}
.drawer .tab{display:block;width:100%;text-align:left;padding:11px 12px;font-size:1rem}

/* ---------- BUTTONS ---------- */
.btn{display:inline-block;padding:13px 26px;border-radius:9px;font-weight:600;font-size:.95rem;
  text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:.16s;
  font-family:var(--sans);text-align:center}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:9px 17px;font-size:.88rem;border-radius:8px}
.btn-lg{padding:16px 34px;font-size:1.02rem}
.onnavy .btn-ghost{color:#fff;border-color:rgba(255,255,255,.34)}
.onnavy .btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.1);color:#fff}

/* ---------- PAGES ---------- */
.page{display:none;animation:fade .34s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
section{padding:78px 0}
section.tight{padding:56px 0}
.alt{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.head{max-width:66ch;margin:0 0 48px}
.head.mid{margin:0 auto 48px;text-align:center}

/* ---------- HERO ---------- */
.hero{background:linear-gradient(168deg,var(--navy) 0%,var(--navy-2) 58%,var(--navy-3) 100%);
  color:#fff;padding:92px 0 100px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-30%;right:-15%;width:70%;height:130%;
  background:radial-gradient(ellipse at center,rgba(93,162,242,.2),transparent 62%)}
.hero::after{content:"";position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:46px 46px;
  mask-image:radial-gradient(ellipse at 20% 0%,#000,transparent 72%)}
.hero .wrap{position:relative;z-index:2}
.hero h1{color:#fff;max-width:16ch;margin-bottom:.4em}
.hero .eyebrow{color:#9CC4EE}
.hero .lede{color:#C3D6EA;max-width:54ch;margin-bottom:32px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-note{margin-top:22px;font-size:.88rem;color:#8FA9C6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:56px;padding-top:30px;
  border-top:1px solid rgba(255,255,255,.15)}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr);gap:20px}}
.stats b{display:block;font-family:var(--serif);font-size:1.8rem;color:#fff;line-height:1.05;
  margin-bottom:2px}
.stats small{color:#8FA9C6;font-size:.81rem;line-height:1.45;display:block}

/* ---------- GRIDS / CARDS ---------- */
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:940px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:660px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;
  box-shadow:var(--shadow-s);transition:.18s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card h3{margin-bottom:8px}
.card p{margin:0;font-size:.95rem}
.kicker{display:inline-block;font-family:var(--serif);font-size:.82rem;font-weight:700;
  color:var(--gold);letter-spacing:.1em;margin-bottom:14px}
.ico{width:42px;height:42px;border-radius:10px;background:color-mix(in srgb,var(--accent) 11%,transparent);
  display:grid;place-items:center;margin-bottom:16px;color:var(--accent)}

/* ---------- PAIN ---------- */
.pains{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.pains{grid-template-columns:1fr}}
.pain{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:0 var(--r) var(--r) 0;padding:26px 28px}
.pain b{display:block;color:var(--ink);font-size:1.06rem;margin-bottom:7px;font-family:var(--serif)}
.pain p{margin:0;font-size:.95rem}
.verdict{margin-top:26px;text-align:center;font-family:var(--serif);font-size:1.18rem;
  color:var(--ink);max-width:60ch;margin-inline:auto}

/* ---------- FEATURE BLOCKS ---------- */
.feat{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;
  margin-bottom:22px;box-shadow:var(--shadow-s)}
.feat-h{display:flex;gap:18px;align-items:flex-start;padding:28px 30px 4px}
.feat-n{flex:0 0 40px;height:40px;border-radius:10px;background:var(--navy);color:#fff;
  display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:1.02rem}
.feat-h h3{margin:0 0 4px}
.feat-h .sub{font-size:.92rem;color:var(--muted);margin:0}
.feat-b{padding:18px 30px 28px 88px}
@media(max-width:640px){.feat-b{padding:18px 24px 26px}.feat-h{padding:24px 24px 4px}}
.fr{display:grid;grid-template-columns:118px 1fr;gap:16px;padding:13px 0;
  border-top:1px solid var(--line-2)}
@media(max-width:560px){.fr{grid-template-columns:1fr;gap:3px}}
.fr dt{font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding-top:4px}
.fr dd{margin:0;font-size:.96rem}
.fr.use dt{color:var(--accent)}
.fr.why dt{color:var(--gold)}

/* ---------- DIAGRAM ---------- */
.figure{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r);padding:24px;
  margin:26px 0}
.figure svg{display:block;width:100%;height:auto}
.figure figcaption{font-size:.87rem;color:var(--muted);margin-top:14px;text-align:center}

/* ---------- 9 BOX ---------- */
.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);gap:8px;margin:26px 0}
@media(max-width:700px){.matrix{grid-template-columns:auto repeat(3,1fr);font-size:.8rem}}
.mh{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);display:grid;place-items:center;text-align:center;padding:6px}
.mrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);display:grid;place-items:center;padding:6px 10px;writing-mode:horizontal-tb}
.mc{border-radius:9px;padding:14px 13px;border:1px solid var(--line);background:var(--card);
  min-height:96px}
.mc b{display:block;font-family:var(--serif);font-size:1.02rem;color:var(--ink);margin-bottom:4px}
.mc span{font-size:.79rem;line-height:1.45;display:block;color:var(--body)}
.mc.hot{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 34%,transparent)}
.mc.mid{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
.mc.cold{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 26%,transparent)}

/* ---------- TABLE ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:580px;font-size:.93rem}
th,td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg-3);color:var(--ink);font-weight:600;font-size:.76rem;
  text-transform:uppercase;letter-spacing:.07em}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.win{background:var(--ok-bg)}
tr.win td{color:var(--ink);font-weight:600}

/* ---------- STEPS ---------- */
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 30px 58px;margin-left:16px;
  border-left:2px solid var(--line)}
.steps li:last-child{border-left-color:transparent;padding-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:-17px;top:-4px;width:32px;height:32px;
  border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;
  font-size:.85rem;font-weight:700}
.steps b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:5px;font-family:var(--serif)}
.steps p{margin:0;font-size:.96rem}

/* ---------- CALLOUTS ---------- */
.box{border-radius:var(--r);padding:26px 30px;margin:28px 0;border:1px solid var(--line);
  background:var(--bg-2)}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.box .lab{display:block;color:var(--ink);font-weight:600;margin-bottom:9px;font-size:1rem}
.box.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 32%,transparent)}
.box.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 32%,transparent)}
.box ul{margin:0;padding-left:20px}.box li{margin-bottom:8px;font-size:.96rem}

/* ---------- SHEETS ---------- */
.sheets{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;background:var(--card)}
@media(max-width:900px){.sheets{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.sheets{grid-template-columns:1fr}}
.sh{padding:20px 22px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.sh b{display:block;color:var(--ink);font-size:.97rem;margin-bottom:2px}
.sh span{font-size:.87rem;color:var(--muted);line-height:1.5}

/* ---------- PRICING ---------- */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start}
@media(max-width:900px){.tiers{grid-template-columns:1fr;max-width:440px;margin:0 auto}}
.tier{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;
  box-shadow:var(--shadow-s);position:relative}
.tier.best{border:2px solid var(--accent);box-shadow:var(--shadow)}
.badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--accent);
  color:var(--accent-ink);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:6px 15px;border-radius:99px;white-space:nowrap}
.tier h3{font-family:var(--sans);font-size:.78rem;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.price{font-family:var(--serif);font-size:2.7rem;font-weight:700;color:var(--ink);line-height:1}
.price small{font-family:var(--sans);font-size:.9rem;font-weight:500;color:var(--muted)}
.who{font-size:.9rem;color:var(--muted);margin:12px 0 22px;min-height:44px}
.feats{list-style:none;padding:0;margin:0 0 26px}
.feats li{position:relative;padding:9px 0 9px 27px;font-size:.93rem;border-bottom:1px solid var(--line-2)}
.feats li:last-child{border-bottom:none}
.feats li::before{content:"";position:absolute;left:2px;top:16px;width:11px;height:6px;
  border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg)}
.tier .btn{display:block}

/* ---------- FAQ ---------- */
details{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:11px;
  overflow:hidden}
summary{padding:18px 22px;cursor:pointer;font-weight:600;color:var(--ink);font-size:1rem;
  list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.4rem;color:var(--accent);font-weight:400;line-height:1;flex:0 0 auto}
details[open] summary::after{content:"\2212"}
details .ans{padding:0 22px 20px;font-size:.95rem}
details .ans p:last-child{margin-bottom:0}

/* ---------- BAND ---------- */
.band{background:linear-gradient(160deg,var(--navy),var(--navy-3));color:#fff;text-align:center;
  padding:76px 0}
.band h2{color:#fff}
.band p{color:#C3D6EA;max-width:54ch;margin:0 auto 28px}
.band .btn-ghost{color:#fff;border-color:rgba(255,255,255,.34)}
.band .btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.1)}

footer{background:var(--bg-2);border-top:1px solid var(--line);padding:46px 0 34px;font-size:.89rem;
  color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:26px;flex-wrap:wrap;align-items:flex-start}
.foot-links{display:flex;gap:22px;flex-wrap:wrap}
.foot-links button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.89rem;
  font-family:var(--sans);padding:0}
.foot-links button:hover{color:var(--accent)}
.fine{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);font-size:.82rem;
  color:var(--faint);max-width:80ch}

/* ---------- CHECKOUT ---------- */
.btn.loading{opacity:.7;pointer-events:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(0);
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:10px;font-size:.9rem;
  box-shadow:var(--shadow);z-index:200;max-width:calc(100vw - 32px);opacity:0;
  pointer-events:none;transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.price-note{font-size:.82rem;color:var(--faint);margin-top:18px;text-align:center}
.thanks{min-height:60vh;display:flex;align-items:center;justify-content:center;padding:60px 24px}
.thanks-card{max-width:480px;text-align:center}
.thanks-ico{width:60px;height:60px;border-radius:50%;background:var(--ok-bg);color:var(--ok);
  display:grid;place-items:center;margin:0 auto 22px}
/* ---------- RTL ---------- */

<script>
var SITE_EN = {
  t1: 'Etlob Sa7<span>Demand planning for Egypt</span>',
  t2: 'Home',
  t3: 'What We Provide',
  t4: 'How It Works',
  t5: 'The Evidence',
  t6: 'Pricing',
  t7: 'FAQ',
  t8: 'Start free trial',
  t9: 'Home',
  t10: 'What We Provide',
  t11: 'How It Works',
  t12: 'The Evidence',
  t13: 'Pricing',
  t14: 'FAQ',
  t15: 'Built in Cairo for Egyptian brands',
  t16: 'Know exactly what to reorder, and when.',
  t17: 'Most small brands are excellent at selling and guessing at buying. This is the\n        system that removes the guess. It tells you how many units to order, from which supplier, on\n        which day, for every product you sell.',
  t18: '<a class="btn btn-primary btn-lg" data-go="pricing" href="#">Start your free trial</a>\n<a class="btn btn-ghost btn-lg" data-go="provide" href="#">See what it does</a>',
  t19: 'Runs in your browser. Arabic and English included. Priced in USD.',
  t20: '<b>99.4%</b><small>Fill rate achieved in a two year simulation</small>',
  t21: '<b>10 min</b><small>Your weekly routine once it is set up</small>',
  t22: '<b>11</b><small>Connected pages. You type into four.</small>',
  t23: '<b>2 min</b><small>To sign in. Just your email, no password to remember.</small>',
  t24: 'The problem',
  t25: 'You are almost certainly doing both of these at once',
  t26: 'And most owners do not realise they are the same problem wearing two\n          different faces.',
  t27: 'Your best seller keeps running out',
  t28: 'You reorder when you notice the shelf looks low. By then your supplier needs three\n            weeks, and you spend those three weeks turning away the exact customers you worked\n            hardest and paid most to win.',
  t29: 'Your worst product is holding your cash hostage',
  t30: 'Somewhere there is stock you bought on a good feeling that has not moved in four\n            months. That is not inventory. That is money you cannot spend, sitting in a box, while\n            you cannot afford to restock the thing that actually sells.',
  t31: 'Both are caused by the same thing: buying decisions made on instinct\n        instead of on your own numbers.',
  t32: 'What this is',
  t33: 'Not a stock counter. A purchasing brain.',
  t34: 'Tracking what you already have is the input. The product is the decision at\n          the end of it.',
  t35: '01',
  t36: 'It forecasts demand instead of averaging it',
  t37: 'It separates genuine seasonality from genuine randomness, so a winter product is never\n            treated as unpredictable simply for selling in winter. Then it detects whether each\n            product is growing or shrinking and projects forward, not backward.',
  t38: '02',
  t39: 'It makes the reorder decision for you',
  t40: 'An exact reorder level per product, built from how fast it sells, how unpredictable it\n            is, how long your supplier takes, and how often that supplier is late. Then the cheapest\n            order size, rounded to something the supplier will actually accept.',
  t41: '03',
  t42: 'It shows you where your money actually is',
  t43: 'Every product ranked by how much revenue it earns and how predictable it is, with a\n            specific instruction for each combination. Your steady top earner and your erratic top\n            earner should never be managed the same way, and now they are not.',
  t44: '04',
  t45: 'It hands you a purchase order you can send today',
  t46: 'Every recommendation grouped by supplier, so you send one combined order instead of\n            messaging about one product at a time. Plus a one page dashboard showing cash tied up,\n            projected profit, and what needs action this morning.',
  t47: '<a class="btn btn-ghost" data-go="provide" href="#">See every feature explained in detail</a>',
  t48: 'The core idea',
  t49: 'Ordering is a trade-off with a correct answer',
  t50: 'Order in huge batches and you place very few orders, so the hassle and shipping cost per\n        order almost disappears. But you are now sitting on a mountain of stock, paying rent on it,\n        unable to spend that money, watching it go out of style.',
  t51: 'Order tiny amounts constantly and you barely hold any stock at all. But you are paying the\n        full cost of placing an order every few days, and one late delivery empties you.',
  t52: '<strong>There is exactly one order size where the two costs added together are at their\n        lowest.</strong> It is different for a 40 EGP bracelet than for a 480 EGP jacket, because\n        holding the jacket costs twelve times more per unit. Doing that calculation by feel across\n        thirty products is genuinely beyond what anyone can hold in their head.',
  t53: 'That is the entire reason this app exists. Everything else in it is scaffolding around\n        that one calculation.',
  t54: 'Stop guessing what to buy',
  t55: 'Free trial on every plan. Nothing charged until it ends. Cancel in two clicks.',
  t56: '<a class="btn btn-primary btn-lg" data-go="pricing" href="#">See pricing</a>\n<a class="btn btn-ghost btn-lg" data-go="proof" href="#">Read the evidence first</a>',
  t57: 'What we provide',
  t58: 'Twelve capabilities, explained honestly',
  t59: 'For each one: what it is, how you actually use it, and why it matters to\n          your money. Where something is genuinely just convenient rather than transformative, we\n          say so.',
  t60: '1',
  t61: 'Seasonal separation',
  t62: 'The single thing that separates this from every free template online',
  t63: 'What it is',
  t64: 'Before measuring anything, each month\'s sales are\n          divided by that month\'s seasonal index. A December that normally runs 80% above average\n          gets divided by 1.8, putting every month on a comparable footing.',
  t65: 'How you use it',
  t66: 'You pick one shape per product from a dropdown:\n          Winter Peak, Summer Peak, Ramadan and Eid, or Flat. That is the entire interaction. You\n          can edit the twelve numbers behind any shape if you want to, but most people never need\n          to.',
  t67: 'Why it matters',
  t68: 'Without this, a wool scarf selling 95 in\n          December and 3 in June looks wildly unpredictable, so the system holds a huge expensive\n          safety buffer to protect you. But a scarf is not unpredictable. It is a scarf. On our own\n          test data this one feature cut the safety stock on a seasonal product from 89 units down\n          to 17, with no loss of service. That is cash straight back into your account for\n          nothing.',
  t69: '2',
  t70: 'Demand forecasting with trend detection',
  t71: 'Answers what is about to happen, not what typically happened',
  t72: 'What it is',
  t73: 'It compares the average of your most recent three\n          months against your earliest three and measures the slope between them, then projects that\n          forward and reapplies the season on top.',
  t74: 'How you use it',
  t75: 'You do nothing. You type twelve months of unit\n          sales and it appears. There is an on and off switch in Settings if you ever want to\n          disable it.',
  t76: 'Why it matters',
  t77: 'A flat average quietly under-orders every\n          growing product, forever. If a product is climbing by 3 units a month, an average of the\n          last twelve months is already about eighteen units behind reality by the time you use it.\n          That gap is exactly where stockouts on your rising stars come from, which are the most\n          expensive stockouts you can have.',
  t78: '3',
  t79: 'Safety stock that accounts for your supplier, not just your sales',
  t80: 'The term almost every other tool leaves out',
  t81: 'What it is',
  t82: 'Safety stock covers two separate risks at once: your\n          sales running hotter than forecast during the wait, and your supplier arriving late. Both\n          are calculated and combined properly, per product.',
  t83: 'How you use it',
  t84: 'One number per supplier. If they usually take\n          21 days but you have seen 16 and you have seen 26, you enter 4. A rough rule is in the\n          file: worst delay minus best delay, divided by four.',
  t85: 'Why it matters',
  t86: 'Free templates only cover the sales half. That\n          means every stockout caused by a supplier being a week late is invisible to them, and in\n          Egypt that is a large share of them. It also produces a genuinely counterintuitive and\n          very useful insight: a reliable slow supplier is cheaper to stock for than an unreliable\n          fast one. Once that is a number in a sheet, it becomes leverage in a negotiation.',
  t87: '4',
  t88: 'Reorder point',
  t89: 'Answers when. Not at zero, and not at a round number you invented.',
  t90: 'What it is',
  t91: 'A stock level per product. Reach it, place the order.\n          It equals your daily sales multiplied by your supplier\'s lead time, plus safety stock.',
  t92: 'How you use it',
  t93: 'You do not calculate anything. The Order\n          Decision sheet shows a coloured verdict per product: order today, order this week, stock is\n          healthy, or overstocked. Red, amber, green, blue.',
  t94: 'Why it matters',
  t95: 'Waiting until a product is nearly gone\n          guarantees a gap, because the supplier still needs their lead time after you notice. The\n          reorder point is the exact amount of stock that carries you through that wait and no more.\n          Ordering at the right level is worth more than ordering the right quantity.',
  t96: 'Stock falls as you sell. It touches the reorder point, you order, and the\n            remaining stock carries you through the lead time. Safety stock is the cushion you only\n            eat into when something goes wrong.',
  t97: '5',
  t98: 'Economic order quantity',
  t99: 'Answers how much, by finding the bottom of the cost curve',
  t100: 'What it is',
  t101: 'The order size where your ordering costs and your\n          holding costs added together are at their absolute minimum. It is a published formula from\n          1913 and it is used in factories worldwide.',
  t102: 'How you use it',
  t103: 'You enter two numbers once, in Settings: what\n          placing one order costs you all in, and roughly what it costs to hold 100 EGP of stock for\n          a year. Guidance for both is written into Settings. Being 20% off on these barely changes\n          the answer.',
  t104: 'Why it matters',
  t105: 'This is the number almost nobody calculates\n          and almost everybody gets wrong in both directions. Over-ordering freezes cash. Under-\n          ordering burns your time and shipping budget. The gap between a guessed quantity and the\n          optimal one is usually a meaningful share of your annual inventory cost.',
  t106: '6',
  t107: 'Supplier minimums and carton rounding',
  t108: 'A small feature that removes a daily irritation',
  t109: 'What it is',
  t110: 'Every recommended quantity is automatically raised to\n          your supplier\'s minimum order and rounded up to a whole carton.',
  t111: 'How you use it',
  t112: 'Two numbers per supplier, entered once.',
  t113: 'Why it matters',
  t114: 'Honestly, this one is convenience rather than\n          transformation. But it is the difference between a tool that tells you to order 67 pieces\n          and one that tells you to order 72, which is six full boxes, which is an order you can\n          copy and send without thinking about it. Tools that ignore this get abandoned.',
  t115: '7',
  t116: 'Inventory position tracking',
  t117: 'Prevents the single most expensive spreadsheet mistake',
  t118: 'What it is',
  t119: 'Every decision is made against stock on hand plus\n          stock already on order, never against what is physically in front of you.',
  t120: 'How you use it',
  t121: 'One column. When you place an order, type the\n          quantity into Stock On Order. When it arrives, move it to Stock On Hand.',
  t122: 'Why it matters',
  t123: 'Without it, here is what happens. You order.\n          The goods are in transit. You check the sheet next week, stock on hand is still low, so\n          you order again. Now you have double the stock and half the cash, and you will not notice\n          for three weeks. This is the most common expensive error in home made inventory\n          spreadsheets and it is entirely preventable.',
  t124: '8',
  t125: 'Demand graphs',
  t126: 'See the shape of your sales, not just the number the engine outputs',
  t127: 'What it is',
  t128: 'Every product gets its own graph: actual sales across the last twelve\n          months plotted next to what the forecast expected. A growing trend or a seasonal swing\n          becomes something you see in one glance, instead of something buried in a column of numbers.',
  t129: 'How you use it',
  t130: 'Open any product from Order Decisions and its graph is right there.\n          Nothing to build or configure, it draws itself from the same sales history you already entered.',
  t131: 'Why it matters',
  t132: 'A number can be technically correct and still hide the story behind it.\n          A graph catches what a table cannot: a product that quietly changed shape, a spike the\n          forecast missed, a slow decline nobody noticed month to month. It is the fastest way to\n          sanity check the engine\'s own output before you act on it.',
  t133: 'X · steady',
  t134: 'Y · variable',
  t135: 'Z · erratic',
  t136: 'A<br/>top 80%',
  t137: '<b>AX</b><span>Your engine. Automate it, push service to 99, negotiate volume pricing.</span>',
  t138: '<b>AY</b><span>High value, swings. Review weekly, hold a fuller buffer.</span>',
  t139: '<b>AZ</b><span>The hardest box. Order smaller and more often, keep the supplier warm.</span>',
  t140: 'B<br/>next 15%',
  t141: '<b>BX</b><span>Solid mid-tier. Automate the reorder and forget it.</span>',
  t142: '<b>BY</b><span>Review monthly, moderate buffer, nothing dramatic.</span>',
  t143: '<b>BZ</b><span>Keep minimum stock. Do not chase it.</span>',
  t144: 'C<br/>last 5%',
  t145: '<b>CX</b><span>Order rarely in large batches. Low service level is fine.</span>',
  t146: '<b>CY</b><span>Quarterly review, minimal stock.</span>',
  t147: '<b>CZ</b><span>Small money, impossible to plan. Usually worth discontinuing.</span>',
  t148: '9',
  t149: 'Purchase plan grouped by supplier',
  t150: 'Turns a list of numbers into an order you can send',
  t151: 'What it is',
  t152: 'Every product that needs ordering, collected under the\n          supplier it comes from, with totals, payment terms, and an optional budget check.',
  t153: 'How you use it',
  t154: 'Open the sheet, read one block per supplier,\n          send one message. You can set a monthly purchase budget and it will warn you when the\n          recommendations exceed it and tell you to fund your class A products first.',
  t155: 'Why it matters',
  t156: 'Analysis that does not end in an action gets\n          abandoned within a month. This is the sheet that converts everything above it into ten\n          minutes of work on a Monday morning. The budget warning matters more than it sounds,\n          because recommendations that ignore your cash position are not recommendations.',
  t157: '10',
  t158: 'Health Check, the data audit layer',
  t159: 'Because a confident wrong answer is worse than no answer',
  t160: 'What it is',
  t161: 'A sheet that audits your own inputs before you trust\n          any output. It checks for missing history, selling price below cost, unknown suppliers,\n          negative stock, one-off sales spikes, thin margins, and products marked as flat whose sales\n          clearly swing.',
  t162: 'How you use it',
  t163: 'Open it after any change. Every row shows one\n          of three verdicts: FIX THIS, REVIEW, or GOOD. Each problem row names the specific problem\n          in plain language.',
  t164: 'Why it matters',
  t165: 'Every forecasting tool in the world is only as\n          good as what was typed into it, and most of them will happily produce a confident,\n          beautifully formatted, completely wrong order quantity from bad data. This layer catches\n          it first. It is also the feature most likely to save you money on your first week, because\n          almost every new user has at least one data problem they did not know about.',
  t166: '11',
  t167: 'One page dashboard',
  t168: 'The state of your inventory business in fifteen numbers',
  t169: 'What it is',
  t170: 'Cash tied up in stock right now, projected annual\n          revenue and gross profit, your total inventory operating cost, how many products need\n          action today, your ABC split, inventory turnover, average days of cover, and the value\n          currently locked in overstock.',
  t171: 'How you use it',
  t172: 'It updates itself. You never type into it.',
  t173: 'Why it matters',
  t174: 'Two numbers here are worth the subscription on\n          their own. Inventory turnover tells you how many times your stock cycles per year, and\n          under four means your cash is asleep. Value locked in overstock tells you exactly how much\n          money you could free up this month by discounting the right things.',
  t175: '12',
  t176: 'The guided walkthrough, and what arrives every month',
  t177: 'You are buying an ongoing system, not a download',
  t178: 'What it is',
  t179: 'A separate six page tutorial that walks you through a\n          worked example, a fictional clothing brand, from an empty workspace to a finished purchase order,\n          with a full answer key so you can check you did it right. Roughly 25 minutes.',
  t180: 'How you use it',
  t181: 'Open it in a second tab and follow it inside the real\n          app. Every value to type is given. Every number you should end up seeing is listed.',
  t182: 'Why it matters',
  t183: 'Most business spreadsheets are abandoned in\n          week one because nobody explains them. Beyond that, Pro and Store already include the\n          supplier scorecard, stockout cost estimator, dead stock report, and cash flow forecast,\n          and a pricing calculator and promotion planner are still ahead. Everyone on the app gets\n          each new tool the day it ships, and your own workspace and data stay exactly where you\n          left them even if you cancel.',
  t184: 'Also included',
  t185: 'Fifteen connected pages',
  t186: 'You type into four of them. The other eleven do the work.',
  t187: '<b>Start Here</b><span>Setup order, verdict legend, and an honest list of what the app cannot do</span>',
  t188: '<b>Dashboard</b><span>Cash, profit, turnover and today\'s action list on one page</span>',
  t189: '<b>Settings</b><span>Ordering cost, holding rate, service level targets</span>',
  t190: '<b>Seasons</b><span>Winter, summer, Ramadan and Eid, or flat. Editable on Pro and Store.</span>',
  t191: '<b>Suppliers</b><span>Lead times, variation, minimums, carton sizes, payment terms</span>',
  t192: '<b>Products</b><span>Twelve months of sales, costs, prices, stock on hand and in transit</span>',
  t193: '<b>Demand Forecast</b><span>Deseasonalised demand, trend, variability class, forecast</span>',
  t194: '<b>Order Decisions</b><span>Safety stock, reorder point, quantity, and a plain verdict</span>',
  t195: '<b>Demand Graphs</b><span>Actual sales against forecast, per product, drawn automatically</span>',
  t196: '<b>Purchase Plan</b><span>Orders grouped by supplier with totals and budget check</span>',
  t197: '<b>Health Check</b><span>Audits your data and flags anything that would produce a wrong order</span>',
  t420: '<b>Supplier Scorecard</b><span>Rates each supplier on reliability. Pro and Store.</span>',
  t421: '<b>Stockout Cost Estimator</b><span>What a stockout on this product would actually cost you. Pro and Store.</span>',
  t422: '<b>Dead Stock Report</b><span>What is not moving and how much cash it is holding hostage. Store.</span>',
  t423: '<b>Cash Flow Forecast</b><span>What your planned orders will cost and when. Store.</span>',
  t198: '<b>Guided Walkthrough</b><span>Separate six page tutorial with a full answer key</span>',
  t199: '<a class="btn btn-primary" data-go="pricing" href="#">Start your free trial</a>',
  t200: 'How it works',
  t201: 'Set up once in an afternoon. Ten minutes a week after that.',
  t202: 'No software to install, nothing to connect to your shop. You sign in with your\n          email and type in numbers you already have.',
  t203: 'Setting up, about two hours once',
  t204: 'Enter two numbers in Settings',
  t205: 'What it costs you to place one order, all in, including your own time. And roughly what\n            it costs to hold 100 EGP of stock for a year. Both have written guidance and typical\n            Egyptian ranges on the Settings page. Rough is fine.',
  t206: 'List your suppliers',
  t207: 'How many days each one actually takes, how much that varies, their minimum order, their\n            carton size, and their payment terms. Five columns, one row each.',
  t208: 'Enter your products',
  t209: 'Twelve months of unit sales per product, cost, price, stock on hand, stock already on\n            order, your target service level, and which seasonal shape it follows. This is the only\n            part that takes real time, and it is once.',
  t210: 'Run the Health Check',
  t211: 'Before trusting anything. It tells you which rows have problems and exactly what is\n            wrong with them. Expect a few on your first pass. That is normal and it is the point.',
  t212: 'Read your first order decision',
  t213: 'Open Purchase Plan. Send the orders. That is the system working.',
  t214: 'Every Monday, ten minutes',
  t215: 'Count stock and update On Hand. Update On Order for anything you have paid for. Open Order\n        Decision, read the coloured verdicts, and send whatever Purchase Plan tells you to send.',
  t216: 'Start of each month, fifteen minutes',
  t217: 'Add last month\'s sales, shift the month columns one place to the left, update the Last Sales\n        Month setting, and re-run the Health Check.',
  t218: 'Every quarter, half an hour',
  t219: 'Look through the demand graphs for anything that surprised you this quarter.\n        On Store, check the Dead Stock Report and discount or discontinue whatever has stopped\n        moving. Revisit your seasonal profiles if a product changed shape.',
  t220: 'What you need before you start',
  t221: 'Twelve months of unit sales per product. Not revenue, units.',
  t222: 'Your cost and selling price per product.',
  t223: 'A rough idea of how long each supplier takes, and how much they vary.',
  t224: 'A current stock count. Actual counted, not estimated.',
  t225: 'Two data habits that matter more than any formula',
  t226: '<strong>A month you were out of stock is not a month of low demand.</strong> Leave it\n          blank rather than entering 0, or you teach the system that nobody wanted it.',
  t227: '<strong>Strip out one-off distortions before entering.</strong> A\n          viral week, a single wholesale order, an influencer drop. Left in, they will inflate your\n          orders for a full year.',
  t228: 'The evidence',
  t229: 'Tested against how people actually order',
  t230: 'We would rather show you the method and the limits than make a claim you\n          cannot check.',
  t231: 'The simulation',
  t232: 'We simulated two years of daily trading across an eight product catalogue, thirty\n        independent runs, giving every ordering method the exact same randomly generated demand and\n        the same randomly varying supplier delays. Both learning methods re-planned every 30 days\n        using only the sales history they had actually observed by that point, exactly as a real\n        user would.',

  t258: '73,337',
  t259: '35,282',
  t260: '142,079',
  t261: 'All figures in EGP. Total cost\n        combines ordering cost, holding cost, and the gross margin lost to stockouts. The system beat\n        gut feel in 30 runs out of 30, and beat the standard template in 29 out of 30.',
  t262: 'The result that actually matters',
  t263: 'Look at the fill rate and the average stock held together. Anyone\n          can raise service by simply buying more inventory, and the standard template does exactly\n          that, holding 163,866 EGP of stock to reach 98.2%. Reaching a higher 99.4% while holding\n          less stock is the part that requires the maths. That difference is the product.',
  t264: 'How the app itself was verified',
  t265: 'This simulation was run against the original spreadsheet model. Since then the same\n        calculation engine was rebuilt for the web app and tested again, independently, before\n        anyone could sign up:',
  t266: 'Every formula was checked against a hand worked calculation, and against dozens of edge\n          cases: an empty workspace, a product with one month of data, zero cost, price below cost,\n          missing suppliers, negative stock, no suppliers at all, and a fully loaded catalogue.',
  t267: 'Bad data cases were tested to confirm the Health Check actually catches problems rather\n          than silently producing confident nonsense.',
  t268: 'Sign in, subscription access, and every page were driven end to end in a real browser\n          before launch, in both languages.',
  t269: 'Three real issues were found and fixed this way: two of the built in season shapes did\n          not average out to a neutral 1.0 across the year, which was quietly skewing order sizes for\n          those products; a revenue-ranking edge case could leave a shop with no top tier product at\n          all; and the one-off spike check was flagging ordinary steady products. A clean interface\n          proves the buttons work. It does not prove the numbers are right, which is why this gets\n          checked separately every time something changes.',
  t270: 'Honesty',
  t271: 'What this system is not',
  t272: 'Stated here rather than buried, because you will find out eventually and we\n          would rather you heard it from us.',
  t273: '<strong>It is decision support, not a guarantee.</strong> It reduces stockouts and\n            frozen cash. It cannot predict a supplier disappearing or a shipment stuck at customs.',
  t274: '<strong>A brand new product cannot be forecast</strong> by this or any other method on\n            earth, because there is nothing to forecast from. Order it on judgement for the first six\n            months.',
  t275: '<strong>Under twelve months of history</strong> and seasonal adjustment switches itself\n            off automatically. Under six months for a given product, do not rely on it at all, and\n            the Health Check will tell you so.',
  t276: '<strong>You supply the seasonal shape.</strong> The system will not guess it from one\n            year of data, because one year cannot tell a real December peak apart from one lucky\n            December. Any tool claiming otherwise is guessing and not telling you.',
  t277: '<strong>Genuinely erratic products stay expensive.</strong> If a product\'s sales jump\n            between 10 and 90 with no pattern, the system will hold a large buffer, and that costs\n            money. That is an honest trade-off, not a fault.',
  t278: '<strong>No accounting, no POS, no barcode scanning, no multi-location stock.</strong>\n            It is the planning brain that sits on top of however you already count stock.',
  t279: '<strong>It is only as good as what you type in.</strong> Which is precisely why the\n            Health Check exists.',
  t280: 'Pricing',
  t281: 'Monthly. Cancel whenever you like.',
  t282: 'Every plan includes the full system, both languages, the guided walkthrough,\n          and a new tool each month. Fourteen days free on Basic and Pro, five days on Store.',
  t283: 'Prices are billed in USD. Your bank or card converts it to EGP automatically at checkout,\n          the same as any other international subscription.',

  t313: 'Start free trial',
  t314: 'Free trial on every plan',
  t315: 'Nothing is charged until the trial ends. If it is not for you, cancel and you are never\n            billed.',
  t318: 'Your data stays put',
  t319: 'Your workspace is kept even if you cancel, so everything is exactly as you left it if you come back.',
  t320: 'Questions',
  t321: 'Before you buy',
  t322: 'Do I need to understand any of the maths?',
  t323: 'No. You enter your sales history, your costs and your supplier details.\n          The system gives you plain instructions: order today, order this week, you are covered, or\n          you are overstocked. The included walkthrough explains every concept in ordinary language\n          if you want to understand what is happening underneath, and many people do after a month\n          or two.',
  t324: 'I sell on Instagram, not a website. Does that matter?',
  t325: 'Not at all. It does not connect to any platform. It works from your\n          sales numbers, wherever those sales happened. Instagram, WhatsApp, a physical shop, a\n          marketplace, or all four at once.',
  t326: 'What if I only have six or eight months of history?',
  t327: 'It still works. Seasonal adjustment switches itself off automatically and\n          the Health Check tells you clearly that results are rougher. Below six months for a given\n          product, the honest answer is that no forecasting method is reliable, and the system says\n          so rather than pretending.',
  t328: 'Do I need to install anything?',
  t329: 'No. It runs in your browser, on your phone or your computer, the same way\n          a website does. There is nothing to download and nothing to keep updated yourself. You do\n          need an internet connection while you use it, since your numbers are calculated on our\n          servers and saved to your account as you type.',
  t330: 'Arabic or English?',
  t331: 'Both are included with every plan at no extra cost. The Arabic version is\n          fully right to left and built around EGP.',
  t332: 'How many products can it handle?',
  t333: 'Basic covers up to 10 products and 10 suppliers, with the four built in season\n          shapes fixed as they are. Pro covers up to 35 products, Store up to 200, both with up to\n          100 suppliers and your own custom season shapes.',
  t334: 'What exactly arrives each month?',
  t335: 'A new or improved tool, plus any corrections. Pro and Store already include the\n          supplier scorecard, stockout cost estimator, dead stock report, and cash flow forecast.\n          A pricing and margin calculator and a promotion planner are still ahead. Everyone gets\n          each tool the day it ships. If you cancel, your workspace is kept and waiting for you if\n          you come back later.',
  t336: 'Can I cancel easily?',
  t337: 'Any time, from your own account, without emailing anyone. You keep access\n          until the end of the period you already paid for.',
  t338: 'How is this different from the free templates online?',
  t339: 'Free templates record what you already have. They do not forecast demand,\n          do not calculate safety stock from your supplier\'s actual reliability, do not separate\n          seasonality from randomness, and do not respect minimum order quantities. Those are\n          precisely the parts that change what you buy. The simulation on the Evidence page compares\n          the two directly.',
  t340: 'Will this work for a service business or for made to order products?',
  t341: 'Not really, and we would rather say so. This is built for businesses\n          holding physical stock they buy in and resell. If you make to order, the reorder logic does\n          not apply to your finished goods, though it can still be useful for raw materials and\n          components.',
  t342: 'Who can see my business data?',
  t343: 'Only you. Each account gets its own private workspace that nobody else\n          can open, including other subscribers. You sign in with a one time code sent to your own\n          email, and your account works on up to two devices at a time. Nobody at Etlob Sa7 looks at\n          your numbers as part of running the product.',
  t344: 'What if I get stuck?',
  t345: 'Message us directly on WhatsApp, the number is right there in the app once you are\n          signed in. The guided walkthrough tutorial included with every plan also covers most of\n          what trips people up.',
  t346: 'Ready to stop guessing?',
  t347: 'Free trial on every plan. Nothing charged until it ends.',
  t348: 'See pricing',
  t349: 'Payment received',
  t350: 'Check your email for your sign-in link. It can take up to fifteen minutes for\n        your account to switch on, so if it is not there yet, it is on its way.',
  t351: 'No email after fifteen minutes? Check your spam folder, or message\n        us on WhatsApp and we will sort it out by hand.',
  t352: '<a class="btn btn-ghost" data-go="home" href="#">Back to the site</a>',
  t353: 'Legal',
  t354: 'Privacy policy',
  t355: 'Last updated 19 September 2026.',
  t356: 'What this covers',
  t357: 'This policy explains what information Etlob Sa7 collects when you use the app or this\n    website, what it\'s used for, and what choices you have about it. "We" means Etlob Sa7.\n    "You" means anyone who signs up for or uses the app.',
  t358: 'What we collect',
  t359: 'Three kinds of information pass through the service:',
  t360: '<strong>Your email address</strong>, used to send you sign-in codes and account\n        notices, and nothing else.',
  t361: '<strong>The business data you type into the app</strong>: product names, sales\n        history, supplier details, costs and prices. This is yours. We store it so the app can\n        work, we don\'t read it, sell it, or use it for anything beyond running your account.',
  t362: '<strong>Basic technical logs</strong>: when you signed in, which device, and whether a\n        save succeeded. Kept to troubleshoot problems and stop abuse, not to watch how you use\n        the app.',
  t363: 'We never see or store your card number. Payment happens entirely through Paddle, our\n    payment provider; see the Payments section below.',
  t364: 'Where it\'s stored',
  t365: 'The app runs on Google\'s infrastructure (Google Apps Script and Google Drive). Each\n    subscriber\'s business data lives in its own private file that only their own account can\n    open, invisible to every other subscriber. This website is hosted separately, wherever we\'ve\n    deployed it.',
  t366: 'Who can see it',
  t367: 'Only you, by signing in with a code sent to your own email. We don\'t access individual\n    subscribers\' business data as part of normal operation. The one exception is if you contact\n    support with a problem and asking us to look is the only way to help.',
  t368: 'Payments',
  t369: 'Paddle.com handles all billing, as the merchant of record for this service. When you\n    subscribe, Paddle collects your payment details directly, not us. Paddle\'s own privacy policy\n    governs that part of the relationship. We receive confirmation of your subscription status\n    from Paddle (active, cancelled, payment failed), never your card details.',
  t370: 'How long we keep it',
  t371: 'For as long as your account exists, including after you cancel a subscription, so your\n    workspace is waiting for you if you come back. If you want your data deleted entirely, email\n    or WhatsApp us and we\'ll remove it, usually within a few days.',
  t372: 'Cookies and tracking',
  t373: 'This website doesn\'t run advertising trackers or sell data to third parties. Paddle\'s own\n    checkout page may set cookies necessary to process your payment; that happens on Paddle\'s\n    page, governed by their policy, not ours.',
  t374: 'Your rights',
  t375: 'You can ask us at any time to export a copy of your data, correct something we have wrong,\n    or delete your account and everything in it. Reach us the same way as support, below.',
  t376: 'Changes to this policy',
  t377: 'If this changes in any way that matters, we\'ll post the update here with a new date at the\n    top. Continuing to use the app after a change means you accept the update.',
  t378: 'Contact',
  t379: 'Questions about this policy, or a request about your data: reach us on WhatsApp using the\n    number on the pricing page, or by email if you have one for us.',
  t380: 'Legal',
  t381: 'Terms and conditions',
  t382: 'Last updated 19 September 2026.',
  t383: 'What you\'re signing up for',
  t384: 'Etlob Sa7 is a subscription app that turns your sales history into demand forecasts,\n    reorder points, and purchase quantities. It\'s a decision support tool. It does not place\n    orders on your behalf, does not guarantee any sale, profit, or supplier delivery, and does\n    not replace your own judgement about your business. You make the final call on every order.',
  t385: 'Who can use it',
  t386: 'You need to be old enough to enter into a binding agreement where you live, and using the\n    app on behalf of a real or intended business, not as a consumer purchase.',
  t387: 'Plans and billing',
  t388: 'Subscriptions are billed monthly, in advance, through Paddle.com, who acts as the merchant\n    of record and handles the actual charge to your card. Prices are shown on the pricing page.\n    If a plan includes a free trial, you won\'t be charged until the trial ends, and you can cancel\n    before then without paying anything.',
  t389: 'Cancelling',
  t390: 'Cancel any time from your own account, no form, no phone call. You keep access until the\n    end of the period you already paid for. Your data is kept, not deleted, so if you come back\n    later everything is where you left it.',
  t391: 'Refunds',
  t392: 'Refund requests are reviewed individually. Message us through WhatsApp support and we\'ll get back to you.',
  t393: 'Using the app fairly',
  t394: 'Each account is licensed to one subscriber, for their own business. Accounts are limited\n    to two signed-in devices at a time as a practical, technical limit, not a suggestion; we may\n    suspend an account being shared or resold beyond that. You agree not to try to break, scrape,\n    reverse engineer, or resell access to the app.',
  t395: 'Your data',
  t396: 'The sales, supplier, and product information you type in is yours. We store it to run the\n    app and don\'t claim any ownership over it. See the Privacy Policy for exactly how it\'s\n    handled.',
  t397: 'No guaranteed outcomes',
  t398: 'The forecasts, reorder points, and order quantities this app produces are calculations\n    based on the data you provide. They are not financial, accounting, or legal advice, and we\n    don\'t guarantee they\'ll be right for every situation, especially where your own data is\n    incomplete, wrong, or covers too short a history to mean much yet. A supplier missing a\n    delivery date, a sudden change in demand, or a mistake in what you typed in can all make a\n    specific recommendation wrong. Review anything unusually large before you act on it.',
  t399: 'Limitation of liability',
  t400: 'To the extent the law where you are allows it, Etlob Sa7 isn\'t liable for lost profits,\n    lost sales, stock bought or not bought on the app\'s advice, or any other indirect loss arising\n    from using the app. Our total liability for any claim is capped at what you paid us in the\n    three months before the claim.',
  t401: 'Ending an account',
  t402: 'We can suspend or end an account for non-payment, abuse of the service, or a serious breach\n    of these terms. Where reasonably possible we\'ll tell you why first.',
  t403: 'Changes to these terms',
  t404: 'If these change in a way that matters, we\'ll post the update here with a new date.\n    Continuing to use the app afterward means you accept the update.',
  t405: 'Governing law',
  t406: 'These terms are governed by the laws of the Arab Republic of Egypt.',
  t407: 'Contact',
  t408: 'Reach us on WhatsApp using the number on the pricing page, or by email if you have one for\n    us.',
  t409: '<strong style="color:var(--ink);display:block;margin-bottom:6px">Etlob Sa7</strong>\n        Demand forecasting and purchase planning, built in Cairo for Egyptian brands.',
  t410: 'What we provide',
  t411: 'How it works',
  t412: 'Evidence',
  t413: 'Pricing',
  t414: 'FAQ',
  t415: 'Privacy policy',
  t416: 'Terms and conditions',
  t417: '\n      Performance figures shown on the Evidence page come from a controlled simulation using\n      generated demand, not from audited customer accounts, and are presented alongside the full\n      method so they can be judged on their merits. This product is decision support for inventory\n      purchasing. It does not guarantee any business outcome.\n    ',

  t37: 'بيفصل الموسمية الحقيقية عن العشوائية الحقيقية، فمنتج الشتاء ماحدش هيحكم عليه إنه غير متوقع لمجرد إنه بيتباع في الشتاء. وبعدين بيكتشف لو المنتج في نمو أو تراجع ويتوقع لقدام، مش بيرجع للخلف.',
  t38: '02',
  t39: 'بياخد قرار الطلب بدالك',
  t40: 'مستوى طلب دقيق لكل منتج، مبني على سرعة بيعه، مدى تقلبه، مدة توريد الموردين، وكل قد إيه بيتأخروا. وبعدين أفضل كمية طلب، مظبوطة على أقرب حاجة يقبلها المورد.',
  t41: '03',
  t42: 'بيوريك فلوسك فعلا فين',
  t43: 'كل منتج متصنف حسب قد إيه بيجيب مبيعات وقد إيه متوقع. مع تعليمة محددة لكل تركيبة. أكتر منتج ثابت وأكتر منتج عشوائي مايتعاملش معاهم بنفس الطريقة، ودلوقتي فعلا مابيتعاملش.',
  t44: '04',
  t45: 'بيديك طلبية جاهزة تبعتها النهارده',
  t46: 'كل توصية متجمعة حسب المورد، فتبعت طلبية واحدة مجمعة بدل ما تكلم كل منتج لوحده. وكمان لوحة متابعة في صفحة واحدة بتوريك الفلوس المجمدة، الربح المتوقع، واللي محتاج تتصرف فيه النهارده.',
  t47: '<a class="btn btn-ghost" data-go="provide" href="#">شوف كل ميزة بالتفصيل</a>',
  t48: 'الفكرة الأساسية',
  t49: 'الطلب معادلة موازنة وليها إجابة صح',
  t50: 'اطلب كميات ضخمة وتطلب نادر جدا، فتعب ومصاريف الشحن لكل طلبية بتقل جدا. بس هتبقى قاعد على جبل بضاعة، بتدفع إيجار مكانها، مش قادر تصرف الفلوس دي، وهي بتقدم في الموضة.',
  t51: 'اطلب كميات صغيرة باستمرار وهتفضل تقريبا من غير مخزون خالص. بس هتدفع تكلفة الطلب كاملة كل كام يوم، وأي تأخير في التوريد هيخليك فاضي تماما.',
  t52: '<strong>في مقاس طلب واحد بالظبط، فيه التكلفتين مع بعض بيبقوا في أقل حاجة.</strong> وده مختلف بين سوار بـ 40 جنيه وجاكت بـ 480 جنيه، لأن تخزين الجاكت بيكلف اثنا عشر ضعف للقطعة. تعمل الحساب ده بالإحساس على ثلاثين منتج فعلا فوق طاقة أي حد.',
  t53: 'ده السبب الوحيد اللي الأداة دي موجودة علشانه. كل حاجة تانية فيها هي بس إطار حوالين الحساب ده.',
  t54: 'بلاش تخمين اللي هتشتريه',
  t55: 'تجربة مجانية على كل باقة. مفيش خصم لحد ما التجربة تخلص. إلغاء بضغطتين.',
  t56: '<a class="btn btn-primary btn-lg" data-go="pricing" href="#">شوف الأسعار</a>\n<a class="btn btn-ghost btn-lg" data-go="proof" href="#">اقرأ الإثبات الأول</a>',
  t57: 'اللي بنقدمه',
  t58: 'اثنتا عشرة ميزة، متشرحة بصراحة',
  t59: 'لكل ميزة: اللي هي، إزاي بتستخدمها فعلا، وليه مهمة لفلوسك. ولو حاجة فعلا مجرد راحة مش تغيير جذري، هنقولك كده.',
  t60: '1',
  t61: 'فصل الموسمية',
  t62: 'الحاجة الوحيدة اللي بتفرق بين ده وأي قالب مجاني على النت',
  t63: 'اللي هي إيه',
  t64: 'قبل ما نقيس أي حاجة، مبيعات كل شهر بتتقسم على مؤشر الموسم بتاعه. ديسمبر اللي عادة بيبقى أعلى بـ 80% بيتقسم على 1.8، فكل الشهور بتبقى على نفس المستوى للمقارنة.',
  t65: 'إزاي تستخدمها',
  t66: 'تختار شكل موسم واحد لكل منتج من قايمة: ذروة الشتاء، ذروة الصيف، رمضان والعيد، أو ثابت. ده كل اللي محتاج تعمله. تقدر تعدل الاثنا عشر رقم اللي وراء أي شكل لو عايز، بس أغلب الناس مش محتاجين لده أبدا.',
  t67: 'ليه مهمة',
  t68: 'من غيرها، طرحة صوف بتتباع 95 في ديسمبر و3 في يونيو هتبان غير متوقعة خالص، فالنظام هيحتفظ بمخزون أمان ضخم ومكلف علشان يحميك. بس الطرحة مش غير متوقعة. هي طرحة شتاء. في بيانات الاختبار بتاعتنا، الميزة دي لوحدها قللت مخزون الأمان لمنتج موسمي من 89 قطعة لـ 17، من غير أي نقص في الخدمة. ده فلوس راجعالك من غير مجهود.',
  t69: '2',
  t70: 'توقع الطلب مع اكتشاف الاتجاه',
  t71: 'بيجاوب على اللي هيحصل، مش اللي كان بيحصل عادة',
  t72: 'اللي هي إيه',
  t73: 'بيقارن متوسط آخر تلات شهور عندك بأول تلات شهور، ويقيس الميل بينهم، وبعدين يسقطه لقدام ويرجع يطبق الموسمية فوقه.',
  t74: 'إزاي تستخدمها',
  t75: 'ماتعملش حاجة. تكتب مبيعات اثنا عشر شهر وهو بيظهر لوحده. في مفتاح تشغيل وإيقاف في الإعدادات لو عايز توقفه.',
  t76: 'ليه مهمة',
  t77: 'المتوسط الثابت بيقلل طلب أي منتج في نمو باستمرار، للأبد. لو منتج بيزيد 3 قطع في الشهر، متوسط آخر اثنا عشر شهر بيبقى متأخر عن الواقع بحوالي تمنتاشر قطعة وقت ما تستخدمه. الفجوة دي بالظبط منين بتيجي أغلى أنواع نفاد المخزون، اللي هي نفاد المنتجات الصاعدة عندك.',
  t78: '3',
  t79: 'مخزون أمان بيحسب موردك مش مبيعاتك بس',
  t80: 'المصطلح اللي كل أداة تانية بتسيبه',
  t81: 'اللي هي إيه',
  t82: 'مخزون الأمان بيغطي خطرين في نفس الوقت: مبيعاتك تزيد عن المتوقع وقت الانتظار، ومورد يتأخر. الاتنين بيتحسبوا ويتجمعوا صح، لكل منتج.',
  t83: 'إزاي تستخدمها',
  t84: 'رقم واحد لكل مورد. لو عادة بياخد 21 يوم بس شفته بياخد 16 مرة و26 مرة، تكتب 4. القاعدة التقريبية: أطول تأخير ناقص أقصر تأخير، مقسومة على أربعة.',
  t85: 'ليه مهمة',
  t86: 'القوالب المجانية بتغطي نص المبيعات بس. يعني أي نفاد مخزون سببه تأخير المورد أسبوع بيبقى غير مرئي خالص، وده في مصر نسبة كبيرة منهم. وكمان بتطلع نتيجة عكس المتوقع بس مفيدة جدا: مورد بطيء وموثوق فيه أرخص تخزين له من مورد سريع مش موثوق. أول ما ده يبقى رقم قدامك، بيبقى ورقة ضغط في التفاوض.',
  t87: '4',
  t88: 'نقطة إعادة الطلب',
  t89: 'بتجاوب على إمتى. مش عند الصفر، ومش عند رقم اخترعته انت.',
  t90: 'اللي هي إيه',
  t91: 'مستوى مخزون لكل منتج. توصله، تطلب. بيساوي مبيعاتك اليومية في مدة توريد المورد، زائد مخزون الأمان.',
  t92: 'إزاي تستخدمها',
  t93: 'ماتحسبش حاجة. صفحة قرارات الطلب بتوريك قرار ملون لكل منتج: اطلب النهارده، اطلب الأسبوع ده، المخزون كويس، أو زيادة. أحمر، برتقالي، أخضر، أزرق.',
  t94: 'ليه مهمة',
  t95: 'الانتظار لحد ما المنتج يقرب يخلص بيضمنلك فجوة، لأن المورد لسه محتاج مدة التوريد بعد ما تلاحظ. نقطة إعادة الطلب هي بالظبط قد المخزون اللي هيغطيك خلال الانتظار ده، مش أكتر. تطلب في التوقيت الصح أهم من تطلب الكمية الصح.',
  t96: 'المخزون بينزل وانت بتبيع. يوصل نقطة إعادة الطلب، تطلب، والمخزون الباقي بيغطيك طول مدة التوريد. مخزون الأمان هو الوسادة اللي بس بتستخدمها لو حاجة غلطت.',
  t97: '5',
  t98: 'كمية الطلب الاقتصادية',
  t99: 'بتجاوب على قد إيه، بإنها توصل لأقل نقطة في منحنى التكلفة',
  t100: 'اللي هي إيه',
  t101: 'مقاس الطلب اللي تكلفة الطلب وتكلفة التخزين مع بعض بيبقوا فيه في أقل نقطة على الإطلاق. معادلة منشورة من سنة 1913 ومستخدمة في مصانع في كل العالم.',
  t102: 'إزاي تستخدمها',
  t103: 'تدخل رقمين مرة واحدة، في الإعدادات: تكلفة طلبية واحدة عندك بكل حاجة فيها، وتقريبا تكلفة تخزين 100 جنيه بضاعة لمدة سنة. في إرشادات لكل الاتنين مكتوبة في الإعدادات. لو غلطت 20% مش هيفرق كتير في الإجابة.',
  t104: 'ليه مهمة',
  t105: 'ده الرقم اللي تقريبا محدش بيحسبه وتقريبا كل الناس بتغلط فيه في الاتجاهين. الطلب الزيادة بيجمد الفلوس. الطلب الناقص بيضيع وقتك وميزانية الشحن. الفرق بين كمية متخمنة والكمية المثالية عادة نسبة مؤثرة من تكلفة مخزونك السنوية.',
  t106: '6',
  t107: 'أقل كمية وتقريب الكراتين',
  t108: 'ميزة صغيرة بتشيل إزعاج يومي',
  t109: 'اللي هي إيه',
  t110: 'أي كمية موصى بيها بتترفع تلقائيا لأقل كمية عند موردك، وتترفع لأقرب كرتونة كاملة.',
  t111: 'إزاي تستخدمها',
  t112: 'رقمين لكل مورد، تدخلهم مرة واحدة.',
  t113: 'ليه مهمة',
  t114: 'بصراحة، دي راحة أكتر منها تغيير جذري. بس هي الفرق بين أداة بتقولك اطلب 67 قطعة، وأداة بتقولك اطلب 72، يعني ست كراتين كاملة، يعني طلبية تقدر تنسخها وتبعتها من غير ما تفكر. الأدوات اللي بتتجاهل ده بتتسيب.',
  t115: '7',
  t116: 'متابعة وضع المخزون',
  t117: 'بيمنع أغلى غلطة في الجداول اليدوية',
  t118: 'اللي هي إيه',
  t119: 'كل قرار بيتاخد على أساس المخزون الموجود زائد اللي في الطريق بالفعل، مش على أساس اللي قدامك بس.',
  t120: 'إزاي تستخدمها',
  t121: 'عمود واحد. لما تطلب، تكتب الكمية في "في الطريق". لما توصل، تنقلها لـ "الموجود".',
  t122: 'ليه مهمة',
  t123: 'من غيرها، ده اللي بيحصل. تطلب. البضاعة في الطريق. تفتح الجدول الأسبوع اللي بعده، المخزون لسه قليل، فتطلب تاني. دلوقتي معاك ضعف المخزون ونص الفلوس، ومش هتلاحظ لمدة تلات أسابيع. دي أكتر غلطة مكلفة شائعة في جداول المخزون اليدوية وممكن تتجنبها تماما.',
  t124: '8',
  t125: 'الرسم البياني للطلب',
  t126: 'تشوف شكل مبيعاتك، مش بس الرقم اللي المحرك طلعه',
  t127: 'اللي هي إيه',
  t128: 'كل منتج ليه رسم بياني خاص بيه: المبيعات الفعلية آخر اتناشر شهر جنب اللي كان متوقع. اتجاه في نمو أو تغير موسمي بتشوفه بنظرة واحدة، مش لازم تدوره جوه عمود أرقام.',
  t129: 'إزاي تستخدمها',
  t130: 'افتح أي منتج من صفحة قرارات الطلب والرسم موجود قدامك على طول. مفيش حاجة تظبطها، بيترسم لوحده من نفس تاريخ المبيعات اللي دخلته.',
  t131: 'ليه مهمة',
  t132: 'الرقم ممكن يكون صح فعلا وبرضه يخبي القصة اللي وراه. الرسم بيمسك حاجات الجدول مايوريهاش: منتج غير شكله من غير ما تلاحظ، قفزة التوقع فوتها، أو تراجع بطيء محدش واخد باله منه شهر بشهر. أسرع طريقة تتأكد إن المحرك نفسه ماشي صح قبل ما تتصرف بناء عليه.',
  t133: 'X · ثابت',
  t134: 'Y · متقلب',
  t135: 'Z · عشوائي',
  t136: 'A<br/>أعلى 80%',
  t137: '<b>AX</b><span>محرك البيزنس بتاعك. مته، ارفع الخدمة لـ 99، وتفاوض على سعر الكمية.</span>',
  t138: '<b>AY</b><span>قيمته عالية بس متقلب. راجعه أسبوعيا، واحتفظ بمخزون أمان أكبر.</span>',
  t139: '<b>AZ</b><span>أصعب خانة. اطلب كميات أصغر وأكتر، وخلي المورد جاهز.</span>',
  t140: 'B<br/>الـ 15% اللي بعدها',
  t141: '<b>BX</b><span>متوسط قوي. مته إعادة الطلب وانساه.</span>',
  t142: '<b>BY</b><span>راجعه شهريا، مخزون أمان معتدل، من غير حاجة درامية.</span>',
  t143: '<b>BZ</b><span>خلي مخزونه أقل حاجة. ماتجريش وراه.</span>',
  t144: 'C<br/>آخر 5%',
  t145: '<b>CX</b><span>اطلبه نادر بكميات كبيرة. مستوى خدمة منخفض مقبول.</span>',
  t146: '<b>CY</b><span>راجعه كل 3 شهور، بأقل مخزون.</span>',
  t147: '<b>CZ</b><span>فلوس قليلة، مستحيل تخطط له. غالبا يستاهل الإيقاف.</span>',
  t148: '9',
  t149: 'خطة الشراء متجمعة حسب المورد',
  t150: 'بتحول قائمة أرقام لطلبية تقدر تبعتها',
  t151: 'اللي هي إيه',
  t152: 'كل منتج محتاج طلب، متجمع تحت المورد بتاعه، مع الإجماليات، شروط الدفع، ومراجعة اختيارية للميزانية.',
  t153: 'إزاي تستخدمها',
  t154: 'تفتح الجدول، تقرا بلوك لكل مورد، تبعت رسالة واحدة. تقدر تحدد ميزانية شراء شهرية وهيحذرك لو التوصيات تعدتها ويقولك مول منتجات الفئة A الأول.',
  t155: 'ليه مهمة',
  t156: 'أي تحليل مايخلصش بقرار بيتسيب خلال شهر. ده الجدول اللي بيحول كل اللي فات لعشر دقايق شغل صبح الإتنين. تحذير الميزانية أهم مما يبدو، لأن أي توصية بتتجاهل وضع فلوسك مش توصية أصلا.',
  t157: '10',
  t158: 'فحص البيانات، طبقة المراجعة',
  t159: 'لأن إجابة غلط بثقة أسوأ من مفيش إجابة',
  t160: 'اللي هي إيه',
  t161: 'جدول بيراجع اللي كتبته قبل ما تثق في أي مخرج. بيدور على تاريخ ناقص، سعر بيع أقل من التكلفة، موردين غير معروفين، مخزون بالسالب، قفزات بيع لمرة واحدة، هوامش ربح ضعيفة، ومنتجات متسجلة ثابتة بس مبيعاتها بتتقلب بوضوح.',
  t162: 'إزاي تستخدمها',
  t163: 'تفتحه بعد أي تعديل. كل صف بيوري واحد من ثلاثة أحكام: لازم يتصلح، راجعه، أو تمام. كل صف فيه مشكلة بيسمي المشكلة بالظبط بلغة واضحة.',
  t164: 'ليه مهمة',
  t165: 'أي أداة توقع في الدنيا مش أحسن من اللي اتكتب فيها، وأغلبها هيطلع بسعادة رقم طلب واثق ومنسق جميل وغلط تماما لو البيانات غلط. الطبقة دي بتمسكه الأول. وكمان أكتر ميزة ممكن توفرلك فلوس في أول أسبوع، لأن تقريبا كل مستخدم جديد عنده مشكلة بيانات واحدة على الأقل مش واخد باله منها.',
  t166: '11',
  t167: 'لوحة متابعة في صفحة واحدة',
  t168: 'حالة بيزنس المخزون بتاعك في خمستاشر رقم',
  t169: 'اللي هي إيه',
  t170: 'الفلوس المجمدة في المخزون دلوقتي، المبيعات وإجمالي الربح المتوقعين سنويا، إجمالي تكلفة تشغيل مخزونك، عدد المنتجات المحتاجة تصرف النهارده، توزيع ABC، معدل دوران المخزون، متوسط أيام التغطية، والقيمة المجمدة في مخزون الزيادة.',
  t171: 'إزاي تستخدمها',
  t172: 'بتحدث نفسها لوحدها. ماتكتبش فيها أبدا.',
  t173: 'ليه مهمة',
  t174: 'رقمين هنا يستاهلوا الاشتراك لوحدهم. معدل دوران المخزون بيقولك مخزونك بيتجدد كام مرة في السنة، وأقل من أربعة معناه فلوسك نايمة. القيمة المجمدة في مخزون الزيادة بتقولك بالظبط قد إيه فلوس تقدر تحررها الشهر ده لو عملت خصم على الحاجة الصح.',
  t175: '12',
  t176: 'الدليل الإرشادي، واللي بييجي كل شهر',
  t177: 'انت بتشتري نظام مستمر، مش تحميلة واحدة',
  t178: 'اللي هي إيه',
  t179: 'دليل منفصل من ست صفحات بياخدك خطوة بخطوة في مثال عملي، ماركة ملابس خيالية، من مساحة عمل فاضية لطلبية شراء جاهزة، مع إجابات كاملة تقدر تراجع نفسك عليها. حوالي 25 دقيقة.',
  t180: 'إزاي تستخدمها',

/* ---------- bilingual rendering ---------- */
var LANG = (function () {
  try {
    var saved = localStorage.getItem('etlob-site-lang');
    if (saved === 'en' || saved === 'ar') return saved;
  } catch (e) {}
  return (navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
})();

function applyLang() {
  var dict = LANG === 'ar' ? SITE_AR : SITE_EN;
  document.querySelectorAll('[data-t]').forEach(function (el) {
    var k = el.getAttribute('data-t');
    if (dict[k] != null) el.textContent = dict[k];
  });
  document.querySelectorAll('[data-t-html]').forEach(function (el) {
    var k = el.getAttribute('data-t-html');
    if (dict[k] != null) el.innerHTML = dict[k];
  });
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('.langbtn').forEach(function (b) {
    b.textContent = LANG === 'ar' ? 'English' : 'العربية';
  });
  try { localStorage.setItem('etlob-site-lang', LANG); } catch (e) {}
}

function toggleLang() {
  LANG = LANG === 'ar' ? 'en' : 'ar';
  applyLang();
}

document.addEventListener('DOMContentLoaded', function () {
  var a = document.getElementById('langBtn'), b = document.getElementById('langBtnM');
  if (a) a.addEventListener('click', toggleLang);
  if (b) b.addEventListener('click', toggleLang);
  applyLang();
});
// Paddle loads with `async`, entirely independent of page load or DOMContentLoaded,
// so a slow or unreachable Paddle CDN can never hold up the rest of the site.
// It is initialized lazily, the first time someone actually clicks a checkout button,
// which in practice is always well after `async` has had time to finish either way.
/* =========================================================================
   CHECKOUT SETUP: fill these in once you have a Paddle account and the
   app itself is deployed. See LAUNCH.md for the exact steps and where each
   value comes from. Nothing below can charge a real card until you do.
   ========================================================================= */
var CHECKOUT_CONFIG = {
  // "sandbox" while testing with Paddle test cards, "production" once you are live.
  environment: "sandbox",
  // Paddle > Developer Tools > Authentication > Client-side tokens. Starts with "test_" in
  // sandbox or "live_" in production. This token is public by design, safe to ship in this file.
  clientToken: "REPLACE_WITH_PADDLE_CLIENT_TOKEN",
  // Paddle > Catalog > Products > each price's ID (looks like "pri_01...").
  // Use the sandbox price IDs while environment is "sandbox", live ones once you flip it.
  priceIds: {
    basic: "REPLACE_WITH_BASIC_PRICE_ID",
    pro:   "REPLACE_WITH_PRO_PRICE_ID",
    store: "REPLACE_WITH_STORE_PRICE_ID"
  },
  // Where Paddle sends the shopper right after payment. Leave as-is unless this file moves.
  successUrl: location.origin + location.pathname + "#thanks",
  whatsapp: "201001234567"
};

function configured(){
  return CHECKOUT_CONFIG.clientToken.indexOf("REPLACE") !== 0;
}
function priceIdFor(tier){
  var id = CHECKOUT_CONFIG.priceIds[tier];
  return id && id.indexOf("REPLACE") !== 0 ? id : null;
}

var toastTimer;
function toast(msg){
  var el = document.getElementById("toast");
  if(!el){
    el = document.createElement("div");
    el.id = "toast"; el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("on"); }, 4200);
}


var paddleReady = false;
function ensurePaddleInitialized(){
  if(paddleReady || !window.Paddle) return;
  if(CHECKOUT_CONFIG.environment === "sandbox"){ Paddle.Environment.set("sandbox"); }
  Paddle.Initialize({
    token: CHECKOUT_CONFIG.clientToken,
    eventCallback: function(e){
      if(e && e.name === "checkout.completed"){ location.hash = "#thanks"; }
    }
  });
  paddleReady = true;
}
function openCheckout(tier, btn){
  if(!configured()){
    toast("Checkout is not connected yet. See LAUNCH.md to finish setup.");
    return;
  }
  if(!window.Paddle){
    toast("Checkout could not load. Check your connection and try again.");
    return;
  }
  var priceId = priceIdFor(tier);
  if(!priceId){
    toast("The " + tier + " plan has no price ID set yet. See LAUNCH.md.");
    return;
  }
  ensurePaddleInitialized();
  if(btn){ btn.classList.add("loading"); }
  Paddle.Checkout.open({
    items: [{ priceId: priceId, quantity: 1 }],
    settings: { successUrl: CHECKOUT_CONFIG.successUrl }
  });
  if(btn){ setTimeout(function(){ btn.classList.remove("loading"); }, 1200); }
}

(function(){
  var pages = ["home","provide","how","proof","pricing","faq","thanks","privacy","terms"];
  function go(name, push){
    if(pages.indexOf(name) === -1) name = "home";
    pages.forEach(function(p){
      var el = document.getElementById("p-"+p);
      if(el) el.classList.toggle("on", p === name);
    });
    document.querySelectorAll(".tab").forEach(function(t){
      t.classList.toggle("on", t.getAttribute("data-go") === name);
    });
    document.getElementById("drawer").classList.remove("open");
    window.scrollTo({top:0, behavior: push ? "smooth" : "auto"});
    if(push && location.hash !== "#"+name){ history.pushState(null,"","#"+name); }
  }
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-go]");
    if(t){ e.preventDefault(); go(t.getAttribute("data-go"), true); return; }
    var c = e.target.closest("[data-checkout]");
    if(c){ e.preventDefault(); openCheckout(c.getAttribute("data-checkout"), c); }
  });
  document.getElementById("menubtn").addEventListener("click", function(){
    document.getElementById("drawer").classList.toggle("open");
  });
  window.addEventListener("popstate", function(){ go((location.hash||"#home").slice(1), false); });
  go((location.hash||"#home").slice(1), false);
})();
</script>
