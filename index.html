<style>
:root{
  --navy:#3B2F26;--navy-2:#4F3A25;--navy-3:#664B30;
  --ink:#221D19;--body:#514A42;--muted:#877F75;--faint:#ACA59D;
  --line:#EEE7DA;--line-2:#F6F1E8;
  --bg:#FFFFFF;--bg-2:#FAF8F4;--bg-3:#F6F2EA;--card:#FFFFFF;
  --accent:#AF773F;--accent-2:#936334;--accent-ink:#FFFFFF;--gold:#B0801F;
  --ok:#65482A;--ok-bg:#E7F5EC;--warn:#664E1A;--warn-bg:#FCF3E1;--bad:#A82219;--bad-bg:#FCEBE9;
  --shadow-s:0 1px 2px rgba(59,47,38,.05),0 2px 8px rgba(59,47,38,.05);
  --shadow:0 2px 4px rgba(59,47,38,.05),0 12px 32px rgba(59,47,38,.08);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Public Sans","IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mx:1140px;--r:12px;
}
html[lang="ar"]{--serif:"IBM Plex Sans Arabic","Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#221B16;--navy-2:#382D24;--navy-3:#3B342D;
  --ink:#F6F2EA;--body:#CEC4BA;--muted:#A39A90;--faint:#8B8278;
  --line:#373430;--line-2:#37302A;
  --bg:#161311;--bg-2:#221D19;--bg-3:#2E2722;--card:#221D19;
  --accent:#D1A87E;--accent-2:#DAB896;--accent-ink:#191410;--gold:#D6A644;
  --ok:#63D394;--ok-bg:#0F2A1C;--warn:#DDB254;--warn-bg:#2A2110;--bad:#F08A80;--bad-bg:#2B1512;
  --shadow-s:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 2px 4px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --navy:#221B16;--navy-2:#382D24;--navy-3:#3B342D;
  --ink:#F6F2EA;--body:#CEC4BA;--muted:#A39A90;--faint:#8B8278;
  --line:#373430;--line-2:#37302A;
  --bg:#161311;--bg-2:#221D19;--bg-3:#2E2722;--card:#221D19;
  --accent:#D1A87E;--accent-2:#DAB896;--accent-ink:#191410;--gold:#D6A644;
  --ok:#63D394;--ok-bg:#0F2A1C;--warn:#DDB254;--warn-bg:#2A2110;--bad:#F08A80;--bad-bg:#2B1512;
  --shadow-s:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 2px 4px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--sans);font-size:16.5px;
  line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--serif);color:var(--ink);line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2.1rem,5.4vw,3.6rem);font-weight:700;letter-spacing:-.025em}
h2{font-size:clamp(1.65rem,3.6vw,2.5rem);font-weight:600;letter-spacing:-.015em}
h3{font-size:1.25rem;font-weight:600}
h4{font-size:1.02rem;font-weight:600;font-family:var(--sans)}
p{margin:0 0 1.05em}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
strong{color:var(--ink);font-weight:600}
.wrap{max-width:var(--mx);margin:0 auto;padding:0 24px}
.narrow{max-width:800px;margin:0 auto}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold);margin:0 0 14px}
.lede{font-size:clamp(1.02rem,1.8vw,1.18rem);color:var(--body)}

/* ---------- NAV ---------- */
.nav{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{max-width:var(--mx);margin:0 auto;padding:12px 24px;display:flex;align-items:center;
  justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0}
.brand svg{flex:0 0 32px}
.brand b{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:1.02rem;
  line-height:1.15;letter-spacing:-.01em}
.brand span{display:block;font-family:var(--sans);font-size:.66rem;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.tabs{display:flex;gap:4px;align-items:center}
.tab{background:none;border:none;font-family:var(--sans);font-size:.92rem;font-weight:500;
  color:var(--body);padding:8px 13px;border-radius:7px;cursor:pointer;transition:.15s;
  white-space:nowrap}
.tab:hover{background:var(--bg-3);color:var(--ink)}
.tab.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);
  font-weight:600}
@media(max-width:1000px){.tabs{display:none}}
.tab.navlogin{color:var(--accent);margin-inline-start:6px;padding-inline-start:16px;border-inline-start:1px solid var(--line)}
.tab.navlogin:hover{color:var(--accent-2);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.drawer .tab.navlogin{border-inline-start:0;border-top:1px solid var(--line);padding-inline-start:12px;margin-inline-start:0;margin-top:6px;padding-top:15px}
.menubtn{display:none;background:none;border:1px solid var(--line);border-radius:7px;
  padding:8px 11px;cursor:pointer;color:var(--ink)}
@media(max-width:1000px){.menubtn{display:block}}
.drawer{display:none;border-top:1px solid var(--line);background:var(--bg);padding:8px 24px 16px}
.drawer.open{display:block}
.drawer .tab{display:block;width:100%;text-align:left;padding:11px 12px;font-size:1rem}

/* ---------- BUTTONS ---------- */
.btn{display:inline-block;padding:13px 26px;border-radius:9px;font-weight:600;font-size:.95rem;
  text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:.16s;
  font-family:var(--sans);text-align:center}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:9px 17px;font-size:.88rem;border-radius:8px}
.btn-lg{padding:16px 34px;font-size:1.02rem}
.onnavy .btn-ghost{color:#fff;border-color:rgba(255,255,255,.34)}
.onnavy .btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.1);color:#fff}

/* ---------- PAGES ---------- */
.page{display:none;animation:fade .34s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
section{padding:78px 0}
section.tight{padding:56px 0}
.alt{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.head{max-width:66ch;margin:0 0 48px}
.head.mid{margin:0 auto 48px;text-align:center}

/* ---------- HERO ---------- */
.hero{background:linear-gradient(168deg,var(--navy) 0%,var(--navy-2) 58%,var(--navy-3) 100%);
  color:#fff;padding:92px 0 100px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-30%;right:-15%;width:70%;height:130%;
  background:radial-gradient(ellipse at center,rgba(209,168,126,.2),transparent 62%)}
.hero::after{content:"";position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:46px 46px;
  mask-image:radial-gradient(ellipse at 20% 0%,#000,transparent 72%)}
.hero .wrap{position:relative;z-index:2}
.hero h1{color:#fff;max-width:16ch;margin-bottom:.4em}
.hero .eyebrow{color:#DEC5AC}
.hero .lede{color:#E2D6CB;max-width:54ch;margin-bottom:32px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-note{margin-top:22px;font-size:.88rem;color:#BBAB9A}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:56px;padding-top:30px;
  border-top:1px solid rgba(255,255,255,.15)}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr);gap:20px}}
.stats b{display:block;font-family:var(--serif);font-size:1.8rem;color:#fff;line-height:1.05;
  margin-bottom:2px}
.stats small{color:#BBAB9A;font-size:.81rem;line-height:1.45;display:block}

/* ---------- GRIDS / CARDS ---------- */
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:940px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:660px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;
  box-shadow:var(--shadow-s);transition:.18s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card h3{margin-bottom:8px}
.card p{margin:0;font-size:.95rem}
.kicker{display:inline-block;font-family:var(--serif);font-size:.82rem;font-weight:700;
  color:var(--gold);letter-spacing:.1em;margin-bottom:14px}
.ico{width:42px;height:42px;border-radius:10px;background:color-mix(in srgb,var(--accent) 11%,transparent);
  display:grid;place-items:center;margin-bottom:16px;color:var(--accent)}

/* ---------- PAIN ---------- */
.pains{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.pains{grid-template-columns:1fr}}
.pain{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:0 var(--r) var(--r) 0;padding:26px 28px}
.pain b{display:block;color:var(--ink);font-size:1.06rem;margin-bottom:7px;font-family:var(--serif)}
.pain p{margin:0;font-size:.95rem}
.verdict{margin-top:26px;text-align:center;font-family:var(--serif);font-size:1.18rem;
  color:var(--ink);max-width:60ch;margin-inline:auto}

/* ---------- FEATURE BLOCKS ---------- */
.feat{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;
  margin-bottom:22px;box-shadow:var(--shadow-s)}
.feat-h{display:flex;gap:18px;align-items:flex-start;padding:28px 30px 4px}
.feat-n{flex:0 0 40px;height:40px;border-radius:10px;background:var(--navy);color:#fff;
  display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:1.02rem}
.feat-h h3{margin:0 0 4px}
.feat-h .sub{font-size:.92rem;color:var(--muted);margin:0}
.feat-b{padding:18px 30px 28px 88px}
@media(max-width:640px){.feat-b{padding:18px 24px 26px}.feat-h{padding:24px 24px 4px}}
.fr{display:grid;grid-template-columns:118px 1fr;gap:16px;padding:13px 0;
  border-top:1px solid var(--line-2)}
@media(max-width:560px){.fr{grid-template-columns:1fr;gap:3px}}
.fr dt{font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding-top:4px}
.fr dd{margin:0;font-size:.96rem}
.fr.use dt{color:var(--accent)}
.fr.why dt{color:var(--gold)}

/* ---------- DIAGRAM ---------- */
.figure{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r);padding:24px;
  margin:26px 0}
.figure svg{display:block;width:100%;height:auto}
.figure figcaption{font-size:.87rem;color:var(--muted);margin-top:14px;text-align:center}

/* ---------- 9 BOX ---------- */
.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);gap:8px;margin:26px 0}
@media(max-width:700px){.matrix{grid-template-columns:auto repeat(3,1fr);font-size:.8rem}}
.mh{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);display:grid;place-items:center;text-align:center;padding:6px}
.mrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);display:grid;place-items:center;padding:6px 10px;writing-mode:horizontal-tb}
.mc{border-radius:9px;padding:14px 13px;border:1px solid var(--line);background:var(--card);
  min-height:96px}
.mc b{display:block;font-family:var(--serif);font-size:1.02rem;color:var(--ink);margin-bottom:4px}
.mc span{font-size:.79rem;line-height:1.45;display:block;color:var(--body)}
.mc.hot{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 34%,transparent)}
.mc.mid{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
.mc.cold{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 26%,transparent)}

/* ---------- TABLE ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:580px;font-size:.93rem}
th,td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg-3);color:var(--ink);font-weight:600;font-size:.76rem;
  text-transform:uppercase;letter-spacing:.07em}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.win{background:var(--ok-bg)}
tr.win td{color:var(--ink);font-weight:600}

/* ---------- STEPS ---------- */
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 30px 58px;margin-left:16px;
  border-left:2px solid var(--line)}
.steps li:last-child{border-left-color:transparent;padding-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:-17px;top:-4px;width:32px;height:32px;
  border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;
  font-size:.85rem;font-weight:700}
.steps b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:5px;font-family:var(--serif)}
.steps p{margin:0;font-size:.96rem}

/* ---------- CALLOUTS ---------- */
.box{border-radius:var(--r);padding:26px 30px;margin:28px 0;border:1px solid var(--line);
  background:var(--bg-2)}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.box .lab{display:block;color:var(--ink);font-weight:600;margin-bottom:9px;font-size:1rem}
.box.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 32%,transparent)}
.box.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 32%,transparent)}
.box ul{margin:0;padding-left:20px}.box li{margin-bottom:8px;font-size:.96rem}

/* ---------- SHEETS ---------- */
.sheets{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;background:var(--card)}
@media(max-width:900px){.sheets{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.sheets{grid-template-columns:1fr}}
.sh{padding:20px 22px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.sh b{display:block;color:var(--ink);font-size:.97rem;margin-bottom:2px}
.sh span{font-size:.87rem;color:var(--muted);line-height:1.5}

/* ---------- PRICING ---------- */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start}
@media(max-width:900px){.tiers{grid-template-columns:1fr;max-width:440px;margin:0 auto}}
.tier{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;
  box-shadow:var(--shadow-s);position:relative}
.tier.best{border:2px solid var(--accent);box-shadow:var(--shadow)}
.badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--accent);
  color:var(--accent-ink);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:6px 15px;border-radius:4px;white-space:nowrap}
.tier h3{font-family:var(--sans);font-size:.78rem;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.price{font-family:var(--serif);font-size:2.7rem;font-weight:700;color:var(--ink);line-height:1}
.price small{font-family:var(--sans);font-size:.9rem;font-weight:500;color:var(--muted)}
.who{font-size:.9rem;color:var(--muted);margin:12px 0 22px;min-height:44px}
.feats{list-style:none;padding:0;margin:0 0 26px}
.feats li{position:relative;padding:9px 0 9px 27px;font-size:.93rem;border-bottom:1px solid var(--line-2)}
.feats li:last-child{border-bottom:none}
.feats li::before{content:"";position:absolute;left:2px;top:16px;width:11px;height:6px;
  border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg)}
.tier .btn{display:block}

/* ---------- FAQ ---------- */
details{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:11px;
  overflow:hidden}
summary{padding:18px 22px;cursor:pointer;font-weight:600;color:var(--ink);font-size:1rem;
  list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.4rem;color:var(--accent);font-weight:400;line-height:1;flex:0 0 auto}
details[open] summary::after{content:"\2212"}
details .ans{padding:0 22px 20px;font-size:.95rem}
details .ans p:last-child{margin-bottom:0}

/* ---------- BAND ---------- */
.band{background:linear-gradient(160deg,var(--navy),var(--navy-3));color:#fff;text-align:center;
  padding:76px 0}
.band h2{color:#fff}
.band p{color:#E2D6CB;max-width:54ch;margin:0 auto 28px}
.band .btn-ghost{color:#fff;border-color:rgba(255,255,255,.34)}

<script>
var SITE_EN = {
  t1: 'Etlob Sa7<span>Demand planning for Egypt</span>',
  t2: 'Home',
  t3: 'What We Provide',
  t4: 'How It Works',
  t5: 'A real example',
  t6: 'Pricing',
  t7: 'FAQ',
  t8: 'Start free trial',
  t9: 'Home',
  t10: 'What We Provide',
  t11: 'How It Works',
  t12: 'A real example',
  t13: 'Pricing',
  t14: 'FAQ',
  t15: 'Built in Cairo for Egyptian brands',
  t16: 'Know exactly what to reorder, and when.',
  t17: 'Many small brands sell well and guess at buying. This removes the guess: how many units to order, from which supplier, on which day, for every product you sell.',
  t18: '<a class="btn btn-primary btn-lg" data-go="pricing" href="#">Start your free trial</a>\n<a class="btn btn-ghost btn-lg" href="/demo/">See the app in action</a>',
  t19: 'Runs in your browser. Arabic and English included. Priced in Egyptian pounds.',
  t20: '<b>95.3%</b><span>2015 forecast accuracy on a real Walmart store, made from 2013 and 2014 only</span>',
  t21: '<b>~10 min</b><small>A typical weekly check once it is set up</small>',
  t22: '<b>18</b><small>Connected pages. You type into five.</small>',
  t23: '<b>2 min</b><small>To sign in. Just your email, no password to remember.</small>',
  t24: 'The problem',
  t25: 'You may be doing both of these at once',
  t26: 'And they are often the same problem wearing two different faces.',
  t27: 'Your best seller keeps running out',
  t28: 'You reorder when the shelf looks low. Your supplier needs three weeks, and you spend them turning away the customers you worked hardest and paid most to win.',
  t29: 'Your worst product is holding your cash hostage',
  t30: 'Stock you bought on a good feeling hasn\'t moved in four months. That is not inventory. It is cash stuck in a box while you can\'t afford to restock what actually sells.',
  t31: 'Both are caused by the same thing: buying decisions made on instinct\n        instead of on your own numbers.',
  t32: 'What this is',
  t33: 'Not a stock counter. A purchasing brain.',
  t34: 'Tracking what you already have is the input. The product is the decision at\n          the end of it.',
  t35: '01',
  t36: 'It forecasts demand instead of averaging it',
  t37: 'Separates real seasonality from randomness, so a winter product is not marked unpredictable just for selling in winter. Then it follows recent growth or decline and projects forward, not backward.',
  t38: '02',
  t39: 'It makes the reorder decision for you',
  t40: 'An exact reorder level per product, from how fast it sells, how unpredictable it is, your supplier\'s lead time and how often they are late. Then the cheapest order size, rounded to what the supplier accepts.',
  t41: '03',
  t42: 'It shows you where your money actually is',
  t43: 'Every product ranked by revenue and predictability, with a specific instruction for each combination. Your steady top earner and your erratic top earner are never managed the same way.',
  t44: '04',
  t45: 'It hands you a purchase order you can send today',
  t46: 'Recommendations grouped by supplier, so you send one combined order, not one message per product. Plus a one page dashboard: cash tied up, projected profit, and what needs action this morning.',
  t47: '<a class="btn btn-ghost" data-go="provide" href="#">See every feature explained in detail</a>',
  t48: 'The core idea',
  t49: 'Ordering is a trade-off with a correct answer',
  t50: 'Very few orders, so the hassle and shipping cost per order almost disappear. But you sit on a mountain of stock: paying rent on it, unable to spend that money, watching it go out of style.',
  t51: 'You barely hold any stock. But you pay the full cost of placing an order every few days, and one late delivery empties you.',
  t52: '<strong>Exactly one order size makes the two costs added together the lowest.</strong> It differs for a 40 EGP bracelet and a 480 EGP jacket, because holding the jacket costs twelve times more per unit. Across thirty products, nobody can work that out by feel.',
  t53: 'That calculation is the whole reason this app exists. Everything else is scaffolding around it.',
  t54: 'Stop guessing what to buy',
  t55: 'Free trial on every plan. Charged only when it ends. Cancel any time before.',
  t56: '<a class="btn btn-primary btn-lg" data-go="pricing" href="#">See pricing</a>\n<a class="btn btn-ghost btn-lg" data-go="proof" href="#">Read the evidence first</a>',
  t57: 'What we provide',
  t58: 'Everything you need to buy stock with confidence',
  t59: 'You fill in five pages. Everything else is worked out for you, in Arabic or English.',
  t60: '1',
  t61: 'Seasonal separation',
  t62: 'What a basic spreadsheet template usually leaves out',
  t63: 'What it is',
  t64: 'Before measuring anything, each month\'s sales are\n          divided by that month\'s seasonal index. A December that normally runs 80% above average\n          gets divided by 1.8, putting every month on a comparable footing.',
  t65: 'How you use it',
  t66: 'You pick one shape per product from a dropdown:\n          Winter Peak, Summer Peak, Ramadan and Eid, or Flat. That is the entire interaction. You\n          can edit the twelve numbers behind any shape if you want to, but most people never need\n          to.',
  t67: 'Why it matters',
  t68: 'Without this, a wool scarf selling 95 in December and 3 in June looks wildly unpredictable, so the system would hold a large, expensive safety buffer to protect you. But a scarf is not unpredictable. It is a scarf. Taking the season out first keeps that buffer at the size the product actually needs.',
  t69: '2',
  t70: 'Demand forecasting with trend detection',
  t71: 'Answers what is about to happen, not what typically happened',
  t72: 'What it is',
  t73: 'It compares the average of your most recent three\n          months against your earliest three and measures the slope between them, then projects that\n          forward and reapplies the season on top.',
  t74: 'How you use it',
  t75: 'You do nothing. You type twelve months of unit\n          sales and it appears. There is an on and off switch in Settings if you ever want to\n          disable it.',
  t76: 'Why it matters',
  t77: 'A flat average quietly under-orders every\n          growing product, forever. If a product is climbing by 3 units a month, an average of the\n          last twelve months is already about eighteen units behind reality by the time you use it.\n          That gap is exactly where stockouts on your rising stars come from, which are the most\n          expensive stockouts you can have.',
  t78: '3',
  t79: 'Safety stock that accounts for your supplier, not just your sales',
  t80: 'The part that is easy to leave out',
  t81: 'What it is',
  t82: 'Safety stock covers two separate risks at once: your\n          sales running hotter than forecast during the wait, and your supplier arriving late. Both\n          are calculated and combined properly, per product.',
  t83: 'How you use it',
  t84: 'One number per supplier. If they usually take\n          21 days but you have seen 16 and you have seen 26, you enter 4. A rough rule is in the\n          file: worst delay minus best delay, divided by four.',
  t85: 'Why it matters',
  t86: 'Many simple templates only cover the sales half, so a stockout caused by a supplier being a week late is invisible to them. Covering both also brings out a useful, counterintuitive point: a reliable slow supplier can be cheaper to stock for than an unreliable fast one. Once that is a number in front of you, it becomes leverage in a negotiation.',
  t87: '4',
  t88: 'Reorder point',
  t89: 'Answers when. Not at zero, and not at a round number you invented.',
  t90: 'What it is',
  t91: 'A stock level per product. Reach it, place the order.\n          It equals your daily sales multiplied by your supplier\'s lead time, plus safety stock.',
  t92: 'How you use it',
  t93: 'You do not calculate anything. The Order\n          Decisions page shows a coloured verdict per product: order today, order this week, stock is\n          healthy, or overstocked. Red, amber, green, blue. Under each one, a plain sentence explains exactly why.',
  t94: 'Why it matters',
  t95: 'Waiting until a product is nearly gone\n          guarantees a gap, because the supplier still needs their lead time after you notice. The\n          reorder point is the exact amount of stock that carries you through that wait and no more.\n          Ordering at the right level is worth more than ordering the right quantity.',
  t96: 'Stock falls as you sell. At the reorder point you order, and what is left carries you until the delivery arrives. Safety stock is the cushion for bad weeks.',
  t97: '5',
  t98: 'Economic order quantity',
  t99: 'Answers how much, by finding the bottom of the cost curve',
  t100: 'What it is',
  t101: 'The order size where your ordering costs and your\n          holding costs added together are at their absolute minimum. It is a published formula from\n          1913 and it is used in factories worldwide.',
  t102: 'How you use it',
  t103: 'You enter two numbers once, in Settings: what\n          placing one order costs you all in, and roughly what it costs to hold 100 EGP of stock for\n          a year. Guidance for both is written into Settings. Being 20% off on these barely changes\n          the answer.',
  t104: 'Why it matters',
  t105: 'This is a number that is rarely calculated and easy to get wrong in both directions. Over-ordering freezes cash. Under-ordering burns your time and shipping budget.',
  t106: '6',
  t107: 'Supplier minimums and carton rounding',
  t108: 'A small feature that removes a daily irritation',
  t109: 'What it is',
  t110: 'Every recommended quantity is automatically raised to\n          your supplier\'s minimum order and rounded up to a whole carton.',
  t111: 'How you use it',
  t112: 'Two numbers per supplier, entered once.',
  t113: 'Why it matters',
  t114: 'Honestly, this one is convenience rather than transformation. But it is the difference between a tool that tells you to order 67 pieces and one that tells you to order 72, which is six full boxes, which is an order you can copy and send without thinking about it.',
  t115: '7',
  t116: 'Inventory position tracking',
  t117: 'Prevents the single most expensive spreadsheet mistake',
  t118: 'What it is',
  t119: 'Every decision is made against stock on hand plus\n          stock already on order, never against what is physically in front of you.',
  t120: 'How you use it',
  t121: 'One column. When you place an order, type the\n          quantity into Stock On Order. When it arrives, move it to Stock On Hand.',
  t122: 'Why it matters',
  t123: 'Without it, here is what can happen. You order. The goods are in transit. You check the sheet next week, stock on hand is still low, so you order again. Now you have double the stock and half the cash, and you may not notice for weeks. It is an easy and expensive mistake in a home made spreadsheet, and it is preventable.',
  t124: '8',
  t125: 'Demand graphs',
  t126: 'See the shape of your sales, not just the number the engine outputs',
  t127: 'What it is',
  t128: 'A line graph of each product\'s actual monthly sales, with the forecast continuing as a dotted line and a mark showing when it will hit its reorder point. Products selling at a similar level share a graph, up to five each, so the lines stay readable even for a big catalogue.',
  t129: 'How you use it',
  t130: 'Open the Demand graphs page. Nothing to build or configure, it draws itself from the same sales history you already entered.',
  t131: 'Why it matters',
  t132: 'A number can be technically correct and still hide the story behind it. A line shows it: which products are climbing, which are fading, which have a season, and which are about to need an order. Your best sellers and your dying ones are obvious at a glance.',
  t133: 'X · steady',
  t134: 'Y · variable',
  t135: 'Z · erratic',
  t136: 'A<br/>top 80%',
  t137: '<b>AX</b><span>Your engine. Automate it, push service to 99, negotiate volume pricing.</span>',
  t138: '<b>AY</b><span>High value, swings. Review weekly, hold a fuller buffer.</span>',
  t139: '<b>AZ</b><span>The hardest box. Order smaller and more often, keep the supplier warm.</span>',
  t140: 'B<br/>next 15%',
  t141: '<b>BX</b><span>Solid mid-tier. Automate the reorder and forget it.</span>',
  t142: '<b>BY</b><span>Review monthly, moderate buffer, nothing dramatic.</span>',
  t143: '<b>BZ</b><span>Keep minimum stock. Do not chase it.</span>',
  t144: 'C<br/>last 5%',
  t145: '<b>CX</b><span>Order rarely in large batches. Low service level is fine.</span>',
  t146: '<b>CY</b><span>Quarterly review, minimal stock.</span>',
  t147: '<b>CZ</b><span>Small money, impossible to plan. Usually worth discontinuing.</span>',
  t148: '9',
  t149: 'Purchase plan grouped by supplier',
  t150: 'Turns a list of numbers into an order you can send',
  t151: 'What it is',
  t152: 'Every product that needs ordering, collected under the\n          supplier it comes from, with totals, payment terms, and an optional budget check.',
  t153: 'How you use it',
  t154: 'Open the page, read one block per supplier,\n          send one message. You can set a monthly purchase budget and it will warn you when the\n          recommendations exceed it and tell you to fund your class A products first.',
  t155: 'Why it matters',
  t156: 'Analysis is only useful if it ends in an action. This is the page that turns everything above it into a short piece of work each week. The budget warning matters more than it sounds, because recommendations that ignore your cash position are not much use.',
  t157: '10',
  t158: 'Health Check, the data audit layer',
  t159: 'Because a confident wrong answer is worse than no answer',
  t160: 'What it is',
  t161: 'A page that audits your own inputs before you trust\n          any output. It checks for missing history, selling price below cost, unknown suppliers,\n          negative stock, one-off sales spikes, thin margins, and products marked as flat whose sales\n          clearly swing.',
  t162: 'How you use it',
  t163: 'Open it after any change. Every row shows one\n          of three verdicts: FIX THIS, REVIEW, or GOOD. Each problem row names the specific problem\n          in plain language.',
  t164: 'Why it matters',
  t165: 'Any forecast is only as good as the data typed into it, and bad data can produce a confident, completely wrong order quantity. This layer looks for those problems first. It is worth running on your first day, because a first round of data entry often has a mistake or two.',
  t166: '11',
  t167: 'One page dashboard',
  t168: 'The state of your inventory business in fifteen numbers',
  t169: 'What it is',
  t170: 'Cash tied up in stock right now, projected annual\n          revenue and gross profit, your total inventory operating cost, how many products need\n          action today, your ABC split, inventory turnover, average days of cover, and the value\n          currently locked in overstock.',
  t171: 'How you use it',
  t172: 'It updates itself. You never type into it.',
  t173: 'Why it matters',
  t174: 'Two numbers here are especially useful. Inventory turnover tells you how many times your stock cycles per year, and under four is a common sign that cash is sitting still. Value locked in overstock shows how much money is held in stock beyond your overstock limit, which you could free up by discounting the right things.',
  t175: '12',
  t176: 'The guided walkthrough, and what comes next',
  t177: 'You are buying an ongoing system, not a download',
  t178: 'What it is',
  t179: 'A worked example built into the app. One click loads a fictional clothing brand, and the walkthrough tells you exactly which number you should see on each page, from an empty shop to a finished purchase order, so you can check you did it right. About 15 minutes.',
  t180: 'How you use it',
  t181: 'Open the Guided walkthrough page after you sign in, load the practice shop, and check each page against the answer key. When you are done, clear it and enter your own shop.',
  t182: 'Why it matters',
  t183: 'A tool nobody explains tends to get abandoned. Beyond the core, Pro adds custom season shapes, supplier comparison, the supplier scorecard and the cash flow forecast; Store adds demand graphs with the reorder timeline, profit at risk and the dead stock report. Everyone on a plan gets each new tool for that plan the day it ships, and your own workspace and data stay exactly where you left them even if you cancel.',
  t184: 'Also included',
  t185: 'Eighteen connected pages',
  t186: 'You type into five of them. The other thirteen do the work, some unlocking on Pro and Store.',
  t187: '<b>Start Here</b><span>Setup order, verdict legend, and an honest list of what the app cannot do</span>',
  t188: '<b>Dashboard</b><span>Cash, profit, turnover and today\'s action list on one page</span>',
  t189: '<b>Settings</b><span>Ordering cost, holding cost, overstock limit, budget, and starting each new month</span>',
  t190: '<b>Seasons</b><span>Winter, summer, Ramadan and Eid, or flat. Editable on Pro and Store.</span>',
  t191: '<b>Suppliers</b><span>Lead times, variation, minimums, carton sizes, payment terms</span>',
  t192: '<b>Products</b><span>Up to three years of sales, costs, prices, service target, stock on hand and in transit</span>',
  t193: '<b>Demand Forecast</b><span>Demand with the season removed, recent direction, variability class, forecast</span>',
  t194: '<b>Order Decisions</b><span>Safety stock, reorder point, quantity, and a plain verdict</span>',
  t195: '<b>Demand Graphs</b><span>Real sales lines per product, the forecast, and reorder timing. Store.</span>',
  t196: '<b>Purchase Plan</b><span>Orders grouped by supplier with totals and budget check</span>',
  t197: '<b>Health Check</b><span>Audits your data and flags anything that would produce a wrong order</span>',
  t420: '<b>Supplier Scorecard</b><span>Rates each supplier on reliability. Pro and Store.</span>',
  t421: '<b>Stockout Cost Estimator</b><span>What a stockout on this product would actually cost you. Store.</span>',
  t422: '<b>Dead Stock Report</b><span>What is not moving and how much cash it is holding hostage. Store.</span>',
  t423: '<b>Cash Flow Forecast</b><span>What your planned orders will cost and when. Pro and Store.</span>',
  t198: '<b>Guided Walkthrough</b><span>Built into the app, with a full answer key</span>',
  t199: '<a class="btn btn-primary" data-go="pricing" href="#">Start your free trial</a>',
  t200: 'How it works',
  t201: 'Set up once in an afternoon. Ten minutes a week after that.',
  t202: 'No software to install, nothing to connect to your shop. You sign in with your\n          email and type in numbers you already have.',
  t203: 'Setting up, about two hours once',
  t204: 'Enter two numbers in Settings',
  t205: 'What it costs you to place one order, all in, including your own time. And roughly what\n            it costs to hold 100 EGP of stock for a year. Both have written guidance and typical\n            Egyptian ranges on the Settings page. Rough is fine.',
  t206: 'List your suppliers',
  t207: 'How many days each one actually takes, how much that varies, their minimum order, their carton size, and their payment terms. One row each.',
  t208: 'Enter your products',
  t209: 'At least twelve months of unit sales per product (two years or more lets the app learn your seasons), cost, price, stock on hand, stock already on order, your target service level, and which seasonal shape it follows. This is the only part that takes real time, and it is once.',
  t210: 'Run the Health Check',
  t211: 'Before trusting anything. It tells you which rows have problems and exactly what is\n            wrong with them. Expect a few on your first pass. That is normal and it is the point.',
  t212: 'Read your first order decision',
  t213: 'Open Purchase Plan. Send the orders. That is the system working.',
  t214: 'Every Monday, ten minutes',
  t215: 'Count stock and update On Hand. Update On Order for anything you have paid for. Open Order\n        Decision, read the coloured verdicts, and send whatever Purchase Plan tells you to send.',
  t216: 'Start of each month, fifteen minutes',
  t217: 'Press Start a new month in Settings, type last month\'s sales into the new column, and re-run the Health Check.',
  t218: 'Every quarter, half an hour',
  t219: 'On Store, look through the demand graphs for anything that surprised you this quarter. Check the Dead Stock Report and discount or discontinue whatever has stopped moving. Revisit your seasonal profiles if a product changed shape.',
  t220: 'What you need before you start',
  t221: 'At least twelve months of unit sales per product, two years if you have them. Not revenue, units.',
  t222: 'Your cost and selling price per product.',
  t223: 'A rough idea of how long each supplier takes, and how much they vary.',
  t224: 'A current stock count. Actual counted, not estimated.',
  t225: 'Two data habits that matter more than any formula',
  t226: '<strong>A month you were out of stock is not a month of low demand.</strong> Leave it\n          blank rather than entering 0, or you teach the system that nobody wanted it.',
  t227: '<strong>Strip out one-off distortions before entering.</strong> A\n          viral week, a single wholesale order, an influencer drop. Left in, they will inflate your\n          orders for a full year.',
  t228: 'The evidence',
  t229: 'Tested against how people actually order',
  t230: 'We would rather show you the method and the limits than make a claim you\n          cannot check.',
  t231: 'The simulation',
  t232: 'Two years of daily trading, an eight product catalogue, thirty independent runs. Every ordering method got the exact same random demand and the same random supplier delays. Both learning methods re-planned every 30 days using only the sales they had seen so far, exactly like a real user.',

  t260: '142,079',
  t261: 'All figures in EGP. Total cost\n        combines ordering cost, holding cost, and the gross margin lost to stockouts. The system beat\n        gut feel in 30 runs out of 30, and beat the standard template in 29 out of 30.',
  t262: 'The result that actually matters',
  t263: 'Read fill rate and stock held together. Anyone can raise service by buying more stock: the standard template held 163,866 EGP of stock to reach 98.2%. Reaching a higher 99.4% while holding less stock is the part that needs the maths. That difference is the product.',
  t264: 'How the app itself was verified',
  t265: 'This simulation was run against the original spreadsheet model. Since then the same\n        calculation engine was rebuilt for the web app and tested again, independently, before\n        anyone could sign up:',
  t266: 'Every formula was checked against a hand worked calculation, and against dozens of edge\n          cases: an empty workspace, a product with one month of data, zero cost, price below cost,\n          missing suppliers, negative stock, no suppliers at all, and a fully loaded catalogue.',
  t267: 'Bad data cases were tested to confirm the Health Check actually catches problems rather\n          than silently producing confident nonsense.',
  t268: 'Sign in, subscription access, and every page were driven end to end in a real browser\n          before launch, in both languages.',
  t269: 'Three real issues were found and fixed this way: two of the built in season shapes did\n          not average out to a neutral 1.0 across the year, which was quietly skewing order sizes for\n          those products; a revenue-ranking edge case could leave a shop with no top tier product at\n          all; and the one-off spike check was flagging ordinary steady products. A clean interface\n          proves the buttons work. It does not prove the numbers are right, which is why this gets\n          checked separately every time something changes.',
  t270: 'Honesty',
  t271: 'What this system is not',
  t272: 'Better you hear it from us now.',
  t273: '<strong>Decision support, not a guarantee.</strong> It cannot predict a supplier vanishing or a shipment stuck at customs.',
  t274: '<strong>A brand new product cannot be forecast.</strong> Order it on judgement for its first six months.',
  t275: '<strong>Under 12 months of history, season adjustment stays off.</strong> Under six months, the Health Check tells you not to rely on it.',
  t276: '<strong>Seasons are learned from two years of sales.</strong> With one year, you pick the season shape, because one lucky December is not a season.',
  t277: '<strong>Erratic products stay expensive.</strong> Sales with no pattern need a large safety buffer, and that costs money.',
  t278: '<strong>No accounting, POS, barcode scanning or multi-location stock.</strong> It plans; you keep counting stock your usual way.',
  t279: '<strong>It is only as good as what you type in.</strong> That is why the Health Check exists.',
  t280: 'Pricing',
  t281: 'Monthly or yearly. Stop renewal whenever you like.',
  t282: 'Every plan includes the full system, both languages, the guided walkthrough, and new tools as they are added. Fourteen days free on Basic and Pro, five days on Store.',
  t283: 'Prices are in Egyptian pounds, paid by card through Paymob. A yearly plan costs ten months: two months free.',

  t319: 'Your workspace is kept even if you cancel, so everything is exactly as you left it if you come back.',
  t320: 'Questions',
  t321: 'Before you buy',
  t322: 'Do I need to understand any of the maths?',
  t323: 'No. You enter your sales history, your costs and your supplier details.\n          The system gives you plain instructions: order today, order this week, you are covered, or\n          you are overstocked. The included walkthrough explains every concept in ordinary language\n          if you want to understand what is happening underneath, and many people do after a month\n          or two.',
  t324: 'I sell on Instagram, not a website. Does that matter?',
  t325: 'Not at all. It does not connect to any platform. It works from your\n          sales numbers, wherever those sales happened. Instagram, WhatsApp, a physical shop, a\n          marketplace, or all four at once.',
  t326: 'What if I only have six or eight months of history?',
  t327: 'It still works. Seasonal adjustment switches itself off automatically and\n          the Health Check tells you clearly that results are rougher. Below six months for a given\n          product, the honest answer is that no forecasting method is reliable, and the system says\n          so rather than pretending.',
  t328: 'Do I need to install anything?',
  t329: 'No. It runs in your browser, on your phone or your computer, the same way\n          a website does. There is nothing to download and nothing to keep updated yourself. You do\n          need an internet connection while you use it, since your numbers are calculated on our\n          servers and saved to your account as you type.',
  t330: 'Arabic or English?',
  t331: 'Both are included with every plan at no extra cost. The Arabic version is\n          fully right to left and built around EGP.',
  t332: 'How many products can it handle?',
  t333: 'Basic covers up to 15 products and 10 suppliers, with the four built in season shapes fixed as they are. Pro covers up to 50 products, Store up to 200, both with up to 100 suppliers and your own custom season shapes.',
  t334: 'What new tools are coming?',
  t335: 'New tools and improvements as they are built, plus any corrections. Pro adds custom season shapes, supplier comparison, the supplier scorecard and the cash flow forecast; Store adds demand graphs with the reorder timeline, profit at risk and the dead stock report. Everyone gets each tool in their plan the day it ships. If you cancel, your workspace is kept and waiting for you if you come back later.',
  t336: 'Can I cancel easily?',
  t337: 'Yes, any time: in the app, open Settings, then Plan and billing, and press Stop renewal. Nothing more is charged, and you keep access until the end of the month or year you paid for. After that the app pauses and your data stays saved. Or message us on WhatsApp and we do it for you.',
  t338: 'How is this different from the free templates online?',
  t339: 'Free templates record what you already have. They do not forecast demand, do not calculate safety stock from your supplier\'s actual reliability, do not separate seasonality from randomness, and do not respect minimum order quantities. Those are precisely the parts that change what you buy. The real store tests on this page show how the app does on actual sales.',
  t340: 'Will this work for a service business or for made to order products?',
  t341: 'Not really, and we would rather say so. This is built for businesses\n          holding physical stock they buy in and resell. If you make to order, the reorder logic does\n          not apply to your finished goods, though it can still be useful for raw materials and\n          components.',
  t342: 'Who can see my business data?',
  t343: 'Only you. Each account gets its own private workspace that nobody else\n          can open, including other subscribers. You sign in with a one time code sent to your own\n          email, and your account works on up to two devices at a time. Nobody at Etlob Sa7 looks at\n          your numbers as part of running the product.',
  t344: 'What if I get stuck?',
  t345: 'Message us directly on WhatsApp, the number is right there in the app once you are\n          signed in. The guided walkthrough tutorial included with every plan also covers most of\n          what trips people up.',
  t346: 'Ready to stop guessing?',

  t415: 'Privacy policy',
  t416: 'Terms and conditions',
  t417: 'Results on this site come from tests on real public sales data (the Walmart M5 dataset) with the assumptions stated next to them, not from audited customer accounts. This product is decision support for inventory purchasing. It does not guarantee any business outcome.',

  t635: 'The delivery lands while the safety stock is untouched. Never empty, never overstocked.',

  t641: 'App, whole year forecast made in December 2014',
  t640: 'The same formulas were also checked on all ten M5 stores, two years each (20 store-years), so they are not tuned to the two stores shown.',
  t642: 'Range the app gave in advance (built so about 8 in 10 months land inside)',
  t643: 'Expected range',
  t644: '<td class="pf">Expected range, each month of 2015</td><td>Low and high for each month, made Dec 2014</td><td>Real monthly sales</td><td class="pacc"><b>10 of 12 months inside</b><span class="pbar"><i style="--w:83.3%"></i></span></td>',
  t645: '<td class="pf">Expected range, each month of 2015</td><td>Low and high for each month, made Dec 2014</td><td>Real monthly sales</td><td class="pacc"><b>11 of 12 months inside</b><span class="pbar"><i style="--w:91.7%"></i></span></td>',
  t646: '<strong>Why the lines do not match month by month.</strong> This store\'s monthly ups and downs did not repeat from one year to the next, and no forecast can predict a bump that never happened before. Prices barely moved (under 1%), and the data does not record promotions, events or weather. What the app did: it came within 4.7% of the real year, and 10 of 12 real months landed inside its range. In a shop whose busy months repeat, such as Ramadan, Eid, school season or winter, it learns that pattern and follows it.',
  t647: 'It learns your shop',
  t648: 'It learns from your own shop as you use it.',
  t649: '<b>Your seasons</b><span>Give it two years of sales and it finds each product\'s own busy and quiet months, and leans on it only as much as your two years agree.</span>',
  t650: '<b>Your suppliers\' real delivery times</b><span>Mark orders received and it learns how long each supplier really takes, then uses that in every reorder point.</span>',
  t651: '<b>How right it has been</b><span>Each new month you enter is checked against what it forecast, so you see its real accuracy on your own shop.</span>',
  t652: 'On every plan. You can see what it has learned on the dashboard.',
  t653: 'Method: the same as test 1. The app was given 2013 and 2014 only, then used week by week through 2015, with 40 hobby and household products picked at random (fixed seed) from those that sold in every month of 2013 and 2014, three assumed suppliers (7, 14 and 21 days, with random delays) and a cost of 55% of shelf price. Averages of 40 runs, each run scored on its own. Results are in US dollars.',
  t655: '<td class="pf">Gross profit for 2015</td><td>41,700 USD</td><td>40,900 USD</td><td class="pacc"><b>98.1%</b><span class="pbar"><i style="--w:98.1%"></i></span></td>',
  t684: 'Hi, I have a question about Etlob Sa7.',
  t683: 'Chat with us on WhatsApp',
  t682: 'Every Sunday morning, an email with what to order this week, what is coming up, and what the app has learned about your shop, made from your saved data. Turn it off in Settings or from the link in the email.',
  t681: 'What is the Sunday summary?',
  t680: 'Yes. After a 14-day trial we email you 7 days before the first payment, with a link to stop renewal online. Store\'s 5-day trial is reminded the day after it starts. Yearly plans get an email 7 days before each renewal.',
  t679: 'Will you remind me before charging my card?',
  t678: 'The first 30 shops to make a payment keep the price they started on for as long as they stay subscribed, even if our prices go up later. If a plan runs out, the founding price ends with it. The pricing section shows how many places are left.',
  t677: 'What is the founding offer?',
  t676: 'Yes. Pay for ten months and get twelve: Basic 12,950, Pro 28,500 and Store 54,400 EGP a year. The free trial is the same, and we email you 7 days before each yearly renewal.',

  t560: 'Every test so far',
  t559: 'Source: M5 Forecasting Accuracy competition data, store WI_2 (Wisconsin): Makridakis, Spiliotis and Assimakopoulos, University of Nicosia (M Open Forecasting Center), with data provided by Walmart; Kaggle, 2020, <a href="https://www.kaggle.com/c/m5-forecasting-accuracy" target="_blank" rel="noopener">kaggle.com/c/m5-forecasting-accuracy</a>. Method paper: <a href="https://doi.org/10.1016/j.ijforecast.2021.11.013" target="_blank" rel="noopener">International Journal of Forecasting, 2022</a>. Copy used: the <a href="https://github.com/Nixtla/m5-forecasts" target="_blank" rel="noopener">Nixtla public mirror</a>. Used under the Kaggle competition rules: only results are shown here, never the raw data. Same method as test 1. Not affiliated with or endorsed by Walmart.',
  t558: '<strong>Plainly:</strong> two results stay under 80%: the predictability class (40.0% exact, never more than one class off) and growing or shrinking (55%). This store\'s sales fell 20.5% from 2013 to 2014, then rose 5.2% in 2015. The app planned from the lower, more recent level, so its whole year forecast came in 8% under the real year, but 11 of 12 months still landed inside its range and 99.8% of real demand was served from stock. Profit at risk was 87.7% right here, and 89.9% across all 20 store-years.',

  t503: '<b>Supplier scorecard and cash flow<em>Pro, Store</em></b><span>Rates each supplier\'s reliability, shows which is cheapest for a product over a year, and forecasts what your planned orders will cost and when.</span>',
  t502: '<b>One page dashboard</b><span>Cash tied up in stock, profit ahead, turnover, and what needs action today.</span>',
  t501: '<b>Health check</b><span>Catches data mistakes, like a price below cost or negative stock, before they cause a wrong order.</span>',
  t500: '<b>Ordered stock and upcoming orders</b><span>Type in what you ordered and see what arrives next; mark it received and stock updates itself while each supplier\'s real delivery time is learned.</span>',
  t499: '<b>Purchase plan by supplier</b><span>One ready order per supplier, with totals and a budget check, sent to WhatsApp in one tap.</span>',
  t498: '<b>No double orders</b><span>Every decision counts stock already on its way, so you never reorder what is in transit.</span>',
  t497: '<b>Best order size</b><span>The quantity that keeps ordering and storage costs lowest, rounded to your supplier\'s minimum and carton.</span>',
  t496: '<b>Reorder point</b><span>The exact stock level to order at, so new stock lands before you run out.</span>',
  t495: '<b>Safety stock for sales and suppliers</b><span>A buffer per product sized for both busier weeks and late suppliers.</span>',
  t494: '<b>Follows recent sales</b><span>Leans most on your latest months, so the forecast keeps up when a product speeds up or slows down.</span>',
  t493: '<b>Season-aware forecasts</b><span>Removes each product\'s normal seasonal swing, then forecasts the next three months and the whole year.</span>',

  t467: 'We took real daily sales from a Walmart store in California, from the public M5 dataset: 40 hobby and household products, 2013 to 2015. The app saw only 2013 and 2014, then planned 2015. Here is what it predicted next to what the store really sold.',

  t471: 'Accuracy',
  t472: '<strong>Where it falls short.</strong> Two results stay under 80%: the predictability class (72.5% exact, never more than one class off) and whether a product grows or shrinks next year (57.5%, close to a coin toss, so the app shows it as last year\'s direction, not a promise). Each product month by month is 80.3%, about the same as a three month average (79.0%), because single products sell in lumps. For the whole store month by month, repeating last year did slightly better here (93.4% against 92.2%); in Wisconsin the app did better (94.5% against 93.8%), and across all 20 store-years too (92.8% against 85.1%).',
  t473: 'Method: the app was given 2013 and 2014 only, then used week by week through 2015. The 40 products were picked at random (fixed seed) from hobby and household products that sold in every month of 2013 and 2014. The data has no suppliers or product costs, so three suppliers (7, 14 and 21 days, with random delays) and a cost of 55% of shelf price are assumed. The app learns each product\'s season from its own two years and the whole shop\'s, and leans on it only as much as the two years agree; with less than two years it falls back to the closest built-in season shape. The owner checks the app every Sunday and orders exactly what it says. Averages of 40 runs, each run scored on its own. Results are in US dollars.',

  lg_privacy_eb: "Legal",
  lg_privacy_h: "Privacy policy",
  lg_privacy_d: "Last updated 3 October 2026.",
  lg_privacy_0: "Who we are",
  lg_privacy_1: "Etlob Sa7 (\"we\", \"us\") runs the website etlobsa7.com and the Etlob Sa7 app. This policy explains what personal information we collect, why, who helps us process it, how long we keep it, and the choices you have. Our business details are at the end of this page.",
  lg_privacy_2: "What we collect, and why",
  lg_privacy_3: "We only collect what the service needs to work:",
  lg_privacy_4: "<li><strong>Your email address</strong>: to create your account, send your sign-in codes, send notices about your trial and payments (including reminders before a charge), and, unless you turn it off, a Sunday summary of your own shop's numbers. Turn the summary off in the app's Settings or from the link in each one.</li><li><strong>Your preferences</strong>: the language you use the app in, so our emails match it; whether the Sunday summary is on; and, if you stop renewal and choose to tell us, the reason you picked and any note you wrote.</li><li><strong>Your name and mobile number</strong>: entered when you add a card. Paymob, our payment company, needs them to process card payments. We keep them to fill in the payment form for you next time.</li><li><strong>Plan and billing records</strong>: your plan, trial and paid-until dates, Paymob order, transaction and subscription numbers, amounts, and whether each payment worked. We need these to give you access and to keep proper billing records.</li><li><strong>The business data you type into the app</strong>: products, sales history, suppliers, costs, prices and orders. It is yours. We use it only to run the app for you.</li><li><strong>Security records</strong>: when a sign-in code was sent, when you signed in and how many times, and payment events, linked to your email. Sign-in codes and session keys are stored only as one-way scrambled values (hashes), never in readable form. We use these records to keep accounts safe, stop abuse and fix problems.</li><li><strong>Standard server logs</strong>: like most websites, our hosting providers record technical details of each request, such as IP address, time and browser type, for security and to keep the service running.</li>",
  lg_privacy_5: "We do not collect your card number (you type it on Paymob's page, not ours), your location, or your contacts. We do not use analytics, advertising or tracking tools, and we do not sell or rent personal data.",
  lg_privacy_6: "Why we are allowed to use it",
  lg_privacy_7: "We use your information to provide the service you sign up for, with the consent you give when you start a trial or a plan, to keep the service secure, and to meet legal and accounting duties. We aim to handle personal data in line with Egypt's Personal Data Protection Law (Law No. 151 of 2020).",
  lg_privacy_8: "Who processes it for us",
  lg_privacy_9: "<li><strong>Supabase</strong>: our database and app server, in its Frankfurt, Germany data centre (Amazon Web Services, eu-central-1). Your business data, account and billing records are stored here.</li><li><strong>Paymob</strong>: our card payment company in Egypt. It receives your name, email and mobile number with each payment, and keeps your card on file for renewals under its own privacy policy.</li><li><strong>Resend</strong>: sends our sign-in and account emails. It receives your email address and the message, and may process them in the United States.</li><li><strong>GitHub Pages</strong>: hosts this website and the app's page files, and keeps standard server logs. GitHub is based in the United States.</li><li><strong>WhatsApp</strong> (Meta): only if you choose to message us there.</li>",
  lg_privacy_10: "This means your information is stored and processed outside Egypt, in Germany and the United States. We use well known providers that protect data with encryption and access controls, and we share only what each one needs.",
  lg_privacy_11: "Who can see your business data",
  lg_privacy_12: "Only you, by signing in with a code sent to your own email. The database refuses direct access: only the app's own server can read it, and it returns a workspace only to its signed-in owner. We do not look at your business data, except when you ask us for help and looking is the only way to give it.",
  lg_privacy_13: "How long we keep it",
  lg_privacy_14: "<li>Your account and business data: while your account exists, including after you stop renewal, so your workspace is waiting if you come back. Ask us and we delete it.</li><li>If you open the card page but never add a card and never sign in, we delete that account and its details after 30 days.</li><li>Security records: up to 12 months.</li><li>Billing records: as long as Egyptian tax and accounting law requires, even after the rest of your account is deleted.</li>",
  lg_privacy_15: "Cookies and browser storage",
  lg_privacy_16: "We do not use cookies. The website and app keep a few small items in your browser's storage so they work, such as your language and your sign-in. Details are in our <a href=\"#cookies\" data-go=\"cookies\">Cookie and storage policy</a>.",
  lg_privacy_17: "Your rights",
  lg_privacy_18: "You can ask us to:",
  lg_privacy_19: "<li>tell you what personal data we hold about you and give you a copy;</li><li>correct anything that is wrong;</li><li>delete your account and data (billing records we must keep by law are the exception);</li><li>stop using your data for a purpose you object to, or withdraw a consent you gave.</li>",
  lg_privacy_20: "Message us on WhatsApp at +20 109 009 9849. We may ask you to confirm the request from your account email, so nobody else can ask for your data. We reply as soon as we can, and within the time the law requires. If you are not satisfied, you can complain to Egypt's Personal Data Protection Center.",
  lg_privacy_21: "Security",
  lg_privacy_22: "Connections to the website and app are encrypted (HTTPS). Sign-in codes expire after 10 minutes and work once. The database is locked so that only the app's server can reach it. No method is perfectly secure, but if a breach affected your data we would tell you and the authorities as the law requires.",
  lg_privacy_23: "Children",
  lg_privacy_24: "The service is for businesses and is not meant for anyone under 18. We do not knowingly collect data about children.",
  lg_privacy_25: "Changes to this policy",
  lg_privacy_26: "If we change this policy in a way that matters, we will post the new version here with a new date, and tell subscribers by email before the change applies to them.",
  lg_privacy_27: "Business details",
  lg_privacy_28: "<li><strong>Trading name:</strong> Etlob Sa7</li><li><strong>What we sell:</strong> a monthly or yearly subscription to an online demand planning and purchasing app, for businesses</li><li><strong>Based in:</strong> Cairo, Egypt</li><li><strong>Contact:</strong> WhatsApp +20 109 009 9849</li><li><strong>Website:</strong> etlobsa7.com</li>",
  lg_terms_eb: "Legal",
  lg_terms_h: "Terms and conditions",
  lg_terms_d: "Last updated 3 October 2026.",
  lg_terms_0: "These terms are an agreement between you and Etlob Sa7 for using the website and the app. By starting a trial, paying for a plan or using the app, you agree to them, together with our <a href=\"#privacy\" data-go=\"privacy\">Privacy policy</a> and our <a href=\"#refunds\" data-go=\"refunds\">Refund and cancellation policy</a>.",
  lg_terms_1: "What the app is",
  lg_terms_2: "Etlob Sa7 is a subscription app that turns your sales history into demand forecasts, reorder points and purchase quantities. It is a decision support tool. It does not place orders for you, does not guarantee any sale, profit or supplier delivery, and does not replace your own judgement. You make the final decision on every order.",
  lg_terms_3: "Who can use it",
  lg_terms_4: "You must be at least 21 years old (the age of full legal capacity in Egypt) or otherwise legally able to enter into contracts, and you must use the app for a real or planned business, not for personal or household use.",
  lg_terms_5: "Your account",
  lg_terms_6: "You sign in with a one-time code sent to your email, so keep your email account secure. One account is for one subscriber's own business and works on up to two devices at a time. You are responsible for what happens in your account and for the accuracy of the data you enter.",
  lg_terms_7: "Free trial, billing and automatic renewal",
  lg_terms_8: "<li>Every plan starts with a free trial: 14 days on Basic and Pro, 5 days on Store. Each account gets one free trial.</li><li>To start the trial you add a card on Paymob's secure page. A one-time card check of 1 EGP is taken that day to confirm the card works.</li><li>You choose to pay monthly or yearly. A billing month is 30 days and a billing year is 360 days (12 billing months). A yearly plan costs the same as 10 months of the monthly price.</li><li>Unless you stop renewal before the trial ends, your card is charged the price of the plan and period you chose automatically when the trial ends, and then at the start of each new month or year, until you stop renewal.</li><li>Reminders: after a 14-day trial we email you 7 days before the first payment; on Store's 5-day trial we email you the day after it starts. On a yearly plan we email you 7 days before each renewal. Each reminder has a link to stop renewal online.</li><li>Prices are shown in Egyptian pounds on the pricing page and in the app before you pay, and are the amount charged.</li><li>If a payment fails, Paymob tries again and the app stays open for 3 days. If it still fails, access pauses until you pay. Your data is kept.</li><li>If you change plan or period after the trial, you pay the new price and any time already paid on the old plan is carried over at the new plan's price per day. If that time is worth more than a year of the new plan, switch when your current period ends.</li><li>Founding offer: the first 30 shops whose first full payment goes through become founding members. A founding member keeps the prices that applied on the day they became one, for any plan and period, for as long as their subscription continues without running out. If it runs out (renewal stopped and the paid period ended, or a failed payment not fixed within 3 days), the founding price ends and current prices apply. The pricing page shows how many places are left.</li><li>We may change prices for the future. We will tell you by email at least 14 days before a new price applies to you, and you can stop renewal before then. While a founding member's price lasts, it does not go up.</li>",
  lg_terms_9: "Cancelling and refunds",
  lg_terms_10: "Stop renewal any time in the app (Settings, then Plan and billing) or by messaging us on WhatsApp. Nothing more is charged, and you keep access until the end of the trial or the month or year you already paid for. After that the app pauses and your data stays saved. Refunds are covered by our <a href=\"#refunds\" data-go=\"refunds\">Refund and cancellation policy</a>.",
  lg_terms_11: "Using the app fairly",
  lg_terms_12: "You agree not to share or resell access, not to try to break, overload, scrape or reverse engineer the app, and not to use it for anything unlawful. We may suspend an account that does.",
  lg_terms_13: "Your data",
  lg_terms_14: "The sales, supplier and product data you enter is yours. You give us permission to store and process it only to run the app for you. You can ask for a copy or for it to be deleted at any time. See the <a href=\"#privacy\" data-go=\"privacy\">Privacy policy</a>.",
  lg_terms_15: "Our app and content",
  lg_terms_16: "The app, its design, text, calculations and the Etlob Sa7 name and logo belong to us. Your subscription gives you a personal, non-transferable right to use the app for your business while your plan or trial is active.",
  lg_terms_17: "Results are not guaranteed",
  lg_terms_18: "Forecasts, reorder points and order quantities are calculations based on the data you provide. They are not financial, accounting or legal advice, and they can be wrong, especially when data is incomplete, wrong or too short, when demand changes suddenly, or when a supplier is late. Review anything unusual before acting on it. The test results on our website come from public sales data with the assumptions stated there; they are not a promise of results for your business.",
  lg_terms_19: "Availability",
  lg_terms_20: "We work to keep the app available, but it may sometimes be unavailable for maintenance or because of problems with the internet or our providers. We do not promise uninterrupted service.",
  lg_terms_21: "Limitation of liability",
  lg_terms_22: "As far as the law allows, we are not liable for lost profits, lost sales, stock bought or not bought because of the app's output, or other indirect losses, and our total liability for any claim is limited to the amount you paid us in the three months before the claim. Nothing in these terms limits liability that the law does not allow to be limited, such as liability for fraud.",
  lg_terms_23: "Ending an account",
  lg_terms_24: "You can stop renewal or ask us to delete your account at any time. We can suspend or close an account for non-payment, misuse or a serious breach of these terms, and will tell you why first where reasonably possible.",
  lg_terms_25: "Changes to these terms",
  lg_terms_26: "If we change these terms in a way that matters, we will post the new version here with a new date and tell subscribers by email at least 14 days before it applies to them. If you do not agree, you can stop renewal before then.",
  lg_terms_27: "Law and disputes",
  lg_terms_28: "These terms are governed by the laws of the Arab Republic of Egypt. Please contact us first so we can try to solve any problem directly. Any dispute that cannot be solved this way goes to the competent courts in Cairo.",
  lg_terms_29: "Business details",
  lg_terms_30: "<li><strong>Trading name:</strong> Etlob Sa7</li><li><strong>What we sell:</strong> a monthly or yearly subscription to an online demand planning and purchasing app, for businesses</li><li><strong>Based in:</strong> Cairo, Egypt</li><li><strong>Contact:</strong> WhatsApp +20 109 009 9849</li><li><strong>Website:</strong> etlobsa7.com</li>",
  lg_cookies_eb: "Legal",
  lg_cookies_h: "Cookie and storage policy",
  lg_cookies_d: "Last updated 3 October 2026.",
  lg_cookies_0: "The short version",
  lg_cookies_1: "etlobsa7.com, the app and the demo set no cookies. We use no analytics, advertising or tracking tools, and every font and script is served from our own site, so loading a page does not contact Google, Facebook or any other tracker.",
  lg_cookies_2: "What we keep in your browser",
  lg_cookies_3: "To work, the website and app keep a few items in your browser's own storage (local storage and session storage). They stay on your device and are only sent to our server when needed to sign you in or check a payment:",
  lg_cookies_4: "<div class=\"legal-tbl\"><table><thead><tr><th>Name</th><th>Used on</th><th>What it is for</th><th>How long</th></tr></thead><tbody><tr><td><code>etlob-site-lang</code></td><td>Website</td><td>Remembers the language you chose for the website.</td><td>Until you clear it</td></tr><tr><td><code>es7.lang, es7.theme, es7.tab</code></td><td>App and demo</td><td>Remember your language, light or dark mode, and the last page you had open.</td><td>Until you clear it</td></tr><tr><td><code>es7.sid</code></td><td>App</td><td>Keeps you signed in. It holds a random sign-in key; our server stores only a scrambled (hashed) copy.</td><td>Until you sign out; the key stops working after 14 days without use</td></tr><tr><td><code>es7.pending</code></td><td>Website and app</td><td>The reference of a payment you just started, so we can confirm it when Paymob sends you back.</td><td>Removed when you sign in; ignored after 2 days</td></tr><tr><td><code>es7.ckForm (session storage)</code></td><td>Website and app</td><td>The plan, billing period, email, name and mobile you typed in the card form, so you do not retype them if a card is declined.</td><td>Deleted when you close the tab</td></tr><tr><td><code>es7.chkHide</code></td><td>App</td><td>Remembers that you hid the getting-started list.</td><td>Until you clear it</td></tr><tr><td><code>es7.signinEmail</code></td><td>Website and app</td><td>Passes the email you typed on the website to the sign-in page.</td><td>Removed as soon as it is read</td></tr></tbody></table></div>",
  lg_cookies_5: "Do we need your consent?",
  lg_cookies_6: "All of these are strictly necessary for features you ask for (signing in, paying, remembering your language), so we do not show a cookie banner. If we ever add analytics or advertising tools, we will ask for your consent first and update this page.",
  lg_cookies_7: "Other sites",
  lg_cookies_8: "When you go to Paymob's card page to pay, Paymob may set its own cookies needed to process the payment, under its own policy. WhatsApp links open WhatsApp only when you tap them.",
  lg_cookies_9: "Clearing it",
  lg_cookies_10: "You can delete these items any time from your browser settings (clear site data for etlobsa7.com). You will then need to sign in again and choose your language again.",
  lg_cookies_11: "Business details",
  lg_cookies_12: "<li><strong>Trading name:</strong> Etlob Sa7</li><li><strong>What we sell:</strong> a monthly or yearly subscription to an online demand planning and purchasing app, for businesses</li><li><strong>Based in:</strong> Cairo, Egypt</li><li><strong>Contact:</strong> WhatsApp +20 109 009 9849</li><li><strong>Website:</strong> etlobsa7.com</li>",
  lg_refunds_eb: "Legal",
  lg_refunds_h: "Refund and cancellation policy",
  lg_refunds_d: "Last updated 3 October 2026.",
  lg_refunds_0: "Free trial",
  lg_refunds_1: "Every plan starts free: 14 days on Basic and Pro, 5 days on Store. When you add your card, a one-time card check of 1 EGP is taken to confirm the card works; this check is not refunded. Stop renewal before the trial ends and the plan price is never charged.",
  lg_refunds_2: "How to cancel",
  lg_refunds_3: "Stop renewal any time in the app: Settings, then Plan and billing, then Stop renewal. Or message us on WhatsApp at +20 109 009 9849 and we do it for you. No form and no phone call. Nothing more is charged, and you keep access until the end of the trial or the month or year you already paid for.",
  lg_refunds_4: "Refunds",
  lg_refunds_5: "Because every plan starts with a free trial, and we remind you before the first payment and before each yearly renewal, payments are not refunded once charged, including yearly payments, part of a month or year, or time you did not use. This does not affect any right to a refund that the law gives you. We always refund in full:",
  lg_refunds_6: "<li>a payment taken twice for the same period;</li><li>a charge made after you stopped renewal in time;</li><li>a charge of the wrong amount (the difference is refunded).</li>",
  lg_refunds_7: "How to ask for a refund",
  lg_refunds_8: "Message us on WhatsApp at +20 109 009 9849 with your account email and the date of the charge. We reply within 3 working days. Approved refunds go back to the card you paid with, through Paymob; how long it takes to show on your statement depends on your bank.",
  lg_refunds_9: "Changing plan",
  lg_refunds_10: "If you move to another plan or period after the trial, time you already paid for is carried over to the new plan at its price per day. It is not paid out in cash.",
  lg_refunds_11: "Please talk to us first",
  lg_refunds_12: "If something looks wrong with a charge, message us before disputing it with your bank. It is usually faster to fix directly.",
  lg_refunds_13: "Business details",

  t261: 'كل الأرقام بالجنيه المصري. التكلفة الإجمالية بتجمع تكلفة الطلب، تكلفة التخزين، وهامش الربح الضايع بسبب نفاد المخزون. النظام كسب بالإحساس في 30 تجربة من 30، وكسب القالب العادي في 29 من 30.',
  t262: 'النتيجة اللي فعلا مهمة',
  t263: 'اقرا نسبة التوفر والمخزون مع بعض. أي حد يقدر يرفع الخدمة بشراء مخزون أكتر: القالب العادي احتفظ بـ 163,866 جنيه بضاعة علشان يوصل 98.2%. إنك توصل لـ 99.4% أعلى بمخزون أقل ده الجزء اللي محتاج الحساب. الفرق ده هو المنتج.',
  t264: 'إزاي الأداة نفسها اتأكد منها',
  t265: 'المحاكاة دي اتعملت على نموذج الجدول الأصلي. من ساعتها نفس محرك الحساب اتبنى تاني لتطبيق الويب واتعمله اختبار تاني، بشكل مستقل، قبل ما أي حد يقدر يشترك:',
  t266: 'كل معادلة اتراجعت مقابل حساب يدوي، ومقابل عشرات الحالات الصعبة: مساحة عمل فاضية، منتج بشهر بيانات واحد، تكلفة صفر، سعر أقل من التكلفة، موردين ناقصين، مخزون بالسالب، مفيش موردين خالص، وكتالوج كامل محمل.',
  t267: 'اتعمل اختبار على بيانات غلط علشان نتأكد إن فحص البيانات فعلا بيمسك المشاكل بدل ما يطلع كلام واثق وغلط بهدوء.',
  t268: 'تسجيل الدخول، صلاحية الاشتراك، وكل صفحة اتشغلوا من الأول للآخر في متصفح حقيقي قبل الإطلاق، باللغتين.',
  t269: 'ثلاث مشاكل حقيقية اتلاقت واتصلحت كده: اتنين من أشكال المواسم الجاهزة كان متوسطهم السنوي مش واحد بالظبط، وده كان بيغير مقاسات الطلب لمنتجات معينة من غير ما حد يحس؛ حالة صعبة في ترتيب الإيراد كانت ممكن تسيب محل من غير أي منتج في الفئة العليا خالص؛ وفحص القفزة المفاجئة كان بيعلم على منتجات ثابتة عادية. واجهة نضيفة بتثبت إن الأزرار شغالة. مش بتثبت إن الأرقام صح، وده بالظبط سبب إننا بنراجع ده لوحده في كل مرة أي حاجة بتتغير.',
  t270: 'الصراحة',

  t273: '<strong>دعم لقرارك، مش ضمان.</strong> مش هتتوقع مورد يختفي أو شحنة عالقة في الجمارك.',

  t275: '<strong>تحت 12 شهر تاريخ، التعديل الموسمي بيفضل مقفول.</strong> وتحت ستة شهور، فحص البيانات هيقولك ماتعتمدش عليه.',
  t276: '<strong>المواسم بتتعلم من مبيعات سنتين.</strong> لو عندك سنة واحدة، انت اللي بتختار شكل الموسم، لأن ديسمبر واحد كان حظ مش موسم.',
  t277: '<strong>المنتجات العشوائية هتفضل مكلفة.</strong> المبيعات اللي ملهاش نمط محتاجة مخزون أمان كبير، وده بيكلف فلوس.',
  t278: '<strong>من غير حسابات ولا كاشير ولا باركود ولا فروع متعددة.</strong> هي بتخطط، وانت بتعد مخزونك بطريقتك.',
  t279: '<strong>هي بجودة اللي بتكتبه بس.</strong> وعلشان كده فيه فحص البيانات.',

  t281: 'شهري أو سنوي. وقف التجديد وقت ما تحب.',
